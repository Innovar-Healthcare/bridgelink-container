# Build, test & publish the hardened (DHI) BridgeLink image  —  IRT-1356
#
# This workflow only PUBLISHES the hardened image (Dockerfile.dhi), tagged `<version>-dhi` /
# `latest-dhi`. It also builds + acceptance-tests + vuln-scans the Rocky image on PRs (IRT-1391 /
# IRT-1390), but never publishes it — the Rocky image keeps being published by its existing process.
#
# Publish destination is per version (IRT-1866). From 26.9 the images are customer-only and go to the
# private ECR registry; 26.6.0 and earlier stay on public Docker Hub and keep their weekly base-patch
# re-push. A version is never published to both — see the `private` flag below.
#
# Live in production (weekly schedule + manual workflow_dispatch runs have been publishing
# successfully since IRT-1356 landed). Required repo secrets/variables:
#   Secrets:
#     DOCKERHUB_USERNAME / DOCKERHUB_TOKEN   push target (innovarhealthcare/bridgelink)
#     DHI_USERNAME       / DHI_TOKEN         free Docker account, to pull the DHI base from dhi.io
#     AWS_CREDENTIALS                        contents of an ~/.aws/credentials file (only needed
#                                            when a BINARY_URL is an s3:// URL; harmless otherwise)
#     SLACK_WEBHOOK_URL   (optional)         Slack Incoming Webhook for the weekly scan summary
#                                            (notify-slack job); if unset, that job skips silently
#   Variables:
#     MAINTAINED_VERSIONS  JSON array of every DHI release line kept alive by the weekly rebuild,
#                          e.g. [{"version":"26.6.0","binary_url":"https://...","latest":false},
#                                {"version":"26.9.0","binary_url":"s3://...","latest":true,
#                                 "private":true}]
#                          Exactly one entry should have "latest": true — that's the one that gets
#                          the rolling latest-dhi / latest-dhi-slim tags.
#                          "private": true publishes that version to the private ECR registry
#                          INSTEAD of public Docker Hub (26.9+). Optional; omitted means public,
#                          so pre-26.9 entries need no edit.
#     AWS_PUBLISH_ROLE_ARN OIDC role assumed for the ECR push (bridgelink-publish, created by
#                          infra/ecr-stack.yaml). Assumable from the integration branch ONLY, so a
#                          private publish cannot be dispatched from a feature branch. Only needed
#                          once a "private" entry exists.
#     DEFAULT_VERSION      / DEFAULT_BINARY_URL   single version used only to gate PRs (dhi /
#                          test-rocky on pull_request) — pin these to the current newest release.
#
# Multi-version rebuild: the weekly schedule (and a manual dispatch left without a `version` input)
# rebuilds every entry in MAINTAINED_VERSIONS via a job matrix, so older supported lines keep
# getting the weekly DHI base-image security refresh alongside the newest release. Passing an
# explicit `version`/`binary_url` on workflow_dispatch instead does a one-off single-version publish
# (e.g. to ship a release that isn't in MAINTAINED_VERSIONS yet) without touching the others.

name: build-images

on:
  workflow_dispatch:
    inputs:
      version:
        description: "One-off: BridgeLink version tag to publish by itself (leave blank to rebuild every version in MAINTAINED_VERSIONS instead)"
        required: false
      binary_url:
        description: "One-off: BINARY_URL for the release tarball (s3:// or https://) — required if version is set"
        required: false
      push:
        description: "Push images"
        type: boolean
        default: true
      update_latest:
        description: "One-off only: also move the rolling latest-dhi tag for this version"
        type: boolean
        default: true
      private:
        description: "One-off only: publish to the private ECR registry instead of public Docker Hub (26.9+)"
        type: boolean
        default: false
  # Rebuild-on-base-update: DHI repatches frequently, so rebuild weekly to keep the near-zero-CVE
  # benefit. Rebuilds every version in the MAINTAINED_VERSIONS repo variable.
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  # PR gate: run the DHI acceptance suite (dhi job) when the image-relevant files change. The
  # publish steps within that job are skipped on pull_request (see their `if:`), so this never
  # pushes. Uses the DEFAULT_VERSION / DEFAULT_BINARY_URL repo variables (a single version — no
  # need to exercise every maintained line on every PR). Secrets are available because PRs come
  # from branches in this repo (not forks).
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "Dockerfile.dhi"
      - "bootstrap/**"
      - "scripts/install.sh"
      - "scripts/entrypoint.sh"
      # test/** rather than test/image-test.sh: the suite grew a second file in IRT-2015, and a
      # filter naming one file silently stops gating the rest.
      - "test/**"
      - ".trivyignore"
      - ".github/workflows/build-images.yml"
      # charts/** gates the `chart` job only. It was absent until IRT-2015, so the Helm chart
      # shipped with no CI at all — which is how values.schema.json came to forbid the very probe
      # keys deployment.yaml templated, with nothing to catch it.
      - "charts/**"

permissions:
  contents: read

# Cancel a superseded run for the same ref (e.g. rapid PR pushes) and avoid overlapping publishes.
concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Resolve inputs vs. scheduled-run defaults once, share with downstream jobs. Produces a `matrix`
  # output (JSON array of {version, binary_url, latest, private}) that the dhi job fans out over:
  #   - pull_request              -> single entry from DEFAULT_VERSION/DEFAULT_BINARY_URL (PR gate)
  #   - workflow_dispatch w/version -> single ad hoc entry from the version/binary_url/update_latest inputs
  #   - schedule, or workflow_dispatch w/o version -> every entry in MAINTAINED_VERSIONS
  params:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
      push: ${{ steps.p.outputs.push }}
      rocky_version: ${{ steps.p.outputs.rocky_version }}
      rocky_binary_url: ${{ steps.p.outputs.rocky_binary_url }}
    steps:
      - id: p
        env:
          # Passed via env (not spliced into the script) so JSON/URL content can't break shell
          # quoting or inject commands, regardless of what ends up in a repo variable or a manual
          # dispatch input.
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_BINARY_URL: ${{ github.event.inputs.binary_url }}
          INPUT_PUSH: ${{ github.event.inputs.push }}
          INPUT_UPDATE_LATEST: ${{ github.event.inputs.update_latest }}
          INPUT_PRIVATE: ${{ github.event.inputs.private }}
          DEFAULT_VERSION: ${{ vars.DEFAULT_VERSION }}
          DEFAULT_BINARY_URL: ${{ vars.DEFAULT_BINARY_URL }}
          MAINTAINED_VERSIONS_RAW: ${{ vars.MAINTAINED_VERSIONS }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            MATRIX=$(jq -nc --arg v "$DEFAULT_VERSION" --arg u "$DEFAULT_BINARY_URL" \
              '[{version:$v, binary_url:$u, latest:false, private:false}]')
            PUSH="false"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_VERSION" ]; then
            if [ -z "$INPUT_BINARY_URL" ]; then
              echo "::error::binary_url is required when version is set on a manual dispatch." >&2
              exit 1
            fi
            LATEST_FLAG="false"
            [ "$INPUT_UPDATE_LATEST" = "true" ] && LATEST_FLAG="true"
            PRIVATE_FLAG="false"
            [ "$INPUT_PRIVATE" = "true" ] && PRIVATE_FLAG="true"
            MATRIX=$(jq -nc --arg v "$INPUT_VERSION" --arg u "$INPUT_BINARY_URL" \
              --argjson l "$LATEST_FLAG" --argjson p "$PRIVATE_FLAG" \
              '[{version:$v, binary_url:$u, latest:$l, private:$p}]')
            PUSH="$INPUT_PUSH"
          else
            # Scheduled weekly rebuild, or a manual dispatch with no version override: rebuild every
            # maintained version so latest-dhi stays patched *and* older supported lines keep
            # getting the weekly DHI base-image security refresh.
            if [ -z "$MAINTAINED_VERSIONS_RAW" ]; then
              echo "::error::MAINTAINED_VERSIONS repo variable is empty or unset — nothing to rebuild." >&2
              exit 1
            fi
            # `private` must be a real JSON boolean or absent. Validate rather than coerce:
            # a string survives `.private // false` intact, and the two places that read it
            # disagree about what is true — GitHub `if:` expressions treat ANY non-empty
            # string as true, while Compute tags does [ "$v" = "true" ]. So "True" would take
            # the ECR branch for the login steps and the DOCKER HUB branch for the tags, and
            # the push would succeed because the job is already Docker Hub authenticated for
            # base-image pulls. That publishes a customer-only release publicly, on a green run.
            # Coercing with `.private == true` would be worse: someone who typed "yes" meaning
            # private would silently get a public push instead of an error.
            if ! jq -e 'all(.[]; (has("private") | not) or (.private | type == "boolean"))' \
                 <<<"$MAINTAINED_VERSIONS_RAW" >/dev/null; then
              echo "::error::MAINTAINED_VERSIONS has a non-boolean \"private\" value. Use true or false (unquoted), or omit the key." >&2
              jq -c '.[] | select(has("private") and (.private | type != "boolean")) | {version, private}' \
                <<<"$MAINTAINED_VERSIONS_RAW" >&2 || true
              exit 1
            fi
            MATRIX=$(jq -c 'map(.private = (.private // false))' <<<"$MAINTAINED_VERSIONS_RAW")
            if [ "$(jq 'length' <<<"$MATRIX")" -eq 0 ]; then
              echo "::error::MAINTAINED_VERSIONS repo variable parsed to an empty array — nothing to rebuild." >&2
              exit 1
            fi
            PUSH="$([ "$EVENT_NAME" = "schedule" ] && echo true || echo "$INPUT_PUSH")"
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "push=$PUSH" >> "$GITHUB_OUTPUT"
          echo "rocky_version=${INPUT_VERSION:-$DEFAULT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "rocky_binary_url=${INPUT_BINARY_URL:-$DEFAULT_BINARY_URL}" >> "$GITHUB_OUTPUT"

  # Test + publish the hardened (DHI) image, one job run per matrix version (see params for what
  # populates the matrix). Test and publish are steps of the SAME job run so a failure in one
  # version's acceptance suite/Trivy gate only skips that version's publish steps — it does not
  # block or skip the other versions' job runs, which are wholly independent (fail-fast: false).
  # Publish steps are gated `if: github.event_name != 'pull_request'`, so a PR only exercises the
  # test/gate steps and never pushes. The Rocky image (Dockerfile) is intentionally NOT built or
  # pushed here — it keeps being published by its own existing process (test-rocky below only
  # builds a throwaway local image for PR testing).
  dhi:
    needs: params
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload the Trivy SARIF to Security > Code scanning (IRT-1390)
      id-token: write          # OIDC to AWS for the private ECR push (IRT-1866)
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.params.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3   # needed for the multi-arch publish build below
      - uses: docker/setup-buildx-action@v3
      - name: Log in to dhi.io (DHI base pull)
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}
      # Authenticate Docker Hub pulls so the suite's nginx/postgres/mysql pulls don't hit the
      # anonymous pull-rate limit on shared runner IPs. These credentials also carry push
      # rights, so they are what a public release is pushed with further down.
      - name: Log in to Docker Hub (authenticated pulls)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Build a local (native-arch) test image — not pushed.
      - name: Build DHI test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dhi
          load: true
          push: false
          tags: innovarhealthcare/bridgelink:dhi-test-${{ matrix.version }}
          build-args: |
            BINARY_URL=${{ matrix.binary_url }}
          # Only pass AWS creds on trusted (non-PR) events — needed for s3:// tarballs. On
          # pull_request the build uses the public-https default, so pass empty to avoid exposing
          # the secret to PR-branch code.
          secrets: |
            aws_credentials=${{ github.event_name != 'pull_request' && secrets.AWS_CREDENTIALS || '' }}
      - name: Run acceptance tests
        # DHI defaults (EXPECTED_UID=65532, CHECK_NO_SHELL=1, DOCKERFILE=Dockerfile.dhi) are implicit.
        run: IMAGE=innovarhealthcare/bridgelink:dhi-test-${{ matrix.version }} SKIP_BUILD=1 bash test/image-test.sh

      # Gate the WebAdmin-only (slim) variant too: build it with the Swing Administrator stripped and
      # run the same suite plus the strip assertion (EXPECT_NO_ADMIN_CLIENT). Proves the server still
      # boots/serves /api without client-lib/public_html.
      - name: Build DHI slim test image (INCLUDE_ADMIN_CLIENT=false)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dhi
          load: true
          push: false
          tags: innovarhealthcare/bridgelink:dhi-slim-test-${{ matrix.version }}
          build-args: |
            BINARY_URL=${{ matrix.binary_url }}
            INCLUDE_ADMIN_CLIENT=false
          secrets: |
            aws_credentials=${{ github.event_name != 'pull_request' && secrets.AWS_CREDENTIALS || '' }}
      - name: Run acceptance tests (slim)
        run: |
          IMAGE=innovarhealthcare/bridgelink:dhi-slim-test-${{ matrix.version }} SKIP_BUILD=1 \
            EXPECT_NO_ADMIN_CLIENT=1 bash test/image-test.sh

      # --- Vulnerability scan (IRT-1390) -----------------------------------------------------------
      # Full report (all severities, incl. unfixed) -> SARIF -> Security tab. Non-failing so the gate
      # below is the single source of pass/fail; uploaded even if a later step fails (if: always()).
      - name: Trivy scan (SARIF, full report) — DHI
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: innovarhealthcare/bridgelink:dhi-test-${{ matrix.version }}
          scanners: vuln
          format: sarif
          output: trivy-dhi-${{ matrix.version }}.sarif
          exit-code: "0"
        env:
          # Full report must include everything; do NOT apply .trivyignore here (it stays scoped to
          # the gate step) so allowlisted findings remain visible in the Security tab.
          TRIVY_IGNOREFILE: /dev/null
      - name: Upload Trivy SARIF — DHI
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-dhi-${{ matrix.version }}.sarif
          category: trivy-dhi-${{ matrix.version }}
      # Gate: fail the run on FIXABLE HIGH/CRITICAL in OS/base packages — the layer this repo owns.
      # Library CVEs from the bundled BridgeLink app JARs come from the Core release tarball and can't
      # be fixed here; they're surfaced in the SARIF above and tracked against Core (see README).
      # .trivyignore (repo root) is auto-applied for accepted OS findings.
      - name: Trivy gate (fixable HIGH/CRITICAL, OS packages) — DHI
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: innovarhealthcare/bridgelink:dhi-test-${{ matrix.version }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
        env:
          TRIVY_PKG_TYPES: os

      # --- Publish (multi-arch) --------------------------------------------------------------------
      # Everything below only runs on trusted (non-PR) events, and only for this matrix entry's
      # version — a Trivy-gate failure above already stopped this job run before reaching here,
      # without touching any other version's job run.
      #
      # Destination is per matrix entry (IRT-1866). `private: true` publishes ONLY to the private ECR
      # registry (26.9+, customer-only); otherwise ONLY to public Docker Hub, which is exactly the
      # behaviour the 26.3.1 / 26.6.0 lines had before private publishing existed. The two are
      # mutually exclusive on purpose: without that, the weekly rebuild would leak a private release
      # to Docker Hub.
      # No Docker Hub login here: the unconditional "authenticated pulls" step above already
      # authenticated this job with the same credentials, which carry push rights. A second
      # conditional login would read as the public/private safety valve without being one —
      # buildx pushes with whatever auth the daemon already holds, so what actually decides
      # the destination is the tag list computed below.
      #
      # OIDC -> temporary AWS creds for the ECR push. Same role the s3:// binary fetch already uses
      # (vars.AWS_ROLE_ARN), so no new long-lived credentials — it carries the bridgelink-ecr-push
      # policy from infra/ecr-stack.yaml. Region is us-east-2 (the registry); the in-build s3:// fetch
      # keeps its own region from the AWS_CREDENTIALS secret and is unaffected.
      # bridgelink-publish (infra/ecr-stack.yaml) is trusted for refs/heads/main ONLY, because
      # these tags are mutable: push access is the ability to replace an already-released
      # customer image. The weekly schedule runs on main, so it is unaffected; a private publish
      # dispatched from a feature branch will fail to assume the role, which is intended. Use
      # push: false for a feature-branch dry run.
      - name: Configure AWS credentials (OIDC)
        if: github.event_name != 'pull_request' && matrix.private
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: us-east-2
          # The session is used ONLY for the ECR login here — the in-build s3:// fetch uses the
          # AWS_CREDENTIALS secret, and the long multi-arch build rides the 12h ECR token, so
          # this duration does not have to cover the build.
          role-duration-seconds: 3600

      - name: Log in to Amazon ECR (private push target)
        if: github.event_name != 'pull_request' && matrix.private
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Version tag always; rolling latest-dhi only when this matrix entry's `latest` flag is set
      # (exactly one entry in MAINTAINED_VERSIONS should be latest:true). The slim variant
      # (WebAdmin-only, no Swing Administrator) gets the same tags with a `-slim` suffix.
      #
      # The variant lives in the repository NAME for ECR (bridgelink-dhi) and in the TAG for Docker
      # Hub (bridgelink:<ver>-dhi), because Docker Hub has one repository for everything while ECR
      # gets one per variant. The `-dhi` tag suffix is kept on both so a single tag string identifies
      # a build regardless of where it was published — worth the redundancy in `bridgelink-dhi:<ver>-dhi`
      # while 26.6 and earlier are still on Docker Hub.
      - name: Compute tags
        if: github.event_name != 'pull_request'
        id: tags
        # Values via env rather than spliced into the script, per this workflow's convention:
        # VERSION originates from a repo variable or a dispatch input.
        env:
          PRIVATE: ${{ matrix.private }}
          LATEST: ${{ matrix.latest }}
          VERSION: ${{ matrix.version }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          if [ "$PRIVATE" = "true" ]; then
            if [ -z "$REGISTRY" ]; then
              echo "::error::ECR login produced no registry — cannot publish $VERSION privately." >&2
              exit 1
            fi
            T="$REGISTRY/innovarhealthcare/bridgelink-dhi:${VERSION}-dhi"
            S="$REGISTRY/innovarhealthcare/bridgelink-dhi-slim:${VERSION}-dhi-slim"
            if [ "$LATEST" = "true" ]; then
              T="$T"$'\n'"$REGISTRY/innovarhealthcare/bridgelink-dhi:latest-dhi"
              S="$S"$'\n'"$REGISTRY/innovarhealthcare/bridgelink-dhi-slim:latest-dhi-slim"
            fi
          else
            T="innovarhealthcare/bridgelink:${VERSION}-dhi"
            S="innovarhealthcare/bridgelink:${VERSION}-dhi-slim"
            if [ "$LATEST" = "true" ]; then
              T="$T"$'\n'"innovarhealthcare/bridgelink:latest-dhi"
              S="$S"$'\n'"innovarhealthcare/bridgelink:latest-dhi-slim"
            fi
          fi
          { echo "list<<EOF"; echo "$T"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          { echo "slim<<EOF"; echo "$S"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Build & push DHI image
        if: github.event_name != 'pull_request'
        id: dhi
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dhi
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.params.outputs.push == 'true' }}
          build-args: |
            BINARY_URL=${{ matrix.binary_url }}
          # Mounted at /root/.aws/credentials for s3:// pulls (Dockerfile.dhi: --mount=type=secret,id=aws_credentials).
          secrets: |
            aws_credentials=${{ secrets.AWS_CREDENTIALS }}
          tags: ${{ steps.tags.outputs.list }}

      # WebAdmin-only variant: same image with the Swing Administrator stripped (INCLUDE_ADMIN_CLIENT=false).
      - name: Build & push DHI slim image (WebAdmin-only)
        id: slim
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dhi
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.params.outputs.push == 'true' }}
          build-args: |
            BINARY_URL=${{ matrix.binary_url }}
            INCLUDE_ADMIN_CLIENT=false
          secrets: |
            aws_credentials=${{ secrets.AWS_CREDENTIALS }}
          tags: ${{ steps.tags.outputs.slim }}

      # Tags in these repositories are MUTABLE by design — the weekly rebuild re-pushes
      # <version>-dhi after Docker repatches the hardened base, which is the whole point of the DHI
      # variant. The immutable release identity is therefore the manifest DIGEST, so surface it here:
      # this is what goes in the release notes and what a customer pins when they need a reference
      # that cannot move under them.
      - name: Record published digests
        if: github.event_name != 'pull_request' && needs.params.outputs.push == 'true'
        # Values via env rather than spliced into the script, per this workflow's convention.
        env:
          VERSION: ${{ matrix.version }}
          DESTINATION: ${{ matrix.private && 'private ECR' || 'public Docker Hub' }}
          DHI_DIGEST: ${{ steps.dhi.outputs.digest }}
          SLIM_DIGEST: ${{ steps.slim.outputs.digest }}
        run: |
          {
            echo "### $VERSION ($DESTINATION)"
            echo
            echo "| variant | digest |"
            echo "| --- | --- |"
            echo "| dhi | \`$DHI_DIGEST\` |"
            echo "| dhi-slim | \`$SLIM_DIGEST\` |"
            echo
            echo "Tags are mutable; pin by digest for an immutable reference."
          } >> "$GITHUB_STEP_SUMMARY"

  # Gate: build the Rocky image single-arch, run the same acceptance suite (UID 1000, shell present),
  # then scan it (IRT-1391). Mirrors the dhi job's test steps. Rocky PUBLISHING is unaffected — this only builds a
  # throwaway local image for PR testing; the Rocky image keeps being published by its own process.
  test-rocky:
    needs: params
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Authenticated Docker Hub pulls (the rockylinux base + the suite's nginx/postgres/mysql pulls;
      # avoids the anonymous pull-rate limit on shared runner IPs).
      - name: Log in to Docker Hub (authenticated pulls)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build Rocky test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: innovarhealthcare/bridgelink:rocky-test
          build-args: |
            BINARY_URL=${{ needs.params.outputs.rocky_binary_url }}
          # Only pass AWS creds on trusted (non-PR) events — see the dhi job's test steps for the rationale.
          secrets: |
            aws_credentials=${{ github.event_name != 'pull_request' && secrets.AWS_CREDENTIALS || '' }}
      - name: Run acceptance tests
        # Rocky runs as UID 1000 and ships a shell, so the no-shell assertion is skipped for it.
        run: |
          IMAGE=innovarhealthcare/bridgelink:rocky-test SKIP_BUILD=1 \
            DOCKERFILE=Dockerfile EXPECTED_UID=1000 CHECK_NO_SHELL=0 \
            bash test/image-test.sh
      - name: Trivy scan (SARIF, full report) — Rocky
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: innovarhealthcare/bridgelink:rocky-test
          scanners: vuln
          format: sarif
          output: trivy-rocky.sarif
          exit-code: "0"
        env:
          # Full report must include everything; .trivyignore stays scoped to the gate step below.
          TRIVY_IGNOREFILE: /dev/null
      - name: Upload Trivy SARIF — Rocky
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-rocky.sarif
          category: trivy-rocky
      # Gate on OS/base packages only (see the DHI gate above for the rationale).
      - name: Trivy gate (fixable HIGH/CRITICAL, OS packages) — Rocky
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: innovarhealthcare/bridgelink:rocky-test
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
        env:
          TRIVY_PKG_TYPES: os

  # Post the image-scan summary to Slack (IRT-1390). Fires on the weekly scheduled scan and on manual
  # workflow_dispatch (for an on-demand report) — never on pull_request, so PRs stay quiet (new-PR
  # notifications are handled by the GitHub Slack app). One message: each image's gate result + total
  # finding count + links. Skips silently if SLACK_WEBHOOK_URL is unset, and never reds the run on a
  # Slack hiccup (a delivery failure is a warning, not a build failure).
  # Helm chart gate (IRT-2015). Deliberately independent of the image jobs: it needs no registry
  # login, no BINARY_URL and no secrets, so a chart-only PR gets a real check in ~30s.
  #
  # The `--set` step is the point of the schema half of IRT-2015, not a nicety: before it,
  # values.schema.json declared `additionalProperties: false` on `bridgelink` while
  # deployment.yaml templated livenessProbe/readinessProbe, so those templates were unreachable and
  # any attempt to set a probe was rejected by the schema. `helm template` alone would NOT have
  # caught that — the defaults now validate fine. Only overriding proves the schema accepts them.
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: helm lint charts/bridgelink

      - name: helm template (defaults)
        run: helm template bl charts/bridgelink > /tmp/rendered.yaml

      - name: Probes are actually rendered
        run: |
          set -euo pipefail
          for probe in startupProbe readinessProbe livenessProbe; do
            grep -q "$probe:" /tmp/rendered.yaml || { echo "::error::$probe missing from rendered output"; exit 1; }
          done
          # The probe must be exec-form and reference the class both images compile, or the chart is
          # pointing at something that does not exist in the image.
          grep -q "BridgeLinkHealthcheck" /tmp/rendered.yaml \
            || { echo "::error::rendered probes do not reference BridgeLinkHealthcheck"; exit 1; }
          # Liveness must stay the cheap httpGet: if someone switches it to the body-parsing exec
          # probe, a transient database outage starts restarting pods instead of just de-registering
          # them. That is a deliberate design split, so pin it.
          python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml
          python3 - <<'PY'
          import sys, yaml
          docs = [d for d in yaml.safe_load_all(open('/tmp/rendered.yaml')) if d]
          dep = next(d for d in docs if d['kind'] == 'Deployment' and d['metadata']['name'].endswith('-bl'))
          c = next(c for c in dep['spec']['template']['spec']['containers'] if c['name'] == 'bridgelink')
          assert 'httpGet' in c['livenessProbe'], 'livenessProbe must be httpGet, not exec'
          hdrs = {h['name']: h['value'] for h in c['livenessProbe']['httpGet'].get('httpHeaders', [])}
          assert 'X-Requested-With' in hdrs, 'livenessProbe httpGet needs X-Requested-With or the API returns 400'
          assert c['livenessProbe']['httpGet']['scheme'] == 'HTTPS', 'livenessProbe must use HTTPS'
          for p in ('startupProbe', 'readinessProbe'):
              assert 'exec' in c[p], f'{p} must be exec (body parsing; httpGet cannot tell ready from starting)'
              # k8s defaults exec probes to timeoutSeconds:1 and enforces it; a cold JVM exceeds that.
              assert c[p].get('timeoutSeconds', 1) >= 5, f'{p} needs timeoutSeconds >= 5'
          print('probe shape OK')
          PY

      - name: Schema accepts probe overrides
        run: |
          set -euo pipefail
          helm template bl charts/bridgelink \
            --set bridgelink.startupProbe.failureThreshold=120 \
            --set bridgelink.readinessProbe.periodSeconds=30 \
            --set bridgelink.livenessProbe.periodSeconds=60 > /dev/null
          echo "probe overrides accepted by values.schema.json"
          # And the documented way to switch one off must work.
          helm template bl charts/bridgelink --set bridgelink.startupProbe=null \
            | grep -q "startupProbe:" && { echo "::error::startupProbe=null did not disable it"; exit 1; }
          echo "startupProbe=null disables it"

      - name: Chart README is regenerated from values.yaml
        run: |
          set -euo pipefail
          # README.md is generated by helm-docs from README.md.gotmpl + the `# --` comments in
          # values.yaml. Editing values without regenerating leaves the published table wrong, so
          # fail the PR rather than let the two drift.
          docker run --rm -v "$PWD/charts:/helm-docs" -u "$(id -u)" jnorwood/helm-docs:latest \
            --chart-search-root=/helm-docs --template-files=README.md.gotmpl
          if ! git diff --quiet charts/bridgelink/README.md; then
            echo "::error::charts/bridgelink/README.md is stale — run helm-docs and commit the result"
            git diff -- charts/bridgelink/README.md
            exit 1
          fi
          echo "chart README is current"

  notify-slack:
    needs: [params, dhi, test-rocky]
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read   # read code-scanning analyses for the finding counts
    steps:
      - name: Post scan summary to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DHI_RESULT: ${{ needs.dhi.result }}
          ROCKY_RESULT: ${{ needs.test-rocky.result }}
          MATRIX_JSON: ${{ needs.params.outputs.matrix }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not set — skipping Slack notification."; exit 0
          fi
          icon() { [ "$1" = "success" ] && printf ':white_check_mark:' || printf ':x:'; }
          # latest results_count for a category on this run's ref (best-effort; 'n/a' if unavailable)
          count() {
            gh api "repos/$REPO/code-scanning/analyses?ref=$REF&per_page=100" \
              --jq "map(select(.category==\"$1\"))|.[0].results_count // \"n/a\"" 2>/dev/null || echo "n/a"
          }
          sec="$SERVER_URL/$REPO/security/code-scanning"
          run="$SERVER_URL/$REPO/actions/runs/$RUN_ID"
          # One DHI line per maintained version (each has its own trivy-dhi-<version> SARIF category).
          dhi_lines=""
          while IFS= read -r v; do
            dhi_lines="$dhi_lines"$'\n'"  - \`$v\`-dhi: $(count "trivy-dhi-$v") findings"
          done < <(echo "$MATRIX_JSON" | jq -r '.[].version')
          text="$(printf '%s\n' \
            "*BridgeLink container — image scan summary* (\`main\`)" \
            "$(icon "$DHI_RESULT") DHI gate: \`$DHI_RESULT\`$dhi_lines" \
            "$(icon "$ROCKY_RESULT") Rocky gate: \`$ROCKY_RESULT\`  ·  $(count trivy-rocky) findings" \
            "<$sec|Code scanning report>  ·  <$run|workflow run>" \
            "_Gate = fixable HIGH/CRITICAL OS packages; counts are all-severity incl. bundled libraries (IRT-1396)._")"
          payload="$(jq -n --arg t "$text" '{text:$t}')"
          code="$(curl -s -o /tmp/slack_resp -w '%{http_code}' -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL")"
          echo "Slack HTTP $code: $(cat /tmp/slack_resp)"
          [ "$code" = "200" ] || echo "::warning::Slack notification returned HTTP $code"
