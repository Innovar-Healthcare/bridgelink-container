# Build, test & publish the hardened (DHI) BridgeLink image  —  IRT-1356
#
# This workflow only PUBLISHES the hardened image (Dockerfile.dhi), tagged `<version>-dhi` /
# `latest-dhi`. It also builds + acceptance-tests + vuln-scans the Rocky image on PRs (IRT-1391 /
# IRT-1390), but never publishes it — the Rocky image keeps being published by its existing process.
#
# Publish destination is per version, selected by each entry's `private` flag (see below): a version
# goes either to the private ECR registry or to public Docker Hub, never to both. Every maintained
# version keeps its weekly base-patch re-push regardless of destination.
#
# Live in production (weekly schedule + manual workflow_dispatch runs have been publishing
# successfully since IRT-1356 landed). Required repo secrets/variables:
#   Secrets:
#     DOCKERHUB_USERNAME / DOCKERHUB_TOKEN   push target (innovarhealthcare/bridgelink)
#     DHI_USERNAME       / DHI_TOKEN         free Docker account, to pull the DHI base from dhi.io
#     AWS_CREDENTIALS                        contents of an ~/.aws/credentials file (only needed
#                                            when a BINARY_URL is an s3:// URL; harmless otherwise)
#     SLACK_WEBHOOK_URL   (optional)         Slack Incoming Webhook for the weekly scan summary
#                                            (notify-slack job); if unset, that job skips silently
#   Variables:
#     MAINTAINED_VERSIONS  JSON array of every DHI release line kept alive by the weekly rebuild,
#                          e.g. [{"version":"<ver>","binary_url":"https://...","latest":false},
#                                {"version":"<ver>","binary_url":"s3://...","latest":true,
#                                 "private":true}]
#                          Exactly one UNQUALIFIED entry should have "latest": true — that's the one
#                          that gets the rolling latest-dhi / latest-dhi-slim tags. An entry with a
#                          tag_suffix has its own rolling pair (latest-dhi<suffix>), so "latest" is
#                          one-per-qualifier rather than one overall; the gate below enforces it.
#                          "private": true publishes that version to the private ECR registry
#                          INSTEAD of public Docker Hub. Optional; omitted means public, so an
#                          existing public entry needs no edit.
#                          "java": 17 or 21 — the JDK the image is built on (Dockerfile.dhi's
#                          JAVA_MAJOR). Optional; OMITTED MEANS 17, because every entry written
#                          before this field existed is a release that shipped on 17, and a
#                          missing field must never move an already-released tag to a new JDK.
#                          26.6.1 and later need 21 (embedded Derby aborts on 17), so a new entry
#                          for those must say "java": 21 explicitly — if it does not, the
#                          acceptance suite fails on the Derby boot and nothing is pushed.
#                          "tag_suffix": a qualifier appended to this entry's published tags, e.g.
#                          "-jdk17" gives <ver>-dhi-jdk17 / <ver>-dhi-slim-jdk17. Optional; omitted
#                          means no qualifier. It exists so ONE version can be published on TWO
#                          JDKs: without it a second entry for the same version resolves to the same
#                          tag and the weekly rebuild replaces an already-released image. Entries
#                          that would publish the same tag are rejected before anything is built —
#                          that check, not reviewer attention, is what makes an omitted suffix safe,
#                          because this variable lives in repo settings and never goes through a PR.
#                          A "-jdkN" suffix must agree with this entry's "java": nothing downstream
#                          can catch a tag that names a JDK the image was not built on, since the
#                          suite compares the runtime to the build-arg and never to the tag.
#                          "derby_unsupported": true when this release's bundled Derby cannot run on
#                          this entry's "java" — a 26.6.1-or-later release built on 17. The
#                          acceptance suite then runs every default-backend container against an
#                          external database, and asserts the server REFUSES to start on the shipped
#                          Derby default. Optional; omitted means false. It cannot be derived from
#                          "java" < 21: 26.3.1 and 26.6.0 are also built on 17 and their Derby boots
#                          fine. Forgetting it is loud — every default-backend container hits the
#                          preflight and the suite fails red, before any push.
#     AWS_PUBLISH_ROLE_ARN OIDC role assumed for the ECR push (bridgelink-publish). Assumable from
#                          the integration branch ONLY, so a private publish cannot be dispatched
#                          from a feature branch. Only needed once a "private" entry exists.
#     DEFAULT_VERSION      / DEFAULT_BINARY_URL   single version used only to gate PRs (dhi /
#                          test-rocky on pull_request) — pin these to the current newest release.
#     DEFAULT_JAVA         the JDK the PR gate builds that version on. Optional; unset means 21.
#                          Pin it next to DEFAULT_VERSION: the gate can only prove the build
#                          honoured its JAVA_MAJOR, not that the JDK was the right one for the
#                          release, so a 17 release gated on 21 is green without exercising the
#                          17 path anything ships on. When DEFAULT_VERSION moves to 26.6.1 this
#                          can stay unset.
#
# Multi-version rebuild: the weekly schedule (and a manual dispatch left without a `version` input)
# rebuilds every entry in MAINTAINED_VERSIONS via a job matrix, so older supported lines keep
# getting the weekly DHI base-image security refresh alongside the newest release. Passing an
# explicit `version`/`binary_url` on workflow_dispatch instead does a one-off single-version publish
# (e.g. to ship a release that isn't in MAINTAINED_VERSIONS yet) without touching the others.

name: build-images

on:
  workflow_dispatch:
    inputs:
      version:
        description: "One-off: BridgeLink version tag to publish by itself (leave blank to rebuild every version in MAINTAINED_VERSIONS instead)"
        required: false
      binary_url:
        description: "One-off: BINARY_URL for the release tarball (s3:// or https://) — required if version is set"
        required: false
      java:
        description: "One-off: Java major override. Optional — a version already in MAINTAINED_VERSIONS resolves to its pinned JDK; an unlisted new release defaults to 21. Set only to publish a brand-new release on a non-default JDK."
        required: false
      tag_suffix:
        description: "One-off: qualifier appended to the published tags, e.g. -jdk17 for a second build of a version already published on another JDK (leave blank for none)"
        required: false
        default: ""
      derby_unsupported:
        description: "One-off: this build cannot use embedded Derby (a 26.6.1+ release built on Java 17) — test against an external database and assert the Derby default is refused"
        type: boolean
        default: false
      push:
        description: "Push images"
        type: boolean
        default: true
      update_latest:
        description: "One-off only: also move the rolling latest-dhi tag for this version"
        type: boolean
        default: true
      private:
        description: "One-off only: publish to the private ECR registry instead of public Docker Hub"
        type: boolean
        default: false
  # Rebuild-on-base-update: DHI repatches frequently, so rebuild weekly to keep the near-zero-CVE
  # benefit. Rebuilds every version in the MAINTAINED_VERSIONS repo variable.
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  # PR gate: run the DHI acceptance suite (dhi job) when the image-relevant files change. The
  # publish steps within that job are skipped on pull_request (see their `if:`), so this never
  # pushes. Uses the DEFAULT_VERSION / DEFAULT_BINARY_URL repo variables (a single version — no
  # need to exercise every maintained line on every PR). Secrets are available because PRs come
  # from branches in this repo (not forks).
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "Dockerfile.dhi"
      - "bootstrap/**"
      - "scripts/install.sh"
      - "scripts/entrypoint.sh"
      # test/** rather than test/image-test.sh: the suite grew a second file in IRT-2015, and a
      # filter naming one file silently stops gating the rest.
      - "test/**"
      - ".trivyignore"
      - ".github/workflows/build-images.yml"

permissions:
  contents: read

# Cancel a superseded run for the same ref (e.g. rapid PR pushes) and avoid overlapping publishes.
concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Resolve inputs vs. scheduled-run defaults once, share with downstream jobs. Produces a `matrix`
  # output (JSON array of {version, binary_url, java, latest, private}) that the dhi job fans out over:
  #   - pull_request              -> single entry from DEFAULT_VERSION/DEFAULT_BINARY_URL/DEFAULT_JAVA (PR gate)
  #   - workflow_dispatch w/version -> single ad hoc entry from the version/binary_url/java/update_latest inputs
  #   - schedule, or workflow_dispatch w/o version -> every entry in MAINTAINED_VERSIONS
  params:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
      push: ${{ steps.p.outputs.push }}
      rocky_version: ${{ steps.p.outputs.rocky_version }}
      rocky_binary_url: ${{ steps.p.outputs.rocky_binary_url }}
      rocky_java: ${{ steps.p.outputs.rocky_java }}
      rocky_derby_unsupported: ${{ steps.p.outputs.rocky_derby_unsupported }}
    steps:
      - id: p
        env:
          # Passed via env (not spliced into the script) so JSON/URL content can't break shell
          # quoting or inject commands, regardless of what ends up in a repo variable or a manual
          # dispatch input.
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_BINARY_URL: ${{ github.event.inputs.binary_url }}
          INPUT_JAVA: ${{ github.event.inputs.java }}
          INPUT_PUSH: ${{ github.event.inputs.push }}
          INPUT_UPDATE_LATEST: ${{ github.event.inputs.update_latest }}
          INPUT_PRIVATE: ${{ github.event.inputs.private }}
          INPUT_TAG_SUFFIX: ${{ github.event.inputs.tag_suffix }}
          INPUT_DERBY_UNSUPPORTED: ${{ github.event.inputs.derby_unsupported }}
          DEFAULT_VERSION: ${{ vars.DEFAULT_VERSION }}
          DEFAULT_BINARY_URL: ${{ vars.DEFAULT_BINARY_URL }}
          DEFAULT_JAVA: ${{ vars.DEFAULT_JAVA }}
          MAINTAINED_VERSIONS_RAW: ${{ vars.MAINTAINED_VERSIONS }}
        run: |
          set -euo pipefail
          # Every matrix entry carries `java` (the JAVA_MAJOR build-arg) so the build and the
          # acceptance suite's EXPECTED_JAVA assertion always agree on which JDK was meant.
          # A dispatch names it; the PR gate takes DEFAULT_JAVA (see the header); otherwise the
          # Dockerfiles' own default (21, the current release line).
          # A tag qualifier is what lets one version be published on two JDKs. Both checks below
          # run on every path, so a one-off dispatch is validated exactly like the repo variable.
          #  - shape: a leading '-' is mandatory and ':' and '/' are excluded, so a bad value can
          #    never redirect the push to a different repository or registry.
          #  - agreement: nothing downstream can catch a "-jdk17" tag on an image built with
          #    JAVA_MAJOR=21, because EXPECTED_JAVA compares the runtime to the build-arg and never
          #    to the tag. This is the only place that mismatch is visible.
          validate_suffix() {   # $1 = suffix (may be empty), $2 = java major
            [ -z "$1" ] && return 0
            if ! [[ "$1" =~ ^-[a-z0-9][a-z0-9._-]{0,30}$ ]]; then
              echo "::error::tag_suffix must start with '-' and contain only lowercase letters, digits, '.', '_' or '-', got '$1'." >&2
              exit 1
            fi
            if [[ "$1" =~ ^-jdk([0-9]+)$ ]] && [ "${BASH_REMATCH[1]}" != "$2" ]; then
              echo "::error::tag_suffix '$1' disagrees with java '$2' — the tag would name a JDK the image was not built on." >&2
              exit 1
            fi
          }

          ROCKY_JAVA="${INPUT_JAVA:-${DEFAULT_JAVA:-21}}"
          # Tracks ROCKY_JAVA: whichever JDK the Rocky gate builds on, the suite has to be told
          # whether that build can use embedded Derby. Only a dispatch that matches a
          # derby_unsupported entry sets it; the PR gate and the weekly run build DEFAULT_VERSION,
          # which is a Java 21 release.
          ROCKY_DERBY="false"
          if ! [[ "$ROCKY_JAVA" =~ ^[0-9]+$ ]]; then
            echo "::error::java must be a bare major version such as 17 or 21, got '$ROCKY_JAVA'." >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # tag_suffix/derby_unsupported are spelled out rather than left absent so every
            # (matrix entries carry version, binary_url, java, latest, private, tag_suffix and
            # derby_unsupported on every path)
            # `matrix.<field>` splice downstream has a value on every event type.
            MATRIX=$(jq -nc --arg v "$DEFAULT_VERSION" --arg u "$DEFAULT_BINARY_URL" --arg j "$ROCKY_JAVA" \
              '[{version:$v, binary_url:$u, java:$j, latest:false, private:false, tag_suffix:"", derby_unsupported:false}]')
            PUSH="false"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_VERSION" ]; then
            if [ -z "$INPUT_BINARY_URL" ]; then
              echo "::error::binary_url is required when version is set on a manual dispatch." >&2
              exit 1
            fi
            # Same guard as the publish workflows: if this version is already maintained, its
            # pinned JDK wins (an omitted "java" means 17) and a conflicting java input is refused
            # — a one-off dispatch must never move an already-released tag onto a different JDK.
            # An unlisted (brand-new) version keeps ROCKY_JAVA (the java input, else DEFAULT_JAVA,
            # else 21). ROCKY_JAVA feeds both this matrix entry and the rocky_java output below.
            #
            # The lookup is keyed on (version, tag_suffix), not version alone, because one version
            # can now be published on two JDKs. Keyed on version alone, `.[0]` would resolve by
            # array order — so a dispatch of the Java 17 build could silently pick up the Java 21
            # entry's JDK, or vice versa, depending on how someone happened to order the variable.
            if [ -n "${MAINTAINED_VERSIONS_RAW:-}" ]; then
              PINNED_JAVA="$(jq -r --arg v "$INPUT_VERSION" --arg s "$INPUT_TAG_SUFFIX" \
                'map(select(.version==$v and (.tag_suffix // "")==$s)) | if length>0 then (.[0].java // 17 | tostring) else "" end' \
                <<<"$MAINTAINED_VERSIONS_RAW")"
              if [ -n "$PINNED_JAVA" ]; then
                if [ -n "$INPUT_JAVA" ] && [ "$INPUT_JAVA" != "$PINNED_JAVA" ]; then
                  echo "::error::$INPUT_VERSION${INPUT_TAG_SUFFIX} is pinned to Java $PINNED_JAVA in MAINTAINED_VERSIONS; refusing to build it on Java $INPUT_JAVA — that would move an already-released tag's JDK. To publish this version on a second JDK, add a separate entry with its own tag_suffix and dispatch with that suffix." >&2
                  exit 1
                fi
                ROCKY_JAVA="$PINNED_JAVA"
                # derby_unsupported is pinned from the same entry, for the same reason: it describes
                # the image this line publishes, so a one-off rebuild of a maintained line should not
                # depend on the operator remembering to tick it. An unlisted version takes the input.
                PINNED_DERBY="$(jq -r --arg v "$INPUT_VERSION" --arg s "$INPUT_TAG_SUFFIX" \
                  'map(select(.version==$v and (.tag_suffix // "")==$s)) | .[0].derby_unsupported // false | tostring' \
                  <<<"$MAINTAINED_VERSIONS_RAW")"
                [ "$PINNED_DERBY" = "true" ] && INPUT_DERBY_UNSUPPORTED=true
                # Destination is pinned from the entry for the same reason the JDK is, and it is the
                # more costly one to get wrong: a maintained line that is published privately and
                # dispatched with `private` unticked would push that image to public Docker Hub.
                # A disagreeing input is refused rather than overridden, so the operator sees it.
                PINNED_PRIVATE="$(jq -r --arg v "$INPUT_VERSION" --arg s "$INPUT_TAG_SUFFIX" \
                  'map(select(.version==$v and (.tag_suffix // "")==$s)) | .[0].private // false | tostring' \
                  <<<"$MAINTAINED_VERSIONS_RAW")"
                if [ "$INPUT_PRIVATE" = "true" ] && [ "$PINNED_PRIVATE" != "true" ]; then
                  echo "::error::$INPUT_VERSION${INPUT_TAG_SUFFIX} is published publicly per MAINTAINED_VERSIONS; refusing a private dispatch. Change the entry if the destination is meant to move." >&2
                  exit 1
                fi
                if [ "$PINNED_PRIVATE" = "true" ] && [ "$INPUT_PRIVATE" != "true" ]; then
                  echo "::error::$INPUT_VERSION${INPUT_TAG_SUFFIX} is published to the private registry per MAINTAINED_VERSIONS; refusing a dispatch that would push it to public Docker Hub. Tick the private input." >&2
                  exit 1
                fi
                # Finding: a rolling tag on a qualified line has no healer. The weekly rebuild only
                # re-pushes latest-dhi<suffix> for an entry with latest:true, so moving one from a
                # one-off dispatch against a latest:false entry strands a tag that is never
                # repatched again — while the README promises the weekly refresh.
                PINNED_LATEST="$(jq -r --arg v "$INPUT_VERSION" --arg s "$INPUT_TAG_SUFFIX" \
                  'map(select(.version==$v and (.tag_suffix // "")==$s)) | .[0].latest // false | tostring' \
                  <<<"$MAINTAINED_VERSIONS_RAW")"
                if [ "$INPUT_UPDATE_LATEST" = "true" ] && [ "$PINNED_LATEST" != "true" ]; then
                  echo "::error::$INPUT_VERSION${INPUT_TAG_SUFFIX} is not the latest line in MAINTAINED_VERSIONS, so the rolling tag it would move is one the weekly rebuild never re-pushes. Set update_latest=false, or make that entry latest:true." >&2
                  exit 1
                fi
              fi
            fi
            validate_suffix "$INPUT_TAG_SUFFIX" "$ROCKY_JAVA"
            LATEST_FLAG="false"
            [ "$INPUT_UPDATE_LATEST" = "true" ] && LATEST_FLAG="true"
            PRIVATE_FLAG="false"
            [ "$INPUT_PRIVATE" = "true" ] && PRIVATE_FLAG="true"
            DERBY_FLAG="false"
            [ "$INPUT_DERBY_UNSUPPORTED" = "true" ] && DERBY_FLAG="true"
            ROCKY_DERBY="$DERBY_FLAG"
            MATRIX=$(jq -nc --arg v "$INPUT_VERSION" --arg u "$INPUT_BINARY_URL" --arg j "$ROCKY_JAVA" \
              --arg s "$INPUT_TAG_SUFFIX" \
              --argjson l "$LATEST_FLAG" --argjson p "$PRIVATE_FLAG" --argjson d "$DERBY_FLAG" \
              '[{version:$v, binary_url:$u, java:$j, latest:$l, private:$p, tag_suffix:$s, derby_unsupported:$d}]')
            PUSH="$INPUT_PUSH"
          else
            # Scheduled weekly rebuild, or a manual dispatch with no version override: rebuild every
            # maintained version so latest-dhi stays patched *and* older supported lines keep
            # getting the weekly DHI base-image security refresh.
            if [ -z "$MAINTAINED_VERSIONS_RAW" ]; then
              echo "::error::MAINTAINED_VERSIONS repo variable is empty or unset — nothing to rebuild." >&2
              exit 1
            fi
            # `private` must be a real JSON boolean or absent. Validate rather than coerce:
            # a string survives `.private // false` intact, and the two places that read it
            # disagree about what is true — GitHub `if:` expressions treat ANY non-empty
            # string as true, while Compute tags does [ "$v" = "true" ]. So "True" would take
            # the ECR branch for the login steps and the DOCKER HUB branch for the tags, and
            # the push would succeed because the job is already Docker Hub authenticated for
            # base-image pulls. That pushes a version flagged private to the public registry,
            # on a green run.
            # Coercing with `.private == true` would be worse: someone who typed "yes" meaning
            # private would silently get a public push instead of an error.
            if ! jq -e 'all(.[]; (has("private") | not) or (.private | type == "boolean"))' \
                 <<<"$MAINTAINED_VERSIONS_RAW" >/dev/null; then
              echo "::error::MAINTAINED_VERSIONS has a non-boolean \"private\" value. Use true or false (unquoted), or omit the key." >&2
              jq -c '.[] | select(has("private") and (.private | type != "boolean")) | {version, private}' \
                <<<"$MAINTAINED_VERSIONS_RAW" >&2 || true
              exit 1
            fi
            # `java`, when present, must be a bare major version (number or numeric string). It is
            # normalised to a string because it is spliced into a build-arg and compared as text
            # by the acceptance suite. An OMITTED field means 17 — see the header: every entry that
            # predates the field is a Java 17 release, and the weekly rebuild must never move a
            # released tag to a different JDK just because a field was not filled in.
            if ! jq -e 'all(.[]; (has("java") | not) or ((.java | tostring) | test("^[0-9]+$")))' \
                 <<<"$MAINTAINED_VERSIONS_RAW" >/dev/null; then
              echo "::error::MAINTAINED_VERSIONS has a non-numeric \"java\" value. Use 17 or 21, or omit the key (which means 17)." >&2
              jq -c '.[] | select(has("java") and ((.java | tostring) | test("^[0-9]+$") | not)) | {version, java}' \
                <<<"$MAINTAINED_VERSIONS_RAW" >&2 || true
              exit 1
            fi
            # `derby_unsupported` must be a real JSON boolean or absent, for the same reason
            # `private` must be: it is read both by a GitHub `if:`-style expression splice and by a
            # string comparison in the suite, and those two disagree about what a bare string means.
            if ! jq -e 'all(.[]; (has("derby_unsupported") | not) or (.derby_unsupported | type == "boolean"))' \
                 <<<"$MAINTAINED_VERSIONS_RAW" >/dev/null; then
              echo "::error::MAINTAINED_VERSIONS has a non-boolean \"derby_unsupported\" value. Use true or false (unquoted), or omit the key." >&2
              jq -c '.[] | select(has("derby_unsupported") and (.derby_unsupported | type != "boolean")) | {version, derby_unsupported}' \
                <<<"$MAINTAINED_VERSIONS_RAW" >&2 || true
              exit 1
            fi
            # `tag_suffix` shape, and its agreement with the entry's `java` — same rules the
            # dispatch path gets, applied per entry.
            # java first, suffix second: a tab is IFS whitespace, so `read` collapses a LEADING
            # empty field and an entry with no tag_suffix would otherwise read its java as the
            # suffix and be rejected. A trailing empty field reads as empty, which is correct.
            while IFS=$'\t' read -r _j _s; do
              validate_suffix "$_s" "$_j"
            done < <(jq -r '.[] | [((.java // 17) | tostring), (.tag_suffix // "")] | @tsv' \
                       <<<"$MAINTAINED_VERSIONS_RAW")
            MATRIX=$(jq -c 'map(.private = (.private // false)
                                | .java = ((.java // 17) | tostring)
                                | .tag_suffix = (.tag_suffix // "")
                                | .derby_unsupported = (.derby_unsupported // false))' \
              <<<"$MAINTAINED_VERSIONS_RAW")
            if [ "$(jq 'length' <<<"$MATRIX")" -eq 0 ]; then
              echo "::error::MAINTAINED_VERSIONS repo variable parsed to an empty array — nothing to rebuild." >&2
              exit 1
            fi
            # THE anti-overwrite gate. Two entries that publish the same tag would have the weekly
            # rebuild replace one already-released image with the other, on a green run and with
            # nothing in the log saying so. This runs before any build, so a duplicate stops the
            # whole run with nothing pushed — and since MAINTAINED_VERSIONS is a repo variable
            # rather than a file, this check is the only review it ever gets.
            #
            # It compares the ACTUAL image references, enumerated exactly as Compute tags builds
            # them, rather than a version+suffix key. The suffix is appended to the tag while the
            # variant sits between version and suffix, so those two are not the same comparison:
            # an entry with tag_suffix "-slim" publishes <ver>-dhi-slim, which is another entry's
            # SLIM tag, and a version+suffix key sees no duplicate. Rolling tags are enumerated
            # here too, so this also covers two entries claiming the same latest tag.
            DUPES="$(jq -r '.[] |
                       (if .private then
                          {d:"ecr", f:"innovarhealthcare/bridgelink-dhi", s:"innovarhealthcare/bridgelink-dhi-slim"}
                        else
                          {d:"hub", f:"innovarhealthcare/bridgelink", s:"innovarhealthcare/bridgelink"}
                        end) as $r
                       | [ "\($r.d) \($r.f):\(.version)-dhi\(.tag_suffix)",
                           "\($r.d) \($r.s):\(.version)-dhi-slim\(.tag_suffix)" ]
                         + (if .latest then
                              [ "\($r.d) \($r.f):latest-dhi\(.tag_suffix)",
                                "\($r.d) \($r.s):latest-dhi-slim\(.tag_suffix)" ]
                            else [] end)
                       | .[]' <<<"$MATRIX" | sort | uniq -d)"
            if [ -n "$DUPES" ]; then
              echo "::error::Two MAINTAINED_VERSIONS entries publish the same image reference, so this rebuild would replace an already-released image. Give one of them a distinct tag_suffix (e.g. -jdk17), or check which entry owns the rolling latest tag. Colliding: $(tr '\n' ' ' <<<"$DUPES")" >&2
              exit 1
            fi
            PUSH="$([ "$EVENT_NAME" = "schedule" ] && echo true || echo "$INPUT_PUSH")"
          fi
          # Print the resolved plan before anything is built. On the one-off dispatch path there is
          # nothing for the uniqueness gate above to compare against — a dispatch naming an existing
          # version with a blank tag_suffix is a legitimate rebuild of that tag — so this summary is
          # the operator's last chance to notice that the tags are not the ones they meant.
          {
            echo "### Planned builds"
            echo
            echo "| tags | java | destination | push |"
            echo "|---|---|---|---|"
            jq -r --arg push "$PUSH" '.[] |
              "| `\(.version)-dhi\(.tag_suffix)` + `\(.version)-dhi-slim\(.tag_suffix)`"
              + (if .latest then " + `latest-dhi\(.tag_suffix)` + `latest-dhi-slim\(.tag_suffix)`" else "" end)
              + " | \(.java) | \(if .private then "private ECR" else "public Docker Hub" end) | \($push) |"' \
              <<<"$MATRIX"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "push=$PUSH" >> "$GITHUB_OUTPUT"
          echo "rocky_version=${INPUT_VERSION:-$DEFAULT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "rocky_binary_url=${INPUT_BINARY_URL:-$DEFAULT_BINARY_URL}" >> "$GITHUB_OUTPUT"
          echo "rocky_java=$ROCKY_JAVA" >> "$GITHUB_OUTPUT"
          echo "rocky_derby_unsupported=$ROCKY_DERBY" >> "$GITHUB_OUTPUT"

  # Test + publish the hardened (DHI) image, one job run per matrix version (see params for what
  # populates the matrix). Test and publish are steps of the SAME job run so a failure in one
  # version's acceptance suite/Trivy gate only skips that version's publish steps — it does not
  # block or skip the other versions' job runs, which are wholly independent (fail-fast: false).
  # Publish steps are gated `if: github.event_name != 'pull_request'`, so a PR only exercises the
  # test/gate steps and never pushes. The Rocky image (Dockerfile) is intentionally NOT built or
  # pushed here — it keeps being published by its own existing process (test-rocky below only
  # builds a throwaway local image for PR testing).
  dhi:
    needs: params
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload the Trivy SARIF to Security > Code scanning (IRT-1390)
      id-token: write          # OIDC to AWS for the private ECR push (IRT-1866)
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.params.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3   # needed for the multi-arch publish build below
      - uses: docker/setup-buildx-action@v3
      - name: Log in to dhi.io (DHI base pull)
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}
      # Authenticate Docker Hub pulls so the suite's nginx/postgres/mysql pulls don't hit the
      # anonymous pull-rate limit on shared runner IPs. These credentials also carry push
      # rights, so they are what a public release is pushed with further down.
      - name: Log in to Docker Hub (authenticated pulls)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Build a local (native-arch) test image — not pushed.
      - name: Build DHI test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dhi
          load: true
          push: false
          tags: innovarhealthcare/bridgelink:dhi-test-${{ matrix.version }}${{ matrix.tag_suffix }}
          build-args: |
            BINARY_URL=${{ matrix.binary_url }}
            JAVA_MAJOR=${{ matrix.java }}
          # Only pass AWS creds on trusted (non-PR) events — needed for s3:// tarballs. On
          # pull_request the build uses the public-https default, so pass empty to avoid exposing
          # the secret to PR-branch code.
          secrets: |
            aws_credentials=${{ github.event_name != 'pull_request' && secrets.AWS_CREDENTIALS || '' }}
      - name: Run acceptance tests
        # DHI defaults (EXPECTED_UID=65532, CHECK_NO_SHELL=1, DOCKERFILE=Dockerfile.dhi) are implicit.
        # EXPECTED_JAVA makes the suite prove the runtime is on the JDK this matrix entry asked for.
        #
        # derby_unsupported selects the suite's external-database mode: the shipped Derby default
        # cannot run on this entry's JDK, so every otherwise-default container is pointed at a
        # throwaway postgres and the Derby default is asserted to be REFUSED rather than ignored.
        # On every entry without the flag these render as derby/0, which is the historical behaviour.
        env:
          DEFAULT_DB: ${{ matrix.derby_unsupported && 'postgres' || 'derby' }}
          EXPECT_DERBY_EXIT: ${{ matrix.derby_unsupported && '1' || '0' }}
        run: |
          IMAGE=innovarhealthcare/bridgelink:dhi-test-${{ matrix.version }}${{ matrix.tag_suffix }} SKIP_BUILD=1 \
            EXPECTED_JAVA=${{ matrix.java }} bash test/image-test.sh

      # Gate the WebAdmin-only (slim) variant too: build it with the Swing Administrator stripped and
      # run the same suite plus the strip assertion (EXPECT_NO_ADMIN_CLIENT). Proves the server still
      # boots/serves /api without client-lib/public_html.
      - name: Build DHI slim test image (INCLUDE_ADMIN_CLIENT=false)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dhi
          load: true
          push: false
          tags: innovarhealthcare/bridgelink:dhi-slim-test-${{ matrix.version }}${{ matrix.tag_suffix }}
          build-args: |
            BINARY_URL=${{ matrix.binary_url }}
            JAVA_MAJOR=${{ matrix.java }}
            INCLUDE_ADMIN_CLIENT=false
          secrets: |
            aws_credentials=${{ github.event_name != 'pull_request' && secrets.AWS_CREDENTIALS || '' }}
      - name: Run acceptance tests (slim)
        env:
          DEFAULT_DB: ${{ matrix.derby_unsupported && 'postgres' || 'derby' }}
          EXPECT_DERBY_EXIT: ${{ matrix.derby_unsupported && '1' || '0' }}
        run: |
          IMAGE=innovarhealthcare/bridgelink:dhi-slim-test-${{ matrix.version }}${{ matrix.tag_suffix }} SKIP_BUILD=1 \
            EXPECT_NO_ADMIN_CLIENT=1 EXPECTED_JAVA=${{ matrix.java }} bash test/image-test.sh

      # --- Vulnerability scan (IRT-1390) -----------------------------------------------------------
      # Full report (all severities, incl. unfixed) -> SARIF -> Security tab. Non-failing so the gate
      # below is the single source of pass/fail; uploaded even if a later step fails (if: always()).
      - name: Trivy scan (SARIF, full report) — DHI
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: innovarhealthcare/bridgelink:dhi-test-${{ matrix.version }}${{ matrix.tag_suffix }}
          scanners: vuln
          format: sarif
          output: trivy-dhi-${{ matrix.version }}${{ matrix.tag_suffix }}.sarif
          exit-code: "0"
        env:
          # Full report must include everything; do NOT apply .trivyignore here (it stays scoped to
          # the gate step) so allowlisted findings remain visible in the Security tab.
          TRIVY_IGNOREFILE: /dev/null
      # Keyed on version+tag_suffix, not version: two entries for one version (the same release on
      # two JDKs) would otherwise upload two analyses under one category for the same ref, and the
      # Security tab would show them as one image with the findings of whichever finished last.
      - name: Upload Trivy SARIF — DHI
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-dhi-${{ matrix.version }}${{ matrix.tag_suffix }}.sarif
          category: trivy-dhi-${{ matrix.version }}${{ matrix.tag_suffix }}
      # Gate: fail the run on FIXABLE HIGH/CRITICAL in OS/base packages — the layer this repo owns.
      # Library CVEs from the bundled BridgeLink app JARs come from the Core release tarball and can't
      # be fixed here; they're surfaced in the SARIF above and tracked against Core (see README).
      # .trivyignore (repo root) is auto-applied for accepted OS findings.
      - name: Trivy gate (fixable HIGH/CRITICAL, OS packages) — DHI
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: innovarhealthcare/bridgelink:dhi-test-${{ matrix.version }}${{ matrix.tag_suffix }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
        env:
          TRIVY_PKG_TYPES: os

      # --- Publish (multi-arch) --------------------------------------------------------------------
      # Everything below only runs on trusted (non-PR) events, and only for this matrix entry's
      # version — a Trivy-gate failure above already stopped this job run before reaching here,
      # without touching any other version's job run.
      #
      # Destination is per matrix entry. `private: true` publishes ONLY to the private ECR registry;
      # otherwise ONLY to public Docker Hub, which is exactly the behaviour every line had before
      # private publishing existed. The two are mutually exclusive on purpose: without that, the
      # weekly rebuild would push a private release to Docker Hub.
      # No Docker Hub login here: the unconditional "authenticated pulls" step above already
      # authenticated this job with the same credentials, which carry push rights. A second
      # conditional login would read as the public/private safety valve without being one —
      # buildx pushes with whatever auth the daemon already holds, so what actually decides
      # the destination is the tag list computed below.
      #
      # OIDC -> temporary AWS creds for the ECR push. Same role the s3:// binary fetch already uses
      # (vars.AWS_ROLE_ARN), so no new long-lived credentials — it carries the bridgelink-ecr-push
      # policy. Region is us-east-2 (the registry); the in-build s3:// fetch keeps its own region
      # from the AWS_CREDENTIALS secret and is unaffected.
      # bridgelink-publish is trusted for refs/heads/main ONLY, because these tags are mutable:
      # push access is the ability to replace an already-released image. The weekly schedule runs
      # on main, so it is unaffected; a private publish dispatched from a feature branch will fail
      # to assume the role, which is intended. Use push: false for a feature-branch dry run.
      - name: Configure AWS credentials (OIDC)
        if: github.event_name != 'pull_request' && matrix.private
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: us-east-2
          # The session is used ONLY for the ECR login here — the in-build s3:// fetch uses the
          # AWS_CREDENTIALS secret, and the long multi-arch build rides the 12h ECR token, so
          # this duration does not have to cover the build.
          role-duration-seconds: 3600

      - name: Log in to Amazon ECR (private push target)
        if: github.event_name != 'pull_request' && matrix.private
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Version tag always; rolling latest-dhi only when this matrix entry's `latest` flag is set
      # (one owner per qualifier — see the header). The slim variant
      # (WebAdmin-only, no Swing Administrator) gets the same tags with a `-slim` suffix.
      #
      # matrix.tag_suffix, when set, is appended to every tag this entry publishes — including the
      # rolling ones, so a qualified line has its own `latest-dhi<suffix>` rather than competing for
      # the unqualified one. That is one rule instead of two, and params already rejects two entries
      # claiming the same rolling tag. Unqualified tags always mean the release's primary JDK.
      #
      # The variant lives in the repository NAME for ECR (bridgelink-dhi) and in the TAG for Docker
      # Hub (bridgelink:<ver>-dhi), because Docker Hub has one repository for everything while ECR
      # gets one per variant. The `-dhi` tag suffix is kept on both so a single tag string identifies
      # a build regardless of where it was published — worth the redundancy in `bridgelink-dhi:<ver>-dhi`
      # while 26.6 and earlier are still on Docker Hub.
      - name: Compute tags
        if: github.event_name != 'pull_request'
        id: tags
        # Values via env rather than spliced into the script, per this workflow's convention:
        # VERSION originates from a repo variable or a dispatch input.
        env:
          PRIVATE: ${{ matrix.private }}
          LATEST: ${{ matrix.latest }}
          VERSION: ${{ matrix.version }}
          SUFFIX: ${{ matrix.tag_suffix }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          # Re-validate the qualifier here, as the last gate before a push: params validated it, but
          # this is the step that actually composes a registry reference, and a value carrying ':'
          # or '/' would silently retarget the push rather than fail.
          if [ -n "$SUFFIX" ] && ! [[ "$SUFFIX" =~ ^-[a-z0-9][a-z0-9._-]{0,30}$ ]]; then
            echo "::error::refusing to push with tag_suffix '$SUFFIX'." >&2
            exit 1
          fi
          if [ "$PRIVATE" = "true" ]; then
            if [ -z "$REGISTRY" ]; then
              echo "::error::ECR login produced no registry — cannot publish $VERSION privately." >&2
              exit 1
            fi
            T="$REGISTRY/innovarhealthcare/bridgelink-dhi:${VERSION}-dhi${SUFFIX}"
            S="$REGISTRY/innovarhealthcare/bridgelink-dhi-slim:${VERSION}-dhi-slim${SUFFIX}"
            if [ "$LATEST" = "true" ]; then
              T="$T"$'\n'"$REGISTRY/innovarhealthcare/bridgelink-dhi:latest-dhi${SUFFIX}"
              S="$S"$'\n'"$REGISTRY/innovarhealthcare/bridgelink-dhi-slim:latest-dhi-slim${SUFFIX}"
            fi
          else
            T="innovarhealthcare/bridgelink:${VERSION}-dhi${SUFFIX}"
            S="innovarhealthcare/bridgelink:${VERSION}-dhi-slim${SUFFIX}"
            if [ "$LATEST" = "true" ]; then
              T="$T"$'\n'"innovarhealthcare/bridgelink:latest-dhi${SUFFIX}"
              S="$S"$'\n'"innovarhealthcare/bridgelink:latest-dhi-slim${SUFFIX}"
            fi
          fi
          { echo "list<<EOF"; echo "$T"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          { echo "slim<<EOF"; echo "$S"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Build & push DHI image
        if: github.event_name != 'pull_request'
        id: dhi
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dhi
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.params.outputs.push == 'true' }}
          build-args: |
            BINARY_URL=${{ matrix.binary_url }}
            JAVA_MAJOR=${{ matrix.java }}
          # Mounted at /root/.aws/credentials for s3:// pulls (Dockerfile.dhi: --mount=type=secret,id=aws_credentials).
          secrets: |
            aws_credentials=${{ secrets.AWS_CREDENTIALS }}
          tags: ${{ steps.tags.outputs.list }}

      # WebAdmin-only variant: same image with the Swing Administrator stripped (INCLUDE_ADMIN_CLIENT=false).
      - name: Build & push DHI slim image (WebAdmin-only)
        id: slim
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dhi
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.params.outputs.push == 'true' }}
          build-args: |
            BINARY_URL=${{ matrix.binary_url }}
            JAVA_MAJOR=${{ matrix.java }}
            INCLUDE_ADMIN_CLIENT=false
          secrets: |
            aws_credentials=${{ secrets.AWS_CREDENTIALS }}
          tags: ${{ steps.tags.outputs.slim }}

      # Tags in these repositories are MUTABLE by design — the weekly rebuild re-pushes
      # <version>-dhi after Docker repatches the hardened base, which is the whole point of the DHI
      # variant. The immutable release identity is therefore the manifest DIGEST, so surface it here:
      # this is what goes in the release notes, and what to pin when a reference must not move.
      - name: Record published digests
        if: github.event_name != 'pull_request' && needs.params.outputs.push == 'true'
        # Values via env rather than spliced into the script, per this workflow's convention.
        env:
          VERSION: ${{ matrix.version }}
          SUFFIX: ${{ matrix.tag_suffix }}
          JAVA: ${{ matrix.java }}
          DESTINATION: ${{ matrix.private && 'private ECR' || 'public Docker Hub' }}
          DHI_DIGEST: ${{ steps.dhi.outputs.digest }}
          SLIM_DIGEST: ${{ steps.slim.outputs.digest }}
        run: |
          {
            # Heading carries the qualifier and the JDK: two entries for one version publish two
            # different images, and a summary that headed both "### <version>" would read as one.
            echo "### ${VERSION}${SUFFIX} — Java $JAVA ($DESTINATION)"
            echo
            echo "| variant | tag | digest |"
            echo "| --- | --- | --- |"
            echo "| dhi | \`${VERSION}-dhi${SUFFIX}\` | \`$DHI_DIGEST\` |"
            echo "| dhi-slim | \`${VERSION}-dhi-slim${SUFFIX}\` | \`$SLIM_DIGEST\` |"
            echo
            echo "Tags are mutable; pin by digest for an immutable reference."
          } >> "$GITHUB_STEP_SUMMARY"

  # Gate: build the Rocky image single-arch, run the same acceptance suite (UID 1000, shell present),
  # then scan it (IRT-1391). Mirrors the dhi job's test steps. Rocky PUBLISHING is unaffected — this only builds a
  # throwaway local image for PR testing; the Rocky image keeps being published by its own process.
  test-rocky:
    needs: params
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Authenticated Docker Hub pulls (the rockylinux base + the suite's nginx/postgres/mysql pulls;
      # avoids the anonymous pull-rate limit on shared runner IPs).
      - name: Log in to Docker Hub (authenticated pulls)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build Rocky test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: innovarhealthcare/bridgelink:rocky-test
          build-args: |
            BINARY_URL=${{ needs.params.outputs.rocky_binary_url }}
            JAVA_MAJOR=${{ needs.params.outputs.rocky_java }}
          # Only pass AWS creds on trusted (non-PR) events — see the dhi job's test steps for the rationale.
          secrets: |
            aws_credentials=${{ github.event_name != 'pull_request' && secrets.AWS_CREDENTIALS || '' }}
      - name: Run acceptance tests
        # Rocky runs as UID 1000 and ships a shell, so the no-shell assertion is skipped for it.
        #
        # The suite mode has to follow rocky_java, exactly as it does in the dhi job. This gate
        # builds whatever JDK params resolved, so a dispatch for a release whose bundled Derby
        # cannot run on that JDK produces a Rocky image with the same constraint as the hardened
        # one -- and running it in derby mode fails every default-backend container at the
        # preflight, which is a property of the release and not a defect in the image.
        env:
          DEFAULT_DB: ${{ needs.params.outputs.rocky_derby_unsupported == 'true' && 'postgres' || 'derby' }}
          EXPECT_DERBY_EXIT: ${{ needs.params.outputs.rocky_derby_unsupported == 'true' && '1' || '0' }}
        run: |
          IMAGE=innovarhealthcare/bridgelink:rocky-test SKIP_BUILD=1 \
            DOCKERFILE=Dockerfile EXPECTED_UID=1000 CHECK_NO_SHELL=0 \
            EXPECTED_JAVA=${{ needs.params.outputs.rocky_java }} \
            bash test/image-test.sh
      - name: Trivy scan (SARIF, full report) — Rocky
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: innovarhealthcare/bridgelink:rocky-test
          scanners: vuln
          format: sarif
          output: trivy-rocky.sarif
          exit-code: "0"
        env:
          # Full report must include everything; .trivyignore stays scoped to the gate step below.
          TRIVY_IGNOREFILE: /dev/null
      - name: Upload Trivy SARIF — Rocky
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-rocky.sarif
          category: trivy-rocky
      # Gate on OS/base packages only (see the DHI gate above for the rationale).
      - name: Trivy gate (fixable HIGH/CRITICAL, OS packages) — Rocky
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: innovarhealthcare/bridgelink:rocky-test
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
        env:
          TRIVY_PKG_TYPES: os

  # Post the image-scan summary to Slack (IRT-1390). Fires on the weekly scheduled scan and on manual
  # workflow_dispatch (for an on-demand report) — never on pull_request, so PRs stay quiet (new-PR
  # notifications are handled by the GitHub Slack app). One message: each image's gate result + total
  # finding count + links. Skips silently if SLACK_WEBHOOK_URL is unset, and never reds the run on a
  # Slack hiccup (a delivery failure is a warning, not a build failure).
  notify-slack:
    needs: [params, dhi, test-rocky]
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read   # read code-scanning analyses for the finding counts
    steps:
      - name: Post scan summary to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DHI_RESULT: ${{ needs.dhi.result }}
          ROCKY_RESULT: ${{ needs.test-rocky.result }}
          MATRIX_JSON: ${{ needs.params.outputs.matrix }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not set — skipping Slack notification."; exit 0
          fi
          icon() { [ "$1" = "success" ] && printf ':white_check_mark:' || printf ':x:'; }
          # latest results_count for a category on this run's ref (best-effort; 'n/a' if unavailable)
          count() {
            gh api "repos/$REPO/code-scanning/analyses?ref=$REF&per_page=100" \
              --jq "map(select(.category==\"$1\"))|.[0].results_count // \"n/a\"" 2>/dev/null || echo "n/a"
          }
          sec="$SERVER_URL/$REPO/security/code-scanning"
          run="$SERVER_URL/$REPO/actions/runs/$RUN_ID"
          # One DHI line per matrix ENTRY, keyed on version+tag_suffix to match the SARIF category
          # the dhi job uploads. Keyed on version alone, a release published on two JDKs printed the
          # same line twice and looked up a category that exists for neither.
          # The published tag and the SARIF category interleave the suffix differently
          # (26.6.1-dhi-jdk17 vs trivy-dhi-26.6.1-jdk17), so read the two fields and build each.
          dhi_lines=""
          while IFS=$'\t' read -r v sfx; do
            dhi_lines="$dhi_lines"$'\n'"  - \`${v}-dhi${sfx}\`: $(count "trivy-dhi-${v}${sfx}") findings"
          done < <(echo "$MATRIX_JSON" | jq -r '.[] | [.version, (.tag_suffix // "")] | @tsv')
          text="$(printf '%s\n' \
            "*BridgeLink container — image scan summary* (\`main\`)" \
            "$(icon "$DHI_RESULT") DHI gate: \`$DHI_RESULT\`$dhi_lines" \
            "$(icon "$ROCKY_RESULT") Rocky gate: \`$ROCKY_RESULT\`  ·  $(count trivy-rocky) findings" \
            "<$sec|Code scanning report>  ·  <$run|workflow run>" \
            "_Gate = fixable HIGH/CRITICAL OS packages; counts are all-severity incl. bundled libraries (IRT-1396)._")"
          payload="$(jq -n --arg t "$text" '{text:$t}')"
          code="$(curl -s -o /tmp/slack_resp -w '%{http_code}' -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL")"
          echo "Slack HTTP $code: $(cat /tmp/slack_resp)"
          [ "$code" = "200" ] || echo "::warning::Slack notification returned HTTP $code"
