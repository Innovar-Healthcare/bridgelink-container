# Helm chart gate — IRT-2015
#
# Separate from build-images.yml on purpose. GitHub path filters are WORKFLOW-scoped, not per-job,
# so putting charts/** in that workflow would fire the full multi-arch image builds (and consume the
# release BINARY_URL) on a chart-only PR. Here a chart change gets a real check in well under a
# minute, with no BINARY_URL.
#
# The chart had no CI of any kind before this: nothing ran helm lint, which is how
# values.schema.json came to declare additionalProperties: false while deployment.yaml templated
# livenessProbe/readinessProbe — the templates were unreachable and any attempt to set a probe was
# rejected, with nothing to catch it.
#
# On main, the publish job at the bottom then pushes the chart to GHCR once both gates pass. It is
# the only job here that logs in to a registry to push, and it never runs on a pull request.

name: chart

on:
  pull_request:
    branches: [main]
    paths:
      - "charts/**"
      - ".github/workflows/chart.yml"
  push:
    branches: [main]
    paths:
      - "charts/**"
      - ".github/workflows/chart.yml"

permissions:
  contents: read

jobs:
  chart:
    runs-on: ubuntu-latest
    env:
      # A new install must set a server ID, and every render below is a new install, so each one
      # passes this. The step on server IDs renders without it on purpose.
      SID: --set-string bridgelink.environment.SERVER_ID=3f0c2a9e-5b1d-4c7e-8a6f-0d9e1b2c3a4f
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the version-bump check compares against the base branch
      # Pinned: the action's default is whatever Helm release is newest, so the major version, and
      # with it client-side vs server-side apply, would change under this gate without a commit.
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      - name: helm lint
        run: helm lint charts/bridgelink $SID

      - name: A chart change bumps the chart version
        # Every version that reaches main is published, and a published version is never replaced
        # (the publish job below refuses). So a PR that changes the chart without bumping the
        # version would merge and then fail to publish. Catch it here instead, while it is a PR.
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          set -euo pipefail
          if git diff --quiet "$BASE"...HEAD -- charts/bridgelink; then
            echo "chart files unchanged; no version bump needed"
            exit 0
          fi
          old=$(git show "$BASE:charts/bridgelink/Chart.yaml" | sed -n 's/^version: *//p')
          new=$(sed -n 's/^version: *//p' charts/bridgelink/Chart.yaml)
          if [ "$old" = "$new" ]; then
            echo "::error file=charts/bridgelink/Chart.yaml::charts/bridgelink changed but version is still $new; bump it"
            exit 1
          fi
          # Higher, not just different: a lower version may already be published with other content.
          if [ "$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -n1)" != "$new" ]; then
            echo "::error file=charts/bridgelink/Chart.yaml::chart version $new is lower than $old on the base branch"
            exit 1
          fi
          echo "chart version $old -> $new"

      - name: helm template (defaults)
        run: helm template bl charts/bridgelink $SID > /tmp/rendered.yaml
  
      - name: Default probes are safe against any published image
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import yaml
          docs = [d for d in yaml.safe_load_all(open('/tmp/rendered.yaml')) if d]
          deps = [d for d in docs if d['kind'] == 'Deployment' and d['metadata']['name'].endswith('-bl')]
          assert deps, 'no Deployment matching *-bl in rendered output (release name or template renamed?)'
          cs = [c for c in deps[0]['spec']['template']['spec']['containers'] if c['name'] == 'bridgelink']
          assert cs, "no container named 'bridgelink' (Chart.Name renamed?)"
          c = cs[0]

          # The exec probes must stay OFF by default. They run a probe binary that exists only in
          # images built from this repo after the probe was added, and any chart version can be
          # installed against an older image tag -- so defaulting them on means a kubelet restart
          # loop for anyone whose image predates it. Enabling them is a documented opt-in (see
          # values.yaml).
          for p in ('startupProbe', 'readinessProbe'):
              assert p not in c, (
                  f'{p} is enabled by default. It execs BridgeLinkHealthcheck, which older published '
                  'images do not contain -> restart loop. Keep it null and document the opt-in.')

          # Liveness IS on by default, because it works against every image.
          lp = c.get('livenessProbe')
          assert lp and 'httpGet' in lp, 'livenessProbe must be enabled by default and be httpGet'
          # Pinned: /status BLOCKS when the database is unreachable (isDatabaseRunning ->
          # testDatabase waits on the pool; IRT-2018), so liveness against it times out and restarts
          # the pod on any database outage. /version reads an in-memory value. Measured
          # 200-in-73ms vs no-response-in-10s on the same server.
          assert lp['httpGet']['path'] == '/api/server/version', \
              'livenessProbe must target /api/server/version, not /status (which hangs on DB loss)'
          assert lp['httpGet']['scheme'] == 'HTTPS', 'livenessProbe must use HTTPS'
          hdrs = {h['name']: h['value'] for h in lp['httpGet'].get('httpHeaders', [])}
          assert 'X-Requested-With' in hdrs, \
              'livenessProbe httpGet needs X-Requested-With or the API returns 400'
          print('default probe shape OK (liveness only)')
          PY

      - name: The documented exec-probe opt-in renders correctly
        run: |
          set -euo pipefail
          # values.yaml documents a block to paste in once the image carries the probe. If that
          # block stops working, the docs are lying, so render it here rather than trusting prose.
          PROBE='{"exec":{"command":["java","-XX:TieredStopAtLevel=1","-XX:+UseSerialGC","-XX:-UsePerfData","-Xmx32m","-cp","/opt/bridgelink/bootstrap","BridgeLinkHealthcheck"]},"periodSeconds":10,"failureThreshold":30,"timeoutSeconds":5}'
          helm template bl charts/bridgelink $SID \
            --set-json "bridgelink.startupProbe=$PROBE" \
            --set-json "bridgelink.readinessProbe=$PROBE" > /tmp/enabled.yaml
          python3 - <<'PY'
          import yaml
          docs = [d for d in yaml.safe_load_all(open('/tmp/enabled.yaml')) if d]
          deps = [d for d in docs if d['kind'] == 'Deployment' and d['metadata']['name'].endswith('-bl')]
          c = [x for x in deps[0]['spec']['template']['spec']['containers'] if x['name'] == 'bridgelink'][0]
          for p in ('startupProbe', 'readinessProbe'):
              assert p in c, f'{p} did not render when set'
              assert 'exec' in c[p], f'{p} must be exec: /api/server/status returns 200 even when ' \
                                     'UNAVAILABLE, so only the response body tells ready from starting'
              cmd = ' '.join(c[p]['exec']['command'])
              assert 'BridgeLinkHealthcheck' in cmd, f'{p} must exec the probe the images compile'
              # k8s defaults exec probes to timeoutSeconds:1 and enforces it; a cold JVM plus a TLS
              # handshake exceeds that on a loaded node and the startup probe would never succeed.
              assert c[p].get('timeoutSeconds', 1) >= 5, f'{p} needs timeoutSeconds >= 5'
          print('documented opt-in renders OK')
          PY

      - name: Schema accepts probe overrides
        run: |
          set -euo pipefail
          helm template bl charts/bridgelink $SID \
            --set bridgelink.livenessProbe.periodSeconds=60 > /dev/null
          echo "probe overrides accepted by values.schema.json"
          # The null default must stay renderable, and explicitly nulling liveness must work too.
          helm template bl charts/bridgelink $SID --set bridgelink.livenessProbe=null \
            | grep -q "livenessProbe:" && { echo "::error::livenessProbe=null did not disable it"; exit 1; }
          echo "livenessProbe=null disables it"

      - name: Upgrades never run two pods at once
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import yaml
          docs = [d for d in yaml.safe_load_all(open('/tmp/rendered.yaml')) if d]
          deps = {d['metadata']['name']: d for d in docs if d['kind'] == 'Deployment'}
          # BridgeLink: two engines on one server ID and one database can process the same polled
          # work twice. Postgres: its ReadWriteOnce volume can stall a rolling update on Multi-Attach.
          for suffix in ('-bl', '-postgres'):
              m = [d for n, d in deps.items() if n.endswith(suffix)]
              assert len(m) == 1, f'expected one Deployment *{suffix}, got {len(m)}'
              strategy = m[0]['spec'].get('strategy', {})
              assert strategy.get('type') == 'Recreate', f"*{suffix} strategy is {strategy.get('type')!r}, want Recreate"
              # The explicit null is what lets a client-side upgrade of a release created by an older
              # chart drop the API server's defaulted rollingUpdate block. Without it the upgrade is
              # rejected: rollingUpdate may not be specified when type is Recreate.
              assert 'rollingUpdate' in strategy and strategy['rollingUpdate'] is None, \
                  f'*{suffix} strategy must set rollingUpdate: null explicitly, got {strategy}'
          print('both Deployments use Recreate')
          PY
          # More than one active node needs the Channel Coordinator plugin and a server ID per pod.
          if helm template bl charts/bridgelink $SID --set bridgelink.replicaCount=2 > /tmp/replicas.txt 2>&1; then
            echo "::error::bridgelink.replicaCount=2 rendered; the schema must cap it at 1"; exit 1
          fi
          grep -q "replicaCount" /tmp/replicas.txt \
            || { echo "::error::the failure does not name replicaCount"; cat /tmp/replicas.txt; exit 1; }
          helm template bl charts/bridgelink $SID --set bridgelink.replicaCount=0 > /dev/null
          echo "replicaCount is capped at 1 and 0 is still allowed"

      - name: A new install needs a server ID, and an upgrade keeps the old default
        run: |
          set -euo pipefail
          # Licenses are issued against the server ID, so the chart ships none: a new install without
          # one must fail, and print a generated ID to use. An upgrade without one keeps the ID every
          # release had before, because BridgeLink sends only queued messages stamped with its own
          # server ID. helm template renders as an install unless given --is-upgrade, so these renders
          # deliberately leave out $SID.
          LEGACY=7d760af2-680a-4a19-b9a2-c4685df61ebc
          if helm template bl charts/bridgelink > /tmp/noid.txt 2>&1; then
            echo "::error::a new install with no SERVER_ID rendered"; exit 1
          fi
          grep -q "bridgelink.environment.SERVER_ID" /tmp/noid.txt \
            || { echo "::error::the failure does not name bridgelink.environment.SERVER_ID"; cat /tmp/noid.txt; exit 1; }
          grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}' /tmp/noid.txt | grep -qv "$LEGACY" \
            || { echo "::error::the failure prints no newly generated ID to use"; cat /tmp/noid.txt; exit 1; }
          echo "a new install with no server ID is refused, with a generated ID to use"
          helm template bl charts/bridgelink --is-upgrade > /tmp/id-upgrade.yaml
          helm template bl charts/bridgelink --set-string bridgelink.environment.SERVER_ID=ABC-own-id > /tmp/id-install.yaml
          helm template bl charts/bridgelink --is-upgrade \
            --set-string bridgelink.environment.SERVER_ID=ABC-own-id > /tmp/id-upgrade-own.yaml
          helm template bl charts/bridgelink --set-json \
            'bridgelink.extraEnv=[{"name":"SERVER_ID","valueFrom":{"secretKeyRef":{"name":"bl-id","key":"id"}}}]' \
            > /tmp/id-extra.yaml
          python3 - <<'PY'
          import os, yaml
          def ids(path):
              docs = [d for d in yaml.safe_load_all(open(path)) if d]
              dep = [d for d in docs if d['kind'] == 'Deployment' and d['metadata']['name'].endswith('-bl')][0]
              return [e for e in dep['spec']['template']['spec']['containers'][0]['env'] if e['name'] == 'SERVER_ID']
          legacy = '7d760af2-680a-4a19-b9a2-c4685df61ebc'
          got = ids('/tmp/id-upgrade.yaml')
          assert got == [{'name': 'SERVER_ID', 'value': legacy}], f'an upgrade with no ID must keep {legacy}, got {got}'
          for path in ('/tmp/id-install.yaml', '/tmp/id-upgrade-own.yaml'):
              got = ids(path)
              assert got == [{'name': 'SERVER_ID', 'value': 'ABC-own-id'}], \
                  f'{path}: an explicit ID must be used unchanged, got {got}'
          got = ids('/tmp/id-extra.yaml')
          assert len(got) == 1 and got[0].get('valueFrom', {}).get('secretKeyRef') == {'name': 'bl-id', 'key': 'id'}, \
              f'SERVER_ID from extraEnv must render once, from the Secret, got {got}'
          want = os.environ['SID'].rsplit('=', 1)[1]
          got = ids('/tmp/rendered.yaml')
          assert got == [{'name': 'SERVER_ID', 'value': want}], f'the default render does not carry its ID: {got}'
          print('an upgrade keeps the old default; explicit and extraEnv IDs are used as given')
          PY

      - name: Database settings in values reach the container
        run: |
          set -euo pipefail
          # An external database such as RDS: the URL (with its own port and parameters) and the
          # credentials must arrive unchanged, and no bundled Postgres may be deployed. The chart used
          # to overwrite all three with the bundled service's values.
          cat > /tmp/external-db.yaml <<'EOF'
          postgres:
            enabled: false
          bridgelink:
            environment:
              MP_DATABASE_URL: "jdbc:postgresql://db.example.us-east-1.rds.amazonaws.com:5433/bl?sslmode=verify-full&sslrootcert=/certs/rds.pem"
              MP_DATABASE_USERNAME: bladmin
              MP_DATABASE_PASSWORD: "p@ss,w0rd"
          EOF
          helm template bl charts/bridgelink $SID -f /tmp/external-db.yaml > /tmp/external.yaml
          python3 - <<'PY'
          import base64, yaml
          def resolve(docs, e):
              # A password is a secretKeyRef into the chart's own Secret: follow it to the value.
              ref = e.get('valueFrom', {}).get('secretKeyRef')
              if not ref:
                  return e.get('value')
              sec = [d for d in docs if d['kind'] == 'Secret' and d['metadata']['name'] == ref['name']]
              return base64.b64decode(sec[0]['data'][ref['key']]).decode() if sec else ref
          def bl_env(path):
              docs = [d for d in yaml.safe_load_all(open(path)) if d]
              dep = [d for d in docs if d['kind'] == 'Deployment' and d['metadata']['name'].endswith('-bl')][0]
              c = [x for x in dep['spec']['template']['spec']['containers'] if x['name'] == 'bridgelink'][0]
              names = [e['name'] for e in c['env']]
              dupes = sorted({n for n in names if names.count(n) > 1})
              assert not dupes, f'{path}: duplicate env names {dupes}'
              return docs, {e['name']: resolve(docs, e) for e in c['env']}

          docs, env = bl_env('/tmp/external.yaml')
          want = yaml.safe_load(open('/tmp/external-db.yaml'))['bridgelink']['environment']
          for k, v in want.items():
              assert env.get(k) == v, f'{k} is {env.get(k)!r}, want {v!r} from values'
          pg = [d['metadata']['name'] for d in docs if d['metadata']['name'].endswith(('-postgres', '-postgres-config'))]
          assert not pg, f'postgres.enabled=false still rendered {pg}'

          # The default install with the bundled Postgres must keep rendering exactly what it did.
          _, env = bl_env('/tmp/rendered.yaml')
          assert env.get('MP_DATABASE_URL') == 'jdbc:postgresql://bl-bridgelink-postgres:5432/bridgelinkdb', \
              f"default MP_DATABASE_URL changed: {env.get('MP_DATABASE_URL')!r}"
          vals = yaml.safe_load(open('charts/bridgelink/values.yaml'))['postgres']['credentials']
          assert env.get('MP_DATABASE_USERNAME') == vals['username']
          assert env.get('MP_DATABASE_PASSWORD') == vals['password']
          print('external database passed through; bundled default unchanged')
          PY
          # Without the bundled Postgres and without a URL there is nothing to connect to: fail the
          # render with a message that names the setting, rather than start a pod that cannot.
          if helm template bl charts/bridgelink $SID --set postgres.enabled=false > /tmp/nourl.txt 2>&1; then
            echo "::error::postgres.enabled=false with no MP_DATABASE_URL rendered"; exit 1
          fi
          grep -q "MP_DATABASE_URL" /tmp/nourl.txt \
            || { echo "::error::the failure does not name MP_DATABASE_URL"; cat /tmp/nourl.txt; exit 1; }
          echo "missing external URL is refused"

          # Embedded Derby needs no URL: it must render, with no database variables injected.
          helm template bl charts/bridgelink $SID --set postgres.enabled=false \
            --set bridgelink.environment.MP_DATABASE=derby > /tmp/derby.yaml
          # Values files copied from older chart versions carry the old placeholder defaults. They
          # must keep resolving to the bundled database, not reach the container as literal text.
          cat > /tmp/legacy-db.yaml <<'EOF'
          bridgelink:
            environment:
              MP_DATABASE_URL: "jdbc:postgresql://{{ include \"bridgelink.fullname\" . }}-postgres:5432/{{ .Values.postgres.credentials.database }}"
              MP_DATABASE_USERNAME: "{{ .Values.postgres.credentials.username }}"
              MP_DATABASE_PASSWORD: "{{ .Values.postgres.credentials.password }}"
          EOF
          helm template bl charts/bridgelink $SID -f /tmp/legacy-db.yaml > /tmp/legacy.yaml
          python3 - <<'PY'
          import base64, yaml
          def resolve(docs, e):
              ref = e.get('valueFrom', {}).get('secretKeyRef')
              if not ref:
                  return e.get('value')
              sec = [d for d in docs if d['kind'] == 'Secret' and d['metadata']['name'] == ref['name']]
              return base64.b64decode(sec[0]['data'][ref['key']]).decode() if sec else ref
          def bl_env(path):
              docs = [d for d in yaml.safe_load_all(open(path)) if d]
              dep = [d for d in docs if d['kind'] == 'Deployment' and d['metadata']['name'].endswith('-bl')][0]
              c = [x for x in dep['spec']['template']['spec']['containers'] if x['name'] == 'bridgelink'][0]
              return {e['name']: resolve(docs, e) for e in c['env']}
          env = bl_env('/tmp/derby.yaml')
          leaked = [k for k in ('MP_DATABASE_URL', 'MP_DATABASE_USERNAME', 'MP_DATABASE_PASSWORD') if k in env]
          assert not leaked, f'derby with postgres.enabled=false still injected {leaked}'
          assert bl_env('/tmp/legacy.yaml') == bl_env('/tmp/rendered.yaml'), \
              'old placeholder defaults no longer render the same as the current defaults'
          print('derby renders without database variables; old placeholder defaults still resolve')
          PY

      - name: Bundled PostgreSQL requires a password over TCP
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import yaml
          docs = [d for d in yaml.safe_load_all(open('/tmp/rendered.yaml')) if d]
          cm = [d for d in docs if d['kind'] == 'ConfigMap' and d['metadata']['name'].endswith('-postgres-config')]
          assert len(cm) == 1, f'expected one *-postgres-config ConfigMap, got {len(cm)}'
          rules = [l.split() for l in cm[0]['data']['pg_hba.conf'].splitlines()
                   if l.strip() and not l.lstrip().startswith('#')]
          host = [r for r in rules if r[0].startswith('host')]
          assert host, 'pg_hba.conf has no host rules, so BridgeLink could not connect at all'
          # `trust` on a host line lets any pod in the cluster connect as any user with no password.
          bad = [' '.join(r) for r in host if r[-1] != 'scram-sha-256']
          assert not bad, f'host rules not using scram-sha-256: {bad}'
          print(f'{len(host)} host rules, all scram-sha-256')
          # pg_hba.conf is a subPath mount, so a running Postgres never sees a ConfigMap change. The
          # pod template must carry the config's checksum, or `helm upgrade` leaves the old rules
          # live until some unrelated restart.
          dep = [d for d in docs if d['kind'] == 'Deployment' and d['metadata']['name'].endswith('-postgres')][0]
          ann = dep['spec']['template']['metadata'].get('annotations') or {}
          assert ann.get('checksum/config'), 'Postgres pod template has no checksum/config annotation'
          print('Postgres restarts when its config changes')
          PY
          # With a password required, Postgres and BridgeLink must receive the same credentials. A value
          # rendered without quoting or encoding would turn "#" into a YAML comment and initialise a
          # different password.
          helm template bl charts/bridgelink $SID --set-string 'postgres.credentials.password=s3cret #1' \
            --set-string postgres.credentials.username=yes --set-string postgres.credentials.database=0755 \
            > /tmp/pgcreds.yaml
          python3 - <<'PY'
          import base64, yaml
          docs = [d for d in yaml.safe_load_all(open('/tmp/pgcreds.yaml')) if d]
          def resolve(e):
              ref = e.get('valueFrom', {}).get('secretKeyRef')
              if not ref:
                  return e.get('value')
              sec = [d for d in docs if d['kind'] == 'Secret' and d['metadata']['name'] == ref['name']][0]
              return base64.b64decode(sec['data'][ref['key']]).decode()
          def env(suffix):
              dep = [d for d in docs if d['kind'] == 'Deployment' and d['metadata']['name'].endswith(suffix)][0]
              return {e['name']: resolve(e) for e in dep['spec']['template']['spec']['containers'][0]['env']}
          pg, bl = env('-postgres'), env('-bl')
          want = {'POSTGRES_PASSWORD': 's3cret #1', 'POSTGRES_USER': 'yes', 'POSTGRES_DB': '0755'}
          for k, v in want.items():
              assert pg.get(k) == v, f'{k} rendered as {pg.get(k)!r}, want {v!r} (missing | quote?)'
          assert bl['MP_DATABASE_PASSWORD'] == pg['POSTGRES_PASSWORD'], 'BridgeLink and Postgres passwords differ'
          assert bl['MP_DATABASE_USERNAME'] == pg['POSTGRES_USER'], 'BridgeLink and Postgres usernames differ'
          print('Postgres and BridgeLink receive identical credentials')
          PY

      - name: Passwords never appear in the pod spec
        run: |
          set -euo pipefail
          # Anyone who can read a Deployment or ConfigMap must not learn a password from it. By default
          # the chart stores them in a Secret of its own; with credentials.existingSecret it stores none
          # and reads each one from that Secret, under key names the values choose.
          PW=(--set-string 'bridgelink.environment.MP_DATABASE_PASSWORD=db-Pw#1'
              --set-string 'bridgelink.environment.MP_KEYSTORE_STOREPASS=store-Pw#2'
              --set-string 'bridgelink.environment.MP_KEYSTORE_KEYPASS=key-Pw#3'
              --set-string 'postgres.credentials.password=pg-Pw#4')
          T() { out="$1"; shift; helm template bl charts/bridgelink $SID "$@" > "/tmp/pw-$out.yaml"; }
          T default "${PW[@]}"
          T existing "${PW[@]}" --set bridgelink.credentials.existingSecret=mine
          T keys "${PW[@]}" --set postgres.enabled=false \
            --set-string 'bridgelink.environment.MP_DATABASE_URL=jdbc:postgresql://db:5432/bl' \
            --set bridgelink.credentials.existingSecret=mine --set bridgelink.credentials.keys.databasePassword=db \
            --set bridgelink.credentials.keys.keystoreStorepass=sp --set bridgelink.credentials.keys.keystoreKeypass=kp
          T keystore "${PW[@]}" --set bridgelink.keystore.existingSecret=ks
          T both "${PW[@]}" --set bridgelink.keystore.existingSecret=ks --set bridgelink.credentials.existingSecret=mine \
            --set-string bridgelink.credentials.keys.keystoreKeypass=
          T derby --set postgres.enabled=false --set bridgelink.environment.MP_DATABASE=derby \
            --set bridgelink.credentials.existingSecret=mine
          T extra "${PW[@]}" --set bridgelink.credentials.existingSecret=mine \
            --set-json 'bridgelink.extraEnv=[{"name":"MP_KEYSTORE_STOREPASS","valueFrom":{"secretKeyRef":{"name":"other","key":"x"}}}]'
          T plain
          T changed --set-string 'bridgelink.environment.MP_KEYSTORE_KEYPASS=changed-Pw#5'
          T annotated --set-string 'bridgelink.podAnnotations.checksum/credentials=mine' \
            --set-string 'bridgelink.podAnnotations.example\.com/a=b'
          python3 - <<'PY'
          import base64, yaml
          # Not 'bridgelinktest': the bundled default uses it as the username too, which is not secret.
          PASSWORDS = ['db-Pw#1', 'store-Pw#2', 'key-Pw#3', 'pg-Pw#4', 'changed-Pw#5',
                       'bridgelinkKeystore', 'bridgelinkKeypass']
          VARS = ('MP_DATABASE_PASSWORD', 'MP_KEYSTORE_STOREPASS', 'MP_KEYSTORE_KEYPASS', 'POSTGRES_PASSWORD')
          CHART = 'bl-bridgelink-credentials'
          def load(name):
              path = f'/tmp/pw-{name}.yaml'
              docs = [d for d in yaml.safe_load_all(open(path)) if d]
              for d in docs:
                  if d['kind'] == 'Secret':
                      continue
                  text = yaml.safe_dump(d)
                  for pw in PASSWORDS:
                      assert pw not in text and base64.b64encode(pw.encode()).decode() not in text, \
                          f'{name}: {d["kind"]} {d["metadata"]["name"]} carries the password {pw!r}'
              refs = {}
              for d in docs:
                  if d['kind'] != 'Deployment':
                      continue
                  short = d['metadata']['name'].rsplit('-', 1)[1]
                  for c in d['spec']['template']['spec']['containers']:
                      names = [e['name'] for e in c.get('env', [])]
                      assert len(names) == len(set(names)), f'{name}: duplicate env names {names}'
                      for e in c.get('env', []):
                          if e['name'] in VARS:
                              assert 'value' not in e, f'{name}: {short} sets {e["name"]} as a plain value'
                              refs[(short, e['name'])] = e['valueFrom']['secretKeyRef']
              sec = [d for d in docs if d['kind'] == 'Secret' and d['metadata']['name'] == CHART]
              data = {k: base64.b64decode(v).decode() for k, v in sec[0]['data'].items()} if sec else {}
              bl = [d for d in docs if d['kind'] == 'Deployment' and d['metadata']['name'] == 'bl-bridgelink-bl'][0]
              ann = bl['spec']['template']['metadata'].get('annotations') or {}
              return refs, data, ann
          def r(name, key):
              return {'name': name, 'key': key}

          refs, data, ann = load('default')
          assert refs == {('bl', 'MP_DATABASE_PASSWORD'): r(CHART, 'database.password'),
                          ('bl', 'MP_KEYSTORE_STOREPASS'): r(CHART, 'keystore.storepass'),
                          ('bl', 'MP_KEYSTORE_KEYPASS'): r(CHART, 'keystore.keypass'),
                          ('postgres', 'POSTGRES_PASSWORD'): r(CHART, 'postgres.password')}, refs
          assert data == {'database.password': 'db-Pw#1', 'keystore.storepass': 'store-Pw#2',
                          'keystore.keypass': 'key-Pw#3', 'postgres.password': 'pg-Pw#4'}, data
          assert ann.get('checksum/credentials'), 'the chart Secret must be checksummed on the pod'

          # existingSecret: everything from it, the bundled Postgres included, and no chart Secret.
          refs, data, ann = load('existing')
          assert refs == {('bl', 'MP_DATABASE_PASSWORD'): r('mine', 'database.password'),
                          ('bl', 'MP_KEYSTORE_STOREPASS'): r('mine', 'keystore.storepass'),
                          ('bl', 'MP_KEYSTORE_KEYPASS'): r('mine', 'keystore.keypass'),
                          ('postgres', 'POSTGRES_PASSWORD'): r('mine', 'database.password')}, refs
          assert not data and 'checksum/credentials' not in ann, 'existingSecret must leave no chart Secret'

          refs, data, _ = load('keys')
          assert refs == {('bl', 'MP_DATABASE_PASSWORD'): r('mine', 'db'),
                          ('bl', 'MP_KEYSTORE_STOREPASS'): r('mine', 'sp'),
                          ('bl', 'MP_KEYSTORE_KEYPASS'): r('mine', 'kp')}, refs
          assert not data, data

          # keystore.existingSecret alone keeps its fixed keys, as before credentials existed.
          refs, data, _ = load('keystore')
          assert refs[('bl', 'MP_KEYSTORE_STOREPASS')] == r('ks', 'keystore.storepass'), refs
          assert refs[('bl', 'MP_KEYSTORE_KEYPASS')] == r('ks', 'keystore.keypass'), refs
          assert refs[('bl', 'MP_DATABASE_PASSWORD')] == r(CHART, 'database.password'), refs
          assert set(data) == {'database.password', 'postgres.password'}, data

          # credentials.existingSecret wins over keystore.existingSecret; an empty key name hands
          # that one password back to the next source.
          refs, data, _ = load('both')
          assert refs[('bl', 'MP_KEYSTORE_STOREPASS')] == r('mine', 'keystore.storepass'), refs
          assert refs[('bl', 'MP_KEYSTORE_KEYPASS')] == r('ks', 'keystore.keypass'), refs
          assert not data, data

          refs, data, _ = load('derby')
          assert ('bl', 'MP_DATABASE_PASSWORD') not in refs, 'Derby has no database password to read'
          assert refs[('bl', 'MP_KEYSTORE_KEYPASS')] == r('mine', 'keystore.keypass'), refs

          # extraEnv wins over both Secrets, and the chart does not set the variable a second time.
          refs, _, _ = load('extra')
          assert refs[('bl', 'MP_KEYSTORE_STOREPASS')] == r('other', 'x'), refs

          # The checksum follows the passwords and nothing else, so an unrelated upgrade never
          # restarts BridgeLink. A podAnnotations entry cannot replace it.
          plain, changed = load('plain')[2], load('changed')[2]
          assert plain['checksum/credentials'] != changed['checksum/credentials'], \
              'changing a password must change the checksum'
          ann = load('annotated')[2]
          assert ann['checksum/credentials'] == plain['checksum/credentials'] and ann['example.com/a'] == 'b', ann
          print('no password in any Deployment or ConfigMap; every source resolves as documented')
          PY
          # Stable across renders: helm template twice gives one checksum.
          helm template bl charts/bridgelink $SID > /tmp/pw-again.yaml
          diff <(grep checksum/credentials /tmp/pw-plain.yaml) <(grep checksum/credentials /tmp/pw-again.yaml)

      - name: Rendered manifests have no duplicate keys
        run: |
          set -euo pipefail
          # A duplicate mapping key is silently resolved by most parsers (the last one wins) and
          # rejected by strict ones. The bundled Postgres resources once carried `app: postgres`
          # followed by `app: bl`, so they were labelled as BridgeLink. PyYAML keeps the last key
          # too, so a custom loader is needed to see it at all.
          helm template bl charts/bridgelink $SID --set webadmin.enabled=true --set webadmin.acceptLicense=true \
            > /tmp/all.yaml
          python3 - <<'PY'
          import yaml
          class Strict(yaml.SafeLoader):
              pass
          def mapping(loader, node):
              # Skip `<<` merge keys: SafeLoader cannot construct their tag, and merging is not duplication.
              keys = [loader.construct_object(k) for k, _ in node.value if k.tag != 'tag:yaml.org,2002:merge']
              dupes = sorted({str(k) for k in keys if keys.count(k) > 1})
              if dupes:
                  raise AssertionError(f'duplicate key(s) {dupes} at rendered line {node.start_mark.line + 1}')
              return dict(yaml.SafeLoader.construct_mapping(loader, node))
          Strict.add_constructor(yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, mapping)
          for path in ('/tmp/rendered.yaml', '/tmp/all.yaml'):
              docs = [d for d in yaml.load_all(open(path), Loader=Strict) if d]
              print(f'{path}: {len(docs)} documents, no duplicate keys')

          docs = [d for d in yaml.safe_load_all(open('/tmp/rendered.yaml')) if d]
          pg = [d for d in docs if d['metadata']['name'].startswith('bl-bridgelink-postgres')]
          assert {d['kind'] for d in pg} == {'Deployment', 'Service', 'PersistentVolumeClaim', 'ConfigMap'}, \
              f"unexpected Postgres resources: {sorted(d['kind'] for d in pg)}"
          for d in pg:
              app = d['metadata']['labels'].get('app')
              assert app == 'postgres', f"{d['kind']} {d['metadata']['name']} is labelled app={app!r}"
          # A Deployment's selector cannot change after creation, so an upgrade with a different one
          # fails. Pin it to what the chart has always rendered.
          dep = next(d for d in pg if d['kind'] == 'Deployment')
          want = {'app': 'postgres', 'app.kubernetes.io/instance': 'bl'}
          assert dep['spec']['selector']['matchLabels'] == want, \
              f"Postgres selector changed to {dep['spec']['selector']['matchLabels']}; existing releases cannot upgrade"
          svc = next(d for d in pg if d['kind'] == 'Service')
          assert svc['spec']['selector'] == want, f"Postgres Service selector is {svc['spec']['selector']}"
          print('Postgres resources labelled app=postgres; selector unchanged')
          PY

      - name: Pods meet the restricted Pod Security Standard
        run: |
          set -euo pipefail
          # Namespaces on EKS commonly enforce "restricted" (or a Kyverno/OPA equivalent), which
          # rejects a pod over any one of these fields. Checked for every pod shape the chart has:
          # default, keystore from a Secret (adds the init container), DHI UID, and WebAdmin. The
          # bundled Postgres is excluded: the official image starts as root, and it is documented as
          # evaluation-only. charts/test/kind-test.sh proves real admission on a cluster.
          WA="--set webadmin.enabled=true --set webadmin.acceptLicense=true"
          helm template bl charts/bridgelink $SID $WA > /tmp/psa-default.yaml
          helm template bl charts/bridgelink $SID $WA --set bridgelink.keystore.existingSecret=ks \
            --set bridgelink.runAsUser=65532 --set bridgelink.runAsGroup=65532 > /tmp/psa-secret.yaml
          python3 - <<'PY'
          import yaml
          for path in ('/tmp/psa-default.yaml', '/tmp/psa-secret.yaml'):
              docs = [d for d in yaml.safe_load_all(open(path)) if d]
              deps = [d for d in docs if d['kind'] == 'Deployment' and not d['metadata']['name'].endswith('-postgres')]
              assert len(deps) == 2, f'{path}: expected BridgeLink and WebAdmin, got {[d["metadata"]["name"] for d in deps]}'
              for d in deps:
                  name, spec = d['metadata']['name'], d['spec']['template']['spec']
                  psc = spec.get('securityContext') or {}
                  assert psc.get('runAsNonRoot') is True, f'{name}: pod runAsNonRoot must be true'
                  assert psc.get('runAsUser') not in (None, 0), f'{name}: pod runAsUser must be a non-root UID'
                  assert (psc.get('seccompProfile') or {}).get('type') in ('RuntimeDefault', 'Localhost'), \
                      f'{name}: pod seccompProfile must be RuntimeDefault'
                  for key in ('hostNetwork', 'hostPID', 'hostIPC'):
                      assert not spec.get(key), f'{name}: {key} is set'
                  assert not [v for v in spec.get('volumes', []) if 'hostPath' in v], f'{name}: hostPath volume'
                  for c in spec.get('initContainers', []) + spec['containers']:
                      where, sc = f"{name}/{c['name']}", c.get('securityContext') or {}
                      assert sc.get('allowPrivilegeEscalation') is False, f'{where}: allowPrivilegeEscalation must be false'
                      caps = sc.get('capabilities') or {}
                      assert 'ALL' in (caps.get('drop') or []), f'{where}: capabilities must drop ALL'
                      assert set(caps.get('add') or []) <= {'NET_BIND_SERVICE'}, f'{where}: adds {caps.get("add")}'
                      assert not sc.get('privileged'), f'{where}: privileged'
                      assert sc.get('runAsUser', 1) != 0, f'{where}: runs as root'
                      image = c['image']
                      assert ':' in image.rsplit('/', 1)[-1] and not image.endswith(':latest'), \
                          f'{where}: image {image} is not pinned to a tag'
              print(f'{path}: {len(deps)} Deployments meet restricted')
          PY

      - name: appdata keeps the keystore across pod replacements
        run: |
          set -euo pipefail
          # The data-encryption key lives only in appdata/keystore.jks. On an emptyDir, or wiped by an
          # init container, every replaced pod generates a new key and earlier encrypted content can
          # no longer be read.
          helm template bl charts/bridgelink $SID > /tmp/ad-default.yaml
          helm template bl charts/bridgelink $SID --set bridgelink.persistence.enabled=false > /tmp/ad-off.yaml
          helm template bl charts/bridgelink $SID --set bridgelink.persistence.existingClaim=mine > /tmp/ad-claim.yaml
          helm template bl charts/bridgelink $SID --set bridgelink.keystore.existingSecret=ks \
            --set bridgelink.persistence.enabled=false \
            --set bridgelink.helperImage.repository=123456789012.dkr.ecr.us-east-1.amazonaws.com/busybox \
            --set bridgelink.helperImage.tag=1.36.1 \
            --set bridgelink.podSecurityContext.runAsUser=2000 \
            --set bridgelink.containerSecurityContext.readOnlyRootFilesystem=true > /tmp/ad-secret.yaml
          python3 - <<'PY'
          import yaml
          def load(path):
              docs = [d for d in yaml.safe_load_all(open(path)) if d]
              dep = [d for d in docs if d['kind'] == 'Deployment' and d['metadata']['name'].endswith('-bl')][0]
              spec = dep['spec']['template']['spec']
              vols = {v['name']: v for v in spec['volumes']}
              pvcs = [d for d in docs if d['kind'] == 'PersistentVolumeClaim' and d['metadata']['name'].endswith('-appdata')]
              return spec, vols, pvcs

          spec, vols, pvcs = load('/tmp/ad-default.yaml')
          assert vols['appdata'].get('persistentVolumeClaim', {}).get('claimName') == 'bl-bridgelink-appdata', \
              f"appdata is not on the chart's claim by default: {vols['appdata']}"
          assert len(pvcs) == 1, 'no appdata PersistentVolumeClaim rendered by default'
          assert pvcs[0]['metadata']['annotations'].get('helm.sh/resource-policy') == 'keep', \
              'the appdata claim must survive helm uninstall: it holds the data-encryption key'
          assert not spec.get('initContainers'), 'the default pod must not have an init container'
          assert spec['securityContext'].get('fsGroup') == spec['securityContext']['runAsGroup'], \
              'fsGroup must default to runAsGroup so appdata is writable without a root init container'

          spec, vols, pvcs = load('/tmp/ad-off.yaml')
          assert 'emptyDir' in vols['appdata'] and not pvcs, 'persistence.enabled=false must use an emptyDir'
          spec, vols, pvcs = load('/tmp/ad-claim.yaml')
          assert vols['appdata']['persistentVolumeClaim']['claimName'] == 'mine' and not pvcs, \
              'existingClaim must be used and no claim created'

          spec, vols, pvcs = load('/tmp/ad-secret.yaml')
          inits = spec.get('initContainers') or []
          assert len(inits) == 1, f'keystore.existingSecret must add one init container, got {len(inits)}'
          init = inits[0]
          assert init['image'] == '123456789012.dkr.ecr.us-east-1.amazonaws.com/busybox:1.36.1', \
              f"helperImage repository and tag must be settable, got {init['image']}"
          script = ' '.join(init.get('command', []) + init.get('args', []))
          assert 'rm ' not in script, 'the init container must never delete anything in appdata'
          assert vols['keystore']['secret']['secretName'] == 'ks'
          env = {e['name']: e for e in spec['containers'][0]['env']}
          names = [e['name'] for e in spec['containers'][0]['env']]
          assert len(names) == len(set(names)), f'duplicate env names: {names}'
          for k, key in (('MP_KEYSTORE_STOREPASS', 'keystore.storepass'), ('MP_KEYSTORE_KEYPASS', 'keystore.keypass')):
              ref = env[k].get('valueFrom', {}).get('secretKeyRef', {})
              assert ref == {'name': 'ks', 'key': key}, f'{k} must come from the Secret, got {env[k]}'
          assert spec['securityContext']['runAsUser'] == 2000, 'podSecurityContext must override runAsUser'
          assert spec['containers'][0]['securityContext'].get('readOnlyRootFilesystem') is True, \
              'containerSecurityContext must be overridable'
          print('appdata persists by default; emptyDir, existingClaim and Secret modes render as documented')
          PY

      - name: Values accept the standard Kubernetes options
        run: |
          set -euo pipefail
          # The schema used to reject these outright (affinity and nodeSelector allowed no keys at
          # all), so customers could not pin pods to an EKS node pool, use IRSA or a private registry,
          # or set BridgeLink variables beyond eight fixed ones.
          cat > /tmp/options.yaml <<'EOF'
          imagePullSecrets: [{name: ecr-pull}]
          serviceAccount:
            create: true
            annotations: {eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/bl"}
          bridgelink:
            podAnnotations: {example.com/a: b}
            podLabels: {team: integration, app: ignored}
            environment: {MP_DATABASE_MAX__CONNECTIONS: "30", BL_HEALTH_ALWAYS_STATUS: "true"}
            extraEnv:
              - name: MP_DATABASE_PASSWORD
                valueFrom: {secretKeyRef: {name: db, key: password}}
            extraVolumes: [{name: files, persistentVolumeClaim: {claimName: efs-files}}]
            extraVolumeMounts: [{name: files, mountPath: /data}]
            nodeSelector: {karpenter.sh/nodepool: bridgelink}
            affinity: {nodeAffinity: {requiredDuringSchedulingIgnoredDuringExecution: {nodeSelectorTerms: [{matchExpressions: [{key: topology.kubernetes.io/zone, operator: In, values: [us-east-1a]}]}]}}}
            tolerations: [{key: dedicated, operator: Equal, value: bridgelink, effect: NoSchedule}]
            resources: {requests: {ephemeral-storage: 1Gi}}
          webadmin: {enabled: true, acceptLicense: true}
          EOF
          helm template bl charts/bridgelink $SID -f /tmp/options.yaml > /tmp/options-out.yaml
          python3 - <<'PY'
          import yaml
          docs = [d for d in yaml.safe_load_all(open('/tmp/options-out.yaml')) if d]
          deps = {d['metadata']['name']: d for d in docs if d['kind'] == 'Deployment'}
          spec = deps['bl-bridgelink-bl']['spec']['template']['spec']
          meta = deps['bl-bridgelink-bl']['spec']['template']['metadata']
          c = spec['containers'][0]
          sa = [d for d in docs if d['kind'] == 'ServiceAccount']
          assert len(sa) == 1 and sa[0]['metadata']['annotations']['eks.amazonaws.com/role-arn'].endswith(':role/bl')
          assert spec['serviceAccountName'] == sa[0]['metadata']['name']
          for name, d in deps.items():
              assert d['spec']['template']['spec'].get('imagePullSecrets') == [{'name': 'ecr-pull'}], f'{name}: no pull secret'
          assert meta['labels']['team'] == 'integration' and meta['labels']['app'] == 'bl', \
              'podLabels must add labels without changing the selector labels'
          assert meta['annotations']['example.com/a'] == 'b'
          names = [e['name'] for e in c['env']]
          assert len(names) == len(set(names)), f'duplicate env names: {names}'
          env = {e['name']: e for e in c['env']}
          assert env['MP_DATABASE_MAX__CONNECTIONS']['value'] == '30', 'environment must accept any key'
          assert 'valueFrom' in env['MP_DATABASE_PASSWORD'], 'extraEnv must replace the chart-set variable'
          assert {'name': 'files', 'mountPath': '/data'} in c['volumeMounts']
          assert any(v['name'] == 'files' for v in spec['volumes'])
          assert spec['nodeSelector'] and spec['affinity'] and spec['tolerations']
          assert c['resources']['requests']['ephemeral-storage'] == '1Gi'
          print('every option renders')
          PY
          # Open where Kubernetes defines the shape, strict where the chart does: a misspelt chart
          # key must still fail the install rather than be silently ignored.
          for bad in bridgelink.persistance.enabled=true serviceAccount.crate=true bridgelink.image.tagg=x \
                     bridgelink.credentials.existingSecrt=x bridgelink.credentials.keys.dbPassword=x; do
            if helm template bl charts/bridgelink $SID --set "$bad" > /tmp/typo.txt 2>&1; then
              echo "::error::the schema accepted the misspelt key in $bad"; exit 1
            fi
          done
          echo "misspelt chart keys are still rejected"
          # Helm renders an unquoted large number as 3e+06, which BridgeLink would read verbatim.
          if helm template bl charts/bridgelink $SID --set bridgelink.environment.MP_X=3000000 > /tmp/num.txt 2>&1; then
            echo "::error::an unquoted number in bridgelink.environment was accepted"; exit 1
          fi
          echo "unquoted numbers in environment are rejected"
          # An external URL from a Secret alone, with nothing in environment: the URL helper must not
          # fail the render for a variable extraEnv already supplies.
          helm template bl charts/bridgelink $SID --set postgres.enabled=false --set-json \
            'bridgelink.extraEnv=[{"name":"MP_DATABASE_URL","valueFrom":{"secretKeyRef":{"name":"db","key":"url"}}}]' \
            > /tmp/url-secret.yaml
          grep -q "key: url" /tmp/url-secret.yaml && [ "$(grep -c 'name: MP_DATABASE_URL' /tmp/url-secret.yaml)" = 1 ] \
            || { echo "::error::MP_DATABASE_URL from extraEnv did not render exactly once"; exit 1; }
          echo "an external URL can come from extraEnv alone"
          # With none of these set, the pod template must not change, or every existing release
          # restarts on upgrade for nothing.
          python3 - <<'PY'
          import yaml
          docs = [d for d in yaml.safe_load_all(open('/tmp/rendered.yaml')) if d]
          assert not [d for d in docs if d['kind'] == 'ServiceAccount'], 'a ServiceAccount is created by default'
          for d in docs:
              if d['kind'] == 'Deployment':
                  s = d['spec']['template']['spec']
                  for k in ('serviceAccountName', 'imagePullSecrets'):
                      assert k not in s, f"{d['metadata']['name']}: {k} rendered by default"
                  if d['metadata']['name'].endswith('-bl'):
                      ports = [(p['name'], p['containerPort']) for p in s['containers'][0]['ports']]
                      assert ports == [('https', 8443), ('http', 8080)], f'default container ports changed: {ports}'
          print('defaults leave the pod templates unchanged')
          PY

      - name: The documented plugin routes render
        run: |
          set -euo pipefail
