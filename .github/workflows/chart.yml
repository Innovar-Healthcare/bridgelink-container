          # presigned URL carries &, = and %2F, and must reach the image byte for byte; the claim
          # must be mounted read-only where the image looks for zips. charts/test/kind-test.sh
          # proves both install a plugin on a cluster.
          cat > /tmp/plugins.yaml <<'EOF'
          bridgelink:
            environment:
              EXTENSIONS_DOWNLOAD: "https://b.s3.amazonaws.com/a.zip?X-Amz-Credential=AK%2F20261005&X-Amz-Expires=3600,https://b.s3.amazonaws.com/c.zip"
            extraVolumes:
              - name: plugins
