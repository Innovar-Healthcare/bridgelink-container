# Helm chart gate — IRT-2015
#
# Separate from build-images.yml on purpose. GitHub path filters are WORKFLOW-scoped, not per-job,
# so putting charts/** in that workflow would fire the full multi-arch image builds (and consume the
# release BINARY_URL) on a chart-only PR. Here a chart change gets a real check in well under a
# minute, with no registry login, no BINARY_URL and no secrets.
#
# The chart had no CI of any kind before this: nothing ran helm lint, which is how
# values.schema.json came to declare additionalProperties: false while deployment.yaml templated
# livenessProbe/readinessProbe — the templates were unreachable and any attempt to set a probe was
# rejected, with nothing to catch it.

name: chart

on:
  pull_request:
    branches: [main]
    paths:
      - "charts/**"
      - ".github/workflows/chart.yml"
  push:
    branches: [main]
    paths:
      - "charts/**"
      - ".github/workflows/chart.yml"

permissions:
  contents: read

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: helm lint charts/bridgelink
  
      - name: helm template (defaults)
        run: helm template bl charts/bridgelink > /tmp/rendered.yaml
  
      - name: Default probes are safe against any published image
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import yaml
          docs = [d for d in yaml.safe_load_all(open('/tmp/rendered.yaml')) if d]
          deps = [d for d in docs if d['kind'] == 'Deployment' and d['metadata']['name'].endswith('-bl')]
          assert deps, 'no Deployment matching *-bl in rendered output (release name or template renamed?)'
          cs = [c for c in deps[0]['spec']['template']['spec']['containers'] if c['name'] == 'bridgelink']
          assert cs, "no container named 'bridgelink' (Chart.Name renamed?)"
          c = cs[0]

          # The exec probes must stay OFF by default. They run a probe binary that exists only in
          # images built from this repo at or after IRT-2015, and this chart is installed straight
          # from a checkout -- so defaulting them on means a kubelet restart loop for anyone on main
          # whose image predates it. Enabling them is a documented opt-in (see values.yaml).
          for p in ('startupProbe', 'readinessProbe'):
              assert p not in c, (
                  f'{p} is enabled by default. It execs BridgeLinkHealthcheck, which older published '
                  'images do not contain -> restart loop. Keep it null and document the opt-in.')

          # Liveness IS on by default, because it works against every image.
          lp = c.get('livenessProbe')
          assert lp and 'httpGet' in lp, 'livenessProbe must be enabled by default and be httpGet'
          # Pinned: /status BLOCKS when the database is unreachable (isDatabaseRunning ->
          # testDatabase waits on the pool; IRT-2018), so liveness against it times out and restarts
          # the pod on any database outage. /version reads an in-memory value. Measured
          # 200-in-73ms vs no-response-in-10s on the same server.
          assert lp['httpGet']['path'] == '/api/server/version', \
              'livenessProbe must target /api/server/version, not /status (which hangs on DB loss)'
          assert lp['httpGet']['scheme'] == 'HTTPS', 'livenessProbe must use HTTPS'
          hdrs = {h['name']: h['value'] for h in lp['httpGet'].get('httpHeaders', [])}
          assert 'X-Requested-With' in hdrs, \
              'livenessProbe httpGet needs X-Requested-With or the API returns 400'
          print('default probe shape OK (liveness only)')
          PY

      - name: The documented exec-probe opt-in renders correctly
        run: |
          set -euo pipefail
          # values.yaml documents a block to paste in once the image carries the probe. If that
          # block stops working, the docs are lying, so render it here rather than trusting prose.
          PROBE='{"exec":{"command":["java","-XX:TieredStopAtLevel=1","-XX:+UseSerialGC","-XX:-UsePerfData","-Xmx32m","-cp","/opt/bridgelink/bootstrap","BridgeLinkHealthcheck"]},"periodSeconds":10,"failureThreshold":30,"timeoutSeconds":5}'
          helm template bl charts/bridgelink \
            --set-json "bridgelink.startupProbe=$PROBE" \
            --set-json "bridgelink.readinessProbe=$PROBE" > /tmp/enabled.yaml
          python3 - <<'PY'
          import yaml
          docs = [d for d in yaml.safe_load_all(open('/tmp/enabled.yaml')) if d]
          deps = [d for d in docs if d['kind'] == 'Deployment' and d['metadata']['name'].endswith('-bl')]
          c = [x for x in deps[0]['spec']['template']['spec']['containers'] if x['name'] == 'bridgelink'][0]
          for p in ('startupProbe', 'readinessProbe'):
              assert p in c, f'{p} did not render when set'
              assert 'exec' in c[p], f'{p} must be exec: /api/server/status returns 200 even when ' \
                                     'UNAVAILABLE, so only the response body tells ready from starting'
              cmd = ' '.join(c[p]['exec']['command'])
              assert 'BridgeLinkHealthcheck' in cmd, f'{p} must exec the probe the images compile'
              # k8s defaults exec probes to timeoutSeconds:1 and enforces it; a cold JVM plus a TLS
              # handshake exceeds that on a loaded node and the startup probe would never succeed.
              assert c[p].get('timeoutSeconds', 1) >= 5, f'{p} needs timeoutSeconds >= 5'
          print('documented opt-in renders OK')
          PY

      - name: Schema accepts probe overrides
        run: |
          set -euo pipefail
          helm template bl charts/bridgelink \
            --set bridgelink.livenessProbe.periodSeconds=60 > /dev/null
          echo "probe overrides accepted by values.schema.json"
          # The null default must stay renderable, and explicitly nulling liveness must work too.
          helm template bl charts/bridgelink --set bridgelink.livenessProbe=null \
            | grep -q "livenessProbe:" && { echo "::error::livenessProbe=null did not disable it"; exit 1; }
          echo "livenessProbe=null disables it"

      - name: Upgrades never run two pods at once
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import yaml
          docs = [d for d in yaml.safe_load_all(open('/tmp/rendered.yaml')) if d]
          deps = {d['metadata']['name']: d for d in docs if d['kind'] == 'Deployment'}
          # BridgeLink: two engines on one server ID and one database can process the same polled
          # work twice. Postgres: its ReadWriteOnce volume can stall a rolling update on Multi-Attach.
          for suffix in ('-bl', '-postgres'):
              m = [d for n, d in deps.items() if n.endswith(suffix)]
              assert len(m) == 1, f'expected one Deployment *{suffix}, got {len(m)}'
              strategy = m[0]['spec'].get('strategy', {}).get('type')
              assert strategy == 'Recreate', f'*{suffix} strategy is {strategy!r}, want Recreate'
          print('both Deployments use Recreate')
          PY
          # More than one active node needs the Channel Coordinator plugin and a server ID per pod.
          if helm template bl charts/bridgelink --set bridgelink.replicaCount=2 > /tmp/replicas.txt 2>&1; then
            echo "::error::bridgelink.replicaCount=2 rendered; the schema must cap it at 1"; exit 1
          fi
          grep -q "replicaCount" /tmp/replicas.txt \
            || { echo "::error::the failure does not name replicaCount"; cat /tmp/replicas.txt; exit 1; }
          helm template bl charts/bridgelink --set bridgelink.replicaCount=0 > /dev/null
          echo "replicaCount is capped at 1 and 0 is still allowed"

      - name: Bundled PostgreSQL requires a password over TCP
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import yaml
          docs = [d for d in yaml.safe_load_all(open('/tmp/rendered.yaml')) if d]
          cm = [d for d in docs if d['kind'] == 'ConfigMap' and d['metadata']['name'].endswith('-postgres-config')]
          assert len(cm) == 1, f'expected one *-postgres-config ConfigMap, got {len(cm)}'
          rules = [l.split() for l in cm[0]['data']['pg_hba.conf'].splitlines()
                   if l.strip() and not l.lstrip().startswith('#')]
          host = [r for r in rules if r[0].startswith('host')]
          assert host, 'pg_hba.conf has no host rules, so BridgeLink could not connect at all'
          # `trust` on a host line lets any pod in the cluster connect as any user with no password.
          bad = [' '.join(r) for r in host if r[-1] != 'scram-sha-256']
          assert not bad, f'host rules not using scram-sha-256: {bad}'
          print(f'{len(host)} host rules, all scram-sha-256')
          PY

      - name: WebAdmin is off by default
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import yaml
          docs = [d for d in yaml.safe_load_all(open('/tmp/rendered.yaml')) if d]
          wa = [d['metadata']['name'] for d in docs if d['metadata']['name'].endswith('-webadmin')]
          assert not wa, f'WebAdmin rendered without webadmin.enabled: {wa}'
          print('no WebAdmin resources by default')
          PY

      - name: WebAdmin, when enabled, points at this release's BridgeLink
        run: |
          set -euo pipefail
          # webadmin.env tries to override every chart-owned variable. The chart must ignore those
          # entries (a duplicate env name is rejected by Kubernetes only at apply time) and keep
          # unrelated extras.
          helm template bl charts/bridgelink \
            --set webadmin.enabled=true --set webadmin.acceptLicense=true \
            --set webadmin.env.BRIDGELINK_SERVER_URL=https://elsewhere:8443 \
            --set webadmin.env.PORT=3000 --set webadmin.env.BL_ACCEPT_LICENSE=0 \
            --set webadmin.env.COOKIE_SECURE=false > /tmp/webadmin.yaml
          python3 - <<'PY'
          import yaml
          docs = [d for d in yaml.safe_load_all(open('/tmp/webadmin.yaml')) if d]
          vals = yaml.safe_load(open('charts/bridgelink/values.yaml'))
          def one(kind, suffix):
              m = [d for d in docs if d['kind'] == kind and d['metadata']['name'].endswith(suffix)]
              assert len(m) == 1, f'expected one {kind} *{suffix}, got {len(m)}'
              return m[0]
          bl_svc, wa_svc = one('Service', '-bl'), one('Service', '-webadmin')
          bl_dep, wa_dep = one('Deployment', '-bl'), one('Deployment', '-webadmin')
          c = wa_dep['spec']['template']['spec']['containers'][0]
          names = [e['name'] for e in c['env']]
          dupes = sorted({n for n in names if names.count(n) > 1})
          assert not dupes, f'duplicate env names (webadmin.env overrode a chart-owned one): {dupes}'
          env = {e['name']: e.get('value') for e in c['env']}
          assert env.get('COOKIE_SECURE') == 'false', 'webadmin.env extras must still be passed through'

          # Computed from the rendered Service, so a rename of either side fails here.
          https = next(p['port'] for p in bl_svc['spec']['ports'] if p['name'] == 'https')
          want = f"https://{bl_svc['metadata']['name']}:{https}"
          assert env.get('BRIDGELINK_SERVER_URL') == want, \
              f"BRIDGELINK_SERVER_URL is {env.get('BRIDGELINK_SERVER_URL')!r}, want {want!r}"
          assert env.get('BL_ACCEPT_LICENSE') == '1', 'BL_ACCEPT_LICENSE must be "1" once accepted'

          # 8444 is WebAdmin's documented default. The image's built-in config says 3000, so PORT
          # must be passed, and it must agree with the port the Service targets.
          port = next(p for p in c['ports'] if p['name'] == 'https')['containerPort']
          assert port == 8444, f'WebAdmin containerPort is {port}, want the documented 8444'
          assert env.get('PORT') == str(port), f"PORT env {env.get('PORT')!r} != containerPort {port}"
          assert wa_svc['spec']['ports'][0]['targetPort'] == 'https'

          tag = c['image'].rsplit(':', 1)[1]
          # str(): an unquoted two-part tag such as 26.7 loads from YAML as a float.
          assert tag == str(vals['webadmin']['image']['tag']), f'image tag {tag} is not the values pin'

          # The BridgeLink Service selects on `app: bl`. WebAdmin pods carrying it would receive
          # BridgeLink traffic, so each Service must select only its own pods.
          def selects(svc, dep):
              labels = dep['spec']['template']['metadata']['labels']
              return all(labels.get(k) == v for k, v in svc['spec']['selector'].items())
          assert selects(bl_svc, bl_dep) and selects(wa_svc, wa_dep), 'a Service misses its own pods'
          assert not selects(bl_svc, wa_dep), 'the BridgeLink Service selects WebAdmin pods'
          assert not selects(wa_svc, bl_dep), 'the WebAdmin Service selects BridgeLink pods'
          print('WebAdmin wiring OK')
          PY

      - name: WebAdmin is never deployed with the license accepted implicitly
        run: |
          set -euo pipefail
          # Accepting the WebAdmin license is the user's decision. Enabling WebAdmin without
          # webadmin.acceptLicense must fail the render, not deploy something that accepts it.
          if helm template bl charts/bridgelink --set webadmin.enabled=true > /tmp/nolicense.txt 2>&1; then
            echo "::error::webadmin.enabled=true rendered without webadmin.acceptLicense=true"; exit 1
          fi
          grep -q "acceptLicense" /tmp/nolicense.txt \
            || { echo "::error::the failure does not name webadmin.acceptLicense"; cat /tmp/nolicense.txt; exit 1; }
          echo "enabling WebAdmin without acceptLicense is refused"

      - name: Chart README is regenerated from values.yaml
        run: |
          set -euo pipefail
          # README.md is generated by helm-docs from README.md.gotmpl + the `# --` comments in
          # values.yaml. Editing values without regenerating leaves the published table wrong, so
          # fail the PR rather than let the two drift.
          # Pinned, not :latest — a helm-docs release that changes table or badge formatting would
          # otherwise fail this gate on an unrelated PR, and the fix commit would then fail for the
          # next person once the tag moved again. Bump deliberately, regenerating in the same commit.
          docker run --rm -v "$PWD/charts:/helm-docs" -u "$(id -u)" jnorwood/helm-docs:v1.14.2 \
            --chart-search-root=/helm-docs --template-files=README.md.gotmpl
          if ! git diff --quiet charts/bridgelink/README.md; then
            echo "::error::charts/bridgelink/README.md is stale — run helm-docs and commit the result"
            git diff -- charts/bridgelink/README.md
            exit 1
          fi
          echo "chart README is current"
