                readOnly: true
          EOF
          helm template bl charts/bridgelink $SID -f /tmp/plugins.yaml > /tmp/plugins-out.yaml
          python3 - <<'PY'
          import yaml
          want = yaml.safe_load(open('/tmp/plugins.yaml'))['bridgelink']['environment']['EXTENSIONS_DOWNLOAD']
          docs = [d for d in yaml.safe_load_all(open('/tmp/plugins-out.yaml')) if d]
          spec = [d for d in docs if d['kind'] == 'Deployment' and d['metadata']['name'] == 'bl-bridgelink-bl'][0]['spec']['template']['spec']
          c = spec['containers'][0]
