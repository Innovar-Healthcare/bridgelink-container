      - name: Every values block in the README renders
        # The README once documented tls, persistence, ingress, metrics and an admin-password Secret
        # that the chart never had, so an install that followed it failed on the schema. Render every
        # yaml block in the README template as a values file, so a documented key that does not exist
        # fails here instead of at a customer's install. Only Kubernetes manifests (apiVersion) are
        # skipped: selecting blocks by known top-level keys would skip exactly the invented ones.
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import os, re, shlex, subprocess, sys, tempfile, yaml
          chart = 'charts/bridgelink'
          meta = yaml.safe_load(open(f'{chart}/Chart.yaml'))
          src = open(f'{chart}/README.md.gotmpl').read()
          # Undo helm-docs templating the way helm-docs would render it.
          for k, v in {'{{ .AppVersion }}': meta['appVersion'], '{{ .Version }}': meta['version'],
                       '{{"{{"}}': '{{', '{{"}}"}}': '}}'}.items():
              src = src.replace(k, str(v))
          lines = src.split('\n')
          blocks, i = [], 0
          while i < len(lines):
              # Fences may be indented (inside a list item) or quoted (inside a "> " blockquote).
              m = re.match(r'^((?:>\s?)?\s*)```ya?ml\s*$', lines[i])
              if not m:
                  i += 1
                  continue
              indent, start, body = m.group(1), i + 1, []
              i += 1
              while not re.match(rf'^{re.escape(indent)}```\s*$', lines[i]):
                  body.append(lines[i][len(indent):])
                  i += 1
              blocks.append((start, '\n'.join(body)))
              i += 1
          fences = len(re.findall(r'```ya?ml\b', src))
          assert len(blocks) == fences, f'{fences} yaml fences but {len(blocks)} parsed; a fence this step cannot read?'
          sid = shlex.split(os.environ['SID'])
          checked, failed = 0, []
          for line, body in blocks:
              doc = yaml.safe_load(body)
              if isinstance(doc, dict) and 'apiVersion' in doc:
                  continue   # a Kubernetes manifest, not values
              checked += 1
              with tempfile.NamedTemporaryFile('w', suffix='.yaml', delete=False) as f:
                  f.write(body)
              r = subprocess.run(['helm', 'template', 'bl', chart, *sid, '-f', f.name],
                                 capture_output=True, text=True)
              if r.returncode:
                  failed.append(line)
                  print(f'::error file={chart}/README.md.gotmpl,line={line}::values block does not render: {r.stderr.strip()}')
          assert checked >= 10, f'only {checked} values blocks found; did the README format change?'
          if failed:
              sys.exit(1)
          print(f'{checked} README values blocks render')
          PY

      - name: Services expose listener ports and stay inside the cluster by default
        run: |
          set -euo pipefail
          # A plain LoadBalancer on EKS without the AWS Load Balancer Controller is an internet-facing
          # Classic ELB serving the admin API, so both Services default to ClusterIP. Channel listeners
          # need extra ports, and an internal NLB needs annotations, so those are settable.
          WA="--set webadmin.enabled=true --set webadmin.acceptLicense=true"
          helm template bl charts/bridgelink $SID $WA > /tmp/svc-default.yaml
          # deploy-minikube.sh writes its own values file and waits for a LoadBalancer address. Render
          # exactly what it writes, so it keeps working whatever the chart default is.
          sed -n '/cat > "\$MINIKUBE_VALUES" << EOL$/,/^EOL$/p' scripts/deploy-minikube.sh | sed '1d;$d' > /tmp/minikube-values.yaml
          [ -s /tmp/minikube-values.yaml ] || { echo "::error::could not extract the values file from scripts/deploy-minikube.sh"; exit 1; }
          # The script passes the server ID on its helm command line rather than in that file.
          sed -n '/^helm upgrade --install /,/[^\\]$/p' scripts/deploy-minikube.sh > /tmp/minikube-helm.txt
          grep -q -- '--set-string bridgelink.environment.SERVER_ID="\$SERVER_ID"' /tmp/minikube-helm.txt \
            || { echo "::error::the helm command in scripts/deploy-minikube.sh does not pass bridgelink.environment.SERVER_ID, so its install fails"; cat /tmp/minikube-helm.txt; exit 1; }
          helm template bl charts/bridgelink $SID -f /tmp/minikube-values.yaml > /tmp/svc-minikube.yaml
          helm template bl charts/bridgelink $SID --set bridgelink.service.ports.http=null > /tmp/svc-nohttp.yaml
          cat > /tmp/svc-ports.yaml <<'EOF'
          bridgelink:
            extraPorts:
              - {name: mllp-adt, containerPort: 6661}
              - {name: syslog, containerPort: 5514, port: 514, protocol: UDP}
          EOF
          helm template bl charts/bridgelink $SID -f /tmp/svc-ports.yaml > /tmp/svc-main.yaml
          cat > /tmp/svc-lb.yaml <<'EOF'
          bridgelink:
            service:
              type: LoadBalancer
              annotations: {service.beta.kubernetes.io/aws-load-balancer-scheme: internal}
              loadBalancerSourceRanges: [10.0.0.0/8]
              loadBalancerClass: service.k8s.aws/nlb
            listenerService:
              enabled: true
              type: LoadBalancer
              annotations: {service.beta.kubernetes.io/aws-load-balancer-type: external}
              loadBalancerSourceRanges: [192.168.0.0/16]
          webadmin:
            service:
              type: LoadBalancer
              loadBalancerSourceRanges: [172.16.0.0/12]
          EOF
          helm template bl charts/bridgelink $SID $WA -f /tmp/svc-ports.yaml -f /tmp/svc-lb.yaml > /tmp/svc-listener.yaml
          # Same settings with ClusterIP: the API server rejects the load-balancer-only fields there.
          helm template bl charts/bridgelink $SID $WA -f /tmp/svc-ports.yaml -f /tmp/svc-lb.yaml \
            --set bridgelink.service.type=ClusterIP --set bridgelink.listenerService.type=ClusterIP \
            --set webadmin.service.type=ClusterIP > /tmp/svc-clusterip.yaml
          python3 - <<'PY'
          import yaml
          def load(path):
              docs = [d for d in yaml.safe_load_all(open(path)) if d]
              svcs = {d['metadata']['name']: d for d in docs if d['kind'] == 'Service'}
              dep = [d for d in docs if d['kind'] == 'Deployment' and d['metadata']['name'].endswith('-bl')][0]
              return svcs, dep['spec']['template']
          def ports(svc):
              return [(p['name'], p['port'], p['targetPort'], p['protocol']) for p in svc['spec']['ports']]
          LB_ONLY = ('loadBalancerSourceRanges', 'loadBalancerClass')

          svcs, pod = load('/tmp/svc-default.yaml')
          for n in ('bl-bridgelink-bl', 'bl-bridgelink-webadmin'):
              s = svcs[n]
              assert s['spec']['type'] == 'ClusterIP', f"{n} defaults to {s['spec']['type']}, want ClusterIP"
              assert not s['metadata'].get('annotations'), f'{n} has annotations by default'
              assert not [k for k in LB_ONLY if k in s['spec']], f'{n} renders load balancer fields by default'
          assert ports(svcs['bl-bridgelink-bl']) == [('https', 8443, 'https', 'TCP'), ('http', 8080, 'http', 'TCP')], \
              f"default BridgeLink Service ports changed: {ports(svcs['bl-bridgelink-bl'])}"
          assert 'bl-bridgelink-listeners' not in svcs, 'a listener Service is rendered by default'

          svcs, _ = load('/tmp/svc-minikube.yaml')
          assert svcs['bl-bridgelink-bl']['spec']['type'] == 'LoadBalancer', \
              'scripts/deploy-minikube.sh waits for a LoadBalancer address, but its values no longer render one'

          svcs, pod = load('/tmp/svc-nohttp.yaml')
          assert [p[0] for p in ports(svcs['bl-bridgelink-bl'])] == ['https'], 'ports.http=null must leave HTTP off the Service'
          assert 'http' in [p['name'] for p in pod['spec']['containers'][0]['ports']], \
              'ports.http=null must not change the container (that would restart the pod)'

          extra = [('mllp-adt', 6661, 'mllp-adt', 'TCP'), ('syslog', 514, 'syslog', 'UDP')]
          svcs, pod = load('/tmp/svc-main.yaml')
          cports = [(p['name'], p['containerPort'], p['protocol']) for p in pod['spec']['containers'][0]['ports']]
          assert cports[2:] == [('mllp-adt', 6661, 'TCP'), ('syslog', 5514, 'UDP')], f'extra container ports: {cports}'
          assert ports(svcs['bl-bridgelink-bl'])[2:] == extra, f"extra ports on the BridgeLink Service: {ports(svcs['bl-bridgelink-bl'])}"
          assert 'bl-bridgelink-listeners' not in svcs

          svcs, pod = load('/tmp/svc-listener.yaml')
          bl, ls, wa = svcs['bl-bridgelink-bl'], svcs['bl-bridgelink-listeners'], svcs['bl-bridgelink-webadmin']
          assert [p[0] for p in ports(bl)] == ['https', 'http'], 'with the listener Service on, extra ports must leave the BridgeLink Service'
          assert ports(ls) == extra, f'listener Service ports: {ports(ls)}'
          assert ls['spec']['selector'] == bl['spec']['selector'], 'the listener Service must select the BridgeLink pod'
          assert bl['metadata']['annotations'] == {'service.beta.kubernetes.io/aws-load-balancer-scheme': 'internal'}
          assert ls['metadata']['annotations'] == {'service.beta.kubernetes.io/aws-load-balancer-type': 'external'}
          assert bl['spec']['loadBalancerSourceRanges'] == ['10.0.0.0/8'] and bl['spec']['loadBalancerClass'] == 'service.k8s.aws/nlb'
          assert ls['spec']['loadBalancerSourceRanges'] == ['192.168.0.0/16'] and 'loadBalancerClass' not in ls['spec']
          assert wa['spec']['loadBalancerSourceRanges'] == ['172.16.0.0/12']

          svcs, _ = load('/tmp/svc-clusterip.yaml')
          for n in ('bl-bridgelink-bl', 'bl-bridgelink-listeners', 'bl-bridgelink-webadmin'):
              s = svcs[n]
              assert s['spec']['type'] == 'ClusterIP', f"{n} is {s['spec']['type']}"
              assert not [k for k in LB_ONLY if k in s['spec']], f'{n} renders load balancer fields with type ClusterIP'
          assert svcs['bl-bridgelink-bl']['metadata']['annotations'], 'annotations must render whatever the type'
          print('Service defaults, extra ports, listener Service and load balancer settings render as documented')
          PY
          # Kubernetes rejects these only at apply time, after a release is half-updated; the schema
          # rejects them at install.
          for bad in '[{"name":"MLLP","containerPort":6661}]' '[{"name":"a-sixteen-chars1","containerPort":6661}]' \
                     '[{"name":"https","containerPort":6661}]' '[{"name":"mllp","containerPort":6661,"protocol":"tcp"}]' \
                     '[{"name":"mllp","containerPort":70000}]' '[{"name":"mllp"}]' '[{"name":"mllp","containerPort":6661,"targetPort":1}]'; do
            if helm template bl charts/bridgelink $SID --set-json "bridgelink.extraPorts=$bad" > /tmp/badport.txt 2>&1; then
              echo "::error::the schema accepted extraPorts=$bad"; exit 1
            fi
          done
          echo "invalid extraPorts are rejected"
          # Clashes between entries, or with BridgeLink's own ports, need the whole list to see, so
          # the template checks them rather than the schema.
          for bad in '[{"name":"mllp","containerPort":6661},{"name":"mllp","containerPort":6662}]' \
                     '[{"name":"mllp","containerPort":8443}]' '[{"name":"mllp","containerPort":6661,"port":8080}]' \
                     '[{"name":"a","containerPort":6661},{"name":"b","containerPort":6662,"port":6661}]'; do
            if helm template bl charts/bridgelink $SID --set-json "bridgelink.extraPorts=$bad" > /tmp/clash.txt 2>&1; then
              echo "::error::clashing extraPorts=$bad rendered"; exit 1
            fi
            grep -q "bridgelink.extraPorts" /tmp/clash.txt \
              || { echo "::error::the failure for $bad does not name bridgelink.extraPorts"; cat /tmp/clash.txt; exit 1; }
          done
          # The same numbers are fine where they do not clash: another protocol, or HTTP off.
          helm template bl charts/bridgelink $SID --set bridgelink.service.ports.http=null --set-json \
            'bridgelink.extraPorts=[{"name":"udp","containerPort":8443,"protocol":"UDP"},{"name":"web","containerPort":6661,"port":8080}]' > /dev/null
          echo "clashing extraPorts are refused, non-clashing ones are not"
          if helm template bl charts/bridgelink $SID --set bridgelink.service.type=Loadbalancer > /tmp/badtype.txt 2>&1; then
            echo "::error::the schema accepted service.type=Loadbalancer"; exit 1
          fi
          echo "a misspelt Service type is rejected"
          # A Service with no ports is invalid, so the listener Service needs at least one extra port.
          if helm template bl charts/bridgelink $SID --set bridgelink.listenerService.enabled=true > /tmp/nolistener.txt 2>&1; then
            echo "::error::listenerService.enabled=true rendered with no extraPorts"; exit 1
          fi
          grep -q "extraPorts" /tmp/nolistener.txt \
            || { echo "::error::the failure does not name extraPorts"; cat /tmp/nolistener.txt; exit 1; }
          echo "a listener Service without extra ports is refused"

      - name: WebAdmin is off by default
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import yaml
          docs = [d for d in yaml.safe_load_all(open('/tmp/rendered.yaml')) if d]
          wa = [d['metadata']['name'] for d in docs if d['metadata']['name'].endswith('-webadmin')]
          assert not wa, f'WebAdmin rendered without webadmin.enabled: {wa}'
          print('no WebAdmin resources by default')
          PY

      - name: WebAdmin, when enabled, points at this release's BridgeLink
        run: |
          set -euo pipefail
          # webadmin.env tries to override every chart-owned variable. The chart must ignore those
          # entries (a duplicate env name is rejected by Kubernetes only at apply time) and keep
          # unrelated extras.
          helm template bl charts/bridgelink $SID \
            --set webadmin.enabled=true --set webadmin.acceptLicense=true \
            --set webadmin.env.BRIDGELINK_SERVER_URL=https://elsewhere:8443 \
            --set webadmin.env.PORT=3000 --set webadmin.env.BL_ACCEPT_LICENSE=0 \
            --set webadmin.env.COOKIE_SECURE=false > /tmp/webadmin.yaml
          python3 - <<'PY'
          import yaml
          docs = [d for d in yaml.safe_load_all(open('/tmp/webadmin.yaml')) if d]
          vals = yaml.safe_load(open('charts/bridgelink/values.yaml'))
          def one(kind, suffix):
              m = [d for d in docs if d['kind'] == kind and d['metadata']['name'].endswith(suffix)]
              assert len(m) == 1, f'expected one {kind} *{suffix}, got {len(m)}'
              return m[0]
          bl_svc, wa_svc = one('Service', '-bl'), one('Service', '-webadmin')
          bl_dep, wa_dep = one('Deployment', '-bl'), one('Deployment', '-webadmin')
          c = wa_dep['spec']['template']['spec']['containers'][0]
          names = [e['name'] for e in c['env']]
          dupes = sorted({n for n in names if names.count(n) > 1})
          assert not dupes, f'duplicate env names (webadmin.env overrode a chart-owned one): {dupes}'
          env = {e['name']: e.get('value') for e in c['env']}
          assert env.get('COOKIE_SECURE') == 'false', 'webadmin.env extras must still be passed through'

          # Computed from the rendered Service, so a rename of either side fails here.
          https = next(p['port'] for p in bl_svc['spec']['ports'] if p['name'] == 'https')
          want = f"https://{bl_svc['metadata']['name']}:{https}"
          assert env.get('BRIDGELINK_SERVER_URL') == want, \
              f"BRIDGELINK_SERVER_URL is {env.get('BRIDGELINK_SERVER_URL')!r}, want {want!r}"
          assert env.get('BL_ACCEPT_LICENSE') == '1', 'BL_ACCEPT_LICENSE must be "1" once accepted'

          # 8444 is WebAdmin's documented default. The image's built-in config says 3000, so PORT
          # must be passed, and it must agree with the port the Service targets.
          port = next(p for p in c['ports'] if p['name'] == 'https')['containerPort']
          assert port == 8444, f'WebAdmin containerPort is {port}, want the documented 8444'
          assert env.get('PORT') == str(port), f"PORT env {env.get('PORT')!r} != containerPort {port}"
          assert wa_svc['spec']['ports'][0]['targetPort'] == 'https'

          tag = c['image'].rsplit(':', 1)[1]
          # str(): an unquoted two-part tag such as 26.7 loads from YAML as a float.
          assert tag == str(vals['webadmin']['image']['tag']), f'image tag {tag} is not the values pin'

          # The BridgeLink Service selects on `app: bl`. WebAdmin pods carrying it would receive
          # BridgeLink traffic, so each Service must select only its own pods.
          def selects(svc, dep):
              labels = dep['spec']['template']['metadata']['labels']
              return all(labels.get(k) == v for k, v in svc['spec']['selector'].items())
          assert selects(bl_svc, bl_dep) and selects(wa_svc, wa_dep), 'a Service misses its own pods'
          assert not selects(bl_svc, wa_dep), 'the BridgeLink Service selects WebAdmin pods'
          assert not selects(wa_svc, bl_dep), 'the WebAdmin Service selects BridgeLink pods'
          print('WebAdmin wiring OK')
          PY

      - name: WebAdmin is never deployed with the license accepted implicitly
        run: |
          set -euo pipefail
          # Accepting the WebAdmin license is the user's decision. Enabling WebAdmin without
          # webadmin.acceptLicense must fail the render, not deploy something that accepts it.
          if helm template bl charts/bridgelink $SID --set webadmin.enabled=true > /tmp/nolicense.txt 2>&1; then
            echo "::error::webadmin.enabled=true rendered without webadmin.acceptLicense=true"; exit 1
          fi
          grep -q "acceptLicense" /tmp/nolicense.txt \
            || { echo "::error::the failure does not name webadmin.acceptLicense"; cat /tmp/nolicense.txt; exit 1; }
          echo "enabling WebAdmin without acceptLicense is refused"

      - name: Chart README is regenerated from values.yaml
        run: |
          set -euo pipefail
          # README.md is generated by helm-docs from README.md.gotmpl + the `# --` comments in
          # values.yaml. Editing values without regenerating leaves the published table wrong, so
          # fail the PR rather than let the two drift.
          # Pinned, not :latest — a helm-docs release that changes table or badge formatting would
          # otherwise fail this gate on an unrelated PR, and the fix commit would then fail for the
          # next person once the tag moved again. Bump deliberately, regenerating in the same commit.
          docker run --rm -v "$PWD/charts:/helm-docs" -u "$(id -u)" jnorwood/helm-docs:v1.14.2 \
            --chart-search-root=/helm-docs --template-files=README.md.gotmpl
          if ! git diff --quiet charts/bridgelink/README.md; then
            echo "::error::charts/bridgelink/README.md is stale — run helm-docs and commit the result"
            git diff -- charts/bridgelink/README.md
            exit 1
          fi
          echo "chart README is current"

  kind:
    # Installs the chart on a real cluster (kind, Kubernetes in Docker) and checks what `helm
    # template` cannot: that BridgeLink becomes Ready, that an upgrade never runs two BridgeLink pods,
    # that encrypted messages stay readable after the pod is replaced, that a channel listener answers
    # through the listener Service, that the bundled Postgres runs the config the chart ships and
    # refuses passwordless connections, that BridgeLink and WebAdmin are admitted in a namespace
    # enforcing "restricted", against an external database, that a plugin installs from a download
    # URL and from a claim, and that the Services survive a change from LoadBalancer to ClusterIP on
    # upgrade. A separate job because it takes several minutes, so
    # the template checks above still report in under one. charts/test/kind-test.sh has the detail.
    needs: chart
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Helm 3 upgrades with a client-side three-way merge; Helm 4 uses server-side apply for the
        # releases it installs. They can disagree about removing a field (they did for the move to
        # strategy: Recreate), so the chart is installed and upgraded under both.
        helm: [v3.22.0, v4.3.0]
    name: kind (helm ${{ matrix.helm }})
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # UPGRADE_FROM checks out the base branch's chart
      - uses: azure/setup-helm@v4
        with:
          version: ${{ matrix.helm }}
      # Authenticated pulls, as in build-images.yml: every image would otherwise be pulled
      # anonymously from the runner's shared address. Skipped where the secret is unavailable
      # (pull requests from forks); the test then pulls anonymously.
      - name: Log in to Docker Hub (authenticated pulls)
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: helm/kind-action@v1
        with:
          install_only: true   # the script creates and deletes its own cluster
      - name: Install, upgrade and exercise the chart on kind
        env:
          # On a pull request, install the base branch's chart and upgrade to this one: the path an
          # existing release takes when the PR merges. On main, install and upgrade this checkout.
          UPGRADE_FROM: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          PULL_IMAGES: "1"   # pull on the host (logged in above) and load into kind
        run: bash charts/test/kind-test.sh

  publish:
    # Publishes the chart as an OCI package at oci://ghcr.io/innovar-healthcare/charts/bridgelink,
    # so customers install a version they can pin instead of a git checkout. Runs on main only,
    # after both gates above pass, and never from a pull request or a fork.
    #
    # The release is the merge that changes `version` in Chart.yaml; the version-bump check in the
    # chart job makes every chart change do that. A published version is never replaced: `helm push`
    # overwrites an OCI tag without asking, so this job asks the registry first. A version that is
    # already there with the same content is a no-op (a push that only touched this workflow, or a
    # re-run). With different content the job fails rather than overwrite it.
    #
    # The first push creates the package as private. An org admin makes it public once, in the
    # package's settings on GitHub; until then an anonymous `helm pull` is denied.
    needs: [chart, kind]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Innovar-Healthcare/bridgelink-container'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Two quick merges must not both decide a version is absent and then both push it. GitHub keeps
    # one running and one pending job per group, so a third merge in that window cancels the pending
    # one and its version is never pushed. Re-run that cancelled workflow run to publish it.
    concurrency:
      group: chart-publish
      cancel-in-progress: false
    env:
      SID: --set-string bridgelink.environment.SERVER_ID=3f0c2a9e-5b1d-4c7e-8a6f-0d9e1b2c3a4f
      REGISTRY: ghcr.io
      NAMESPACE: innovar-healthcare/charts   # OCI references must be lowercase
      CHART: bridgelink
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0

      - name: Package and lint the archive
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version: *//p' "charts/$CHART/Chart.yaml")
          echo "VERSION=$version" >> "$GITHUB_ENV"
          helm package "charts/$CHART" -d dist
          # Lint the archive customers receive, not the source directory: .helmignore applies here.
          helm lint "dist/$CHART-$version.tgz" $SID

      - name: Log in to GHCR
        run: echo "$GH_TOKEN" | helm registry login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin

      - name: Is this version already published?
        id: exists
        run: |
          set -euo pipefail
          # Ask the registry directly. 200 means published and 404 means not; anything else is an
          # error. Reading an error as "absent" would let the push below overwrite a release. An
          # authenticated caller gets 404 even before the package exists, so a 403 here means this
          # token cannot read the package: fix its access, do not treat it as absent.
          token=$(curl -fsS -u "$GITHUB_ACTOR:$GH_TOKEN" \
            "https://$REGISTRY/token?service=$REGISTRY&scope=repository:$NAMESPACE/$CHART:pull" | jq -r .token)
          code=$(curl -sS -o manifest.json -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
            "https://$REGISTRY/v2/$NAMESPACE/$CHART/manifests/$VERSION")
          case "$code" in
            200) echo "published=true" >> "$GITHUB_OUTPUT"; echo "$CHART $VERSION is already published" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT"; echo "$CHART $VERSION is not published yet" ;;
            *)   echo "::error::registry answered HTTP $code for $CHART $VERSION; not publishing"
                 cat manifest.json; exit 1 ;;
          esac

      - name: Refuse to replace a published version
        if: steps.exists.outputs.published == 'true'
        run: |
          set -euo pipefail
          mkdir -p cmp/published cmp/ours
          helm pull "oci://$REGISTRY/$NAMESPACE/$CHART" --version "$VERSION" -d cmp
          tar -xzf "cmp/$CHART-$VERSION.tgz" -C cmp/published
          tar -xzf "dist/$CHART-$VERSION.tgz" -C cmp/ours
          # Chart.yaml is re-serialized by `helm package`, so compare it as data rather than text:
          # a different Helm release formatting it differently is not a content change.
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
          if diff -r --exclude=Chart.yaml cmp/published cmp/ours && python3 - <<'PY'
          import os, sys, yaml
          chart = os.environ['CHART']
          a = yaml.safe_load(open(f'cmp/published/{chart}/Chart.yaml'))
          b = yaml.safe_load(open(f'cmp/ours/{chart}/Chart.yaml'))
          sys.exit(0 if a == b else 1)
          PY
          then
            echo "::notice::$CHART $VERSION is already published with this content; nothing to do"
          else
            echo "::error file=charts/$CHART/Chart.yaml::charts/$CHART differs from the published $VERSION; bump version in Chart.yaml"
            exit 1
          fi

      - name: Push
        if: steps.exists.outputs.published == 'false'
        run: |
          set -euo pipefail
          helm push "dist/$CHART-$VERSION.tgz" "oci://$REGISTRY/$NAMESPACE" 2>&1 | tee push.log
          {
            echo "### Published $CHART $VERSION"
            echo
            echo "- Reference: \`oci://$REGISTRY/$NAMESPACE/$CHART --version $VERSION\`"
            echo "- $(grep -i '^Digest:' push.log)"
            echo "- Commit: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Read the published version back from the registry
        run: |
          set -euo pipefail
          ref="oci://$REGISTRY/$NAMESPACE/$CHART"
          mkdir -p verify   # helm pull -d does not create the directory
          helm pull "$ref" --version "$VERSION" -d verify
          helm show chart "$ref" --version "$VERSION" | tee chart.txt
          grep -qx "version: $VERSION" chart.txt || { echo "::error::published chart does not report version $VERSION"; exit 1; }
          helm template bl "$ref" --version "$VERSION" $SID > /dev/null
          echo "$ref $VERSION pulls, reports its version and renders"
