# Publish the standard (Rocky) BridgeLink image to the private ECR registry
#
# This is the standard/Rocky variant's release path. The hardened dhi / dhi-slim variants are
# published by build-images.yml, which also carries the weekly rebuild-on-base-update schedule.
#
# Replaces the former publish-ghcr.yml. GHCR was retired rather than kept alongside ECR on quota
# grounds: a Free-plan 500 MB storage / 1 GB month transfer allowance cannot carry a 1.33 GB
# multi-arch image. The public Docker Hub path (publish-dockerhub.yml) is unchanged.
#
# Unlike its GHCR predecessor this gates the release: the acceptance suite and the Trivy
# fixable-HIGH/CRITICAL OS gate both run against a locally built image before anything is pushed.
#
# Tags: `<version>`, `latest` when asked, and the floating `<major>.<minor>` when this is the newest
# patch of its minor in this registry (decided automatically, see Compute BINARY_URL and JDK).
#
# Manual-only (workflow_dispatch). Fetches the release tarball from a private s3:// location via
# OIDC — no long-lived AWS credentials.
#
# Required repo config (all Secrets; this repo's run logs are public, and the runner masks a secret
# in every log line while it prints a variable):
#   Secrets:
#     AWS_PUBLISH_ROLE_ARN   the bridgelink-publish role. It carries both the ECR push policy and
#                            the s3:// release read, and is assumable from the integration branch
#                            ONLY — these tags are mutable, so push access is the ability to
#                            replace an already-released image. Both credential steps also set
#                            mask-aws-account-id, so the account id is masked wherever it appears.
#     RELEASE_BUCKET         bucket holding the release tarballs, without the s3:// scheme. The
#                            Compute BINARY_URL step fails fast if it is unset rather than
#                            building a wrong URL.
#     DOCKERHUB_USERNAME / DOCKERHUB_TOKEN   authenticated base-image pulls only, never a push
#                            target here — avoids the anonymous pull-rate limit on shared runners.
#
# Images are pullable only with credentials: the repositories carry no repository policy, so access
# is IAM-only.

name: publish-ecr

run-name: publish-ecr ${{ inputs.version }} ${{ inputs.push && 'push' || 'dry-run' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "BridgeLink version to publish (e.g. 26.6.0)"
        required: true
      java:
        description: "Java major override. Optional — a version in MAINTAINED_VERSIONS resolves to its pinned JDK; an unlisted new release defaults to 21. Set only to publish a brand-new release on a non-default JDK."
        required: false
      latest:
        description: "Also move the rolling `latest` tag to this version"
        type: boolean
        default: false
      push:
        description: "Push the image (uncheck for a build + test + scan dry run)"
        type: boolean
        default: true

permissions:
  id-token: write        # OIDC to AWS for the s3:// binary fetch and the ECR push
  contents: read
  security-events: write # upload the Trivy SARIF to Security > Code scanning

concurrency:
  group: publish-ecr-${{ github.event.inputs.version }}
  cancel-in-progress: false

env:
  # The registry is in us-east-2; the release-tarball bucket is in us-east-1. These are deliberately
  # separate: the session region drives the ECR login, while the credentials file mounted into the
  # build carries the bucket's region for `aws s3 cp`.
  ECR_REGION: us-east-2
  S3_REGION: us-east-1
  # 3h, the MaxSessionDuration of bridgelink-publish. The emulated arm64 stage of the
  # multi-arch build re-reads the tarball from S3 and is slow, so the session has to outlast it.
  SESSION_SECONDS: "10800"
  ECR_REPOSITORY: innovarhealthcare/bridgelink
  TEST_IMAGE: innovarhealthcare/bridgelink:rocky-release-test

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # OIDC -> temporary AWS creds, used both for the in-build s3:// fetch and the ECR push.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PUBLISH_ROLE_ARN }}
          mask-aws-account-id: true
          aws-region: ${{ env.ECR_REGION }}
          role-duration-seconds: ${{ env.SESSION_SECONDS }}

      # RELEASE_BUCKET is a repo secret rather than a literal, so the runner masks it in every log
      # line. Guarded rather than defaulted: an unset secret would otherwise build
      # `s3:///bridgelink/...`, which fails deep inside the Docker build with an error that does
      # not name the cause.
      - name: Compute BINARY_URL and JDK
        id: url
        env:
          VERSION: ${{ github.event.inputs.version }}
          JAVA_INPUT: ${{ github.event.inputs.java }}
          RELEASE_BUCKET: ${{ secrets.RELEASE_BUCKET }}
          MAINTAINED_VERSIONS_RAW: ${{ vars.MAINTAINED_VERSIONS }}
        run: |
          set -euo pipefail
          : "${RELEASE_BUCKET:?RELEASE_BUCKET repo secret is unset — set it in Settings > Secrets and variables > Actions}"

          # The floating minor tag is cut from the version, and a two-part version such as "26.6"
          # would publish its version tag straight over the 26.6 floating tag.
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::version must be a plain <major>.<minor>.<patch> (e.g. 26.6.1, no leading zeros), got '$VERSION'." >&2
            exit 1
          fi

          # Resolve the JDK from MAINTAINED_VERSIONS — the same source of truth the weekly rebuild
          # uses — so a manual publish can never move an already-released tag onto a different JDK.
          # A listed version's pinned java wins (an omitted field there means 17); an explicit input
          # that disagrees is refused, not silently honoured. A version not yet listed (a brand-new
          # release) takes the input, or 21 by default.
          PINNED=""
          if [ -n "${MAINTAINED_VERSIONS_RAW:-}" ]; then
            # Only the PRIMARY entry for this version — the one with no tag_suffix. A version may
            # have a second MAINTAINED_VERSIONS entry publishing a qualified DHI tag on a different
            # JDK (e.g. -jdk17); that entry describes a hardened image built by build-images.yml and
            # says nothing about the Rocky image this workflow publishes. Keyed on version alone,
            # `.[0]` would resolve by array order and could build Rocky on the qualified line's JDK.
            PINNED="$(jq -r --arg v "$VERSION" \
              'map(select(.version==$v and (.tag_suffix // "")=="")) | if length>0 then (.[0].java // 17 | tostring) else "" end' \
              <<<"$MAINTAINED_VERSIONS_RAW")"
          fi
          if [ -n "$PINNED" ]; then
            if [ -n "$JAVA_INPUT" ] && [ "$JAVA_INPUT" != "$PINNED" ]; then
              echo "::error::$VERSION is pinned to Java $PINNED in MAINTAINED_VERSIONS; refusing to publish it on Java $JAVA_INPUT — that would move an already-released tag's JDK." >&2
              exit 1
            fi
            JAVA="$PINNED"
          else
            JAVA="${JAVA_INPUT:-21}"
          fi
          # The value becomes a yum package name inside the Dockerfile, where a typo fails late with
          # an error that does not name the input; validate it here.
          if ! [[ "$JAVA" =~ ^[0-9]+$ ]]; then
            echo "::error::java must be a bare major version such as 17 or 21, got '$JAVA'." >&2
            exit 1
          fi

          # Floating minor tag: <major>.<minor> follows the newest patch of that minor, so users
          # can take patches without also taking the next minor (which `latest` would).
          # Rocky publishes do not go through MAINTAINED_VERSIONS, so the only record of which
          # Rocky patches exist here is the repository itself: move the tag only if no tag already
          # in it names a newer patch. `>=`, not `>`, so republishing the newest patch is harmless.
          # Decided per registry, so a patch published only to Docker Hub does not hold this one
          # back, and vice versa. Decided before the long build, and a failed lookup fails the job
          # rather than skipping, because a skipped move leaves the tag stale with no signal.
          # Not guarded against two concurrent publishes of different patches in one minor
          # (concurrency is keyed per version); publishes are manual, so run them one at a time.
          # Uses the OIDC session above; bridgelink-publish carries ecr:DescribeImages.
          MINOR="${VERSION%.*}"
          MINOR_TAG=""
          if ! TAGS_JSON="$(aws ecr describe-images --region "$ECR_REGION" \
                 --repository-name "$ECR_REPOSITORY" --filter tagStatus=TAGGED \
                 --query 'imageDetails[].imageTags[]' --output json)"; then
            echo "::error::could not list ECR tags to decide whether $VERSION is the newest $MINOR patch." >&2
            exit 1
          fi
          NEWER="$(jq -r --arg v "$VERSION" --arg m "$MINOR" '
            (. // []) | map(select(startswith($m + ".")) | ltrimstr($m + ".") | select(test("^[0-9]+$")) | tonumber)
            | map(select(. > ($v | split(".")[2] | tonumber))) | max // empty | "\($m).\(.)"' <<<"$TAGS_JSON")"
          if [ -z "$NEWER" ]; then
            MINOR_TAG="$MINOR"
            echo "$VERSION is the newest $MINOR patch in ECR; the $MINOR tag moves to it."
          else
            echo "$NEWER is already in ECR; the $MINOR tag stays where it is."
          fi

          VERSION_US="${VERSION//./_}"
          {
            echo "binary_url=s3://${RELEASE_BUCKET}/bridgelink/${VERSION}/official-release/BridgeLink_unix_${VERSION_US}.tar.gz"
            echo "java=$JAVA"
            echo "minor_tag=$MINOR_TAG"
          } >> "$GITHUB_OUTPUT"

      # The Dockerfile fetches the binary during the build via a mounted aws_credentials secret.
      # region is the BUCKET's region, not the session's — see the env block above.
      - name: Stage AWS credentials for the build
        run: |
          set -euo pipefail
          umask 077
          {
            echo "[default]"
            echo "aws_access_key_id=${AWS_ACCESS_KEY_ID}"
            echo "aws_secret_access_key=${AWS_SECRET_ACCESS_KEY}"
            echo "aws_session_token=${AWS_SESSION_TOKEN}"
            echo "region=${S3_REGION}"
          } > "${RUNNER_TEMP}/aws_credentials"

      # Authenticated pulls only (the rockylinux base plus the acceptance suite's
      # nginx/postgres/mysql images). Docker Hub is not a push target in this workflow.
      - name: Log in to Docker Hub (authenticated pulls)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- Gate: build, acceptance-test and scan before publishing ---------------------------------
      # Single-arch local build, mirroring build-images.yml's test-rocky job. The multi-arch publish
      # build below reuses the same layers from the buildx cache.
      - name: Build Rocky test image
        uses: docker/build-push-action@v6
        env:
          # Build records are downloadable artifacts on this public repo and carry the build args;
          # the job summary lists the build inputs and links to the record. Produce neither.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: ${{ env.TEST_IMAGE }}
          build-args: |
            BINARY_URL=${{ steps.url.outputs.binary_url }}
            JAVA_MAJOR=${{ steps.url.outputs.java }}
          secret-files: |
            aws_credentials=${{ runner.temp }}/aws_credentials

      - name: Run acceptance tests
        # Rocky runs as UID 1000 and ships a shell, so the no-shell assertion is skipped for it.
        # EXPECTED_JAVA proves the runtime is on the JDK resolved above. Via env, not spliced into
        # the script, per this file's convention for inputs.
        env:
          EXPECTED_JAVA: ${{ steps.url.outputs.java }}
        run: |
          IMAGE="$TEST_IMAGE" SKIP_BUILD=1 \
            DOCKERFILE=Dockerfile EXPECTED_UID=1000 CHECK_NO_SHELL=0 \
            bash test/image-test.sh

      - name: Trivy scan (SARIF, full report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.TEST_IMAGE }}
          scanners: vuln
          format: sarif
          output: trivy-rocky-release.sarif
          exit-code: "0"
        env:
          # Full report must include everything; .trivyignore stays scoped to the gate step below.
          TRIVY_IGNOREFILE: /dev/null

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-rocky-release.sarif
          # Distinct from build-images.yml's trivy-rocky category so the two do not overwrite each
          # other's findings in the Security tab.
          category: trivy-rocky-release-${{ github.event.inputs.version }}

      # Gate: fail on FIXABLE HIGH/CRITICAL in OS/base packages — the layer this repo owns. Library
      # CVEs from the bundled BridgeLink app JARs come from the Core release tarball and can't be
      # fixed here; they stay visible in the SARIF above and are tracked against Core (IRT-1396).
      - name: Trivy gate (fixable HIGH/CRITICAL, OS packages)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.TEST_IMAGE }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
        env:
          TRIVY_PKG_TYPES: os

      # --- Publish (multi-arch) --------------------------------------------------------------------
      #
      # Re-assume before the release build. The credentials file staged above carries a session
      # token that expires on its own clock, and everything between then and here — a single-arch
      # build, the acceptance suite with its database containers, two Trivy scans — runs first.
      # The multi-arch build then re-reads the tarball from S3 inside the emulated arm64 stage,
      # which is the slowest part of the job and the last thing to need those credentials. A
      # single session assumed at the top of the job can expire before it gets there, failing the
      # release deep inside BuildKit with an S3 auth error. Raising the duration alone is not
      # enough: the pre-existing read role is capped at 1h by MaxSessionDuration, which is part of
      # why bridgelink-publish exists (it allows 3h).
      - name: Re-assume AWS credentials for the release build (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PUBLISH_ROLE_ARN }}
          mask-aws-account-id: true
          aws-region: ${{ env.ECR_REGION }}
          role-duration-seconds: ${{ env.SESSION_SECONDS }}

      - name: Re-stage AWS credentials for the release build
        run: |
          set -euo pipefail
          umask 077
          {
            echo "[default]"
            echo "aws_access_key_id=${AWS_ACCESS_KEY_ID}"
            echo "aws_secret_access_key=${AWS_SECRET_ACCESS_KEY}"
            echo "aws_session_token=${AWS_SESSION_TOKEN}"
            echo "region=${S3_REGION}"
          } > "${RUNNER_TEMP}/aws_credentials"

      # After the re-assume above, so the login token is fresh too (it lasts 12h regardless).
      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute tags
        id: tags
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          VERSION: ${{ github.event.inputs.version }}
          LATEST: ${{ github.event.inputs.latest }}
          MINOR_TAG: ${{ steps.url.outputs.minor_tag }}
        run: |
          set -euo pipefail
          if [ -z "$REGISTRY" ]; then
            echo "::error::ECR login produced no registry — refusing to publish with an unqualified tag." >&2
            exit 1
          fi
          # The registry-free refs come first: they are what the digest file names. The push list
          # is the same refs with the registry host in front.
          R="$ECR_REPOSITORY:${VERSION}"
          if [ "$LATEST" = "true" ]; then
            R="$R"$'\n'"$ECR_REPOSITORY:latest"
          fi
          if [ -n "$MINOR_TAG" ]; then
            # Last-gate re-check: it must be the <major>.<minor> of this very version.
            if [ "$MINOR_TAG" != "${VERSION%.*}" ]; then
              echo "::error::refusing to move floating tag '$MINOR_TAG' from '$VERSION'." >&2
              exit 1
            fi
            R="$R"$'\n'"$ECR_REPOSITORY:${MINOR_TAG}"
          fi
          T="$(while IFS= read -r ref; do echo "$REGISTRY/$ref"; done <<<"$R")"
          {
            echo "refs<<EOF"; echo "$R"; echo "EOF"
            echo "list<<EOF"; echo "$T"; echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build & push image to ECR
        id: build
        uses: docker/build-push-action@v6
        env:
          # Build records are downloadable artifacts on this public repo and carry the build args;
          # the job summary lists the build inputs and links to the record. Produce neither.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event.inputs.push == 'true' }}
          build-args: |
            BINARY_URL=${{ steps.url.outputs.binary_url }}
            JAVA_MAJOR=${{ steps.url.outputs.java }}
          secret-files: |
            aws_credentials=${{ runner.temp }}/aws_credentials
          tags: ${{ steps.tags.outputs.list }}

      # Tags in this repository are MUTABLE by design — a rebuild re-pushes the same tag so a
      # supported version keeps picking up base-image fixes. The manifest digest is therefore the
      # immutable release identity. Record it for the release notes.
      - name: Record published digest
        if: github.event.inputs.push == 'true'
        env:
          VERSION: ${{ github.event.inputs.version }}
          MINOR_TAG: ${{ steps.url.outputs.minor_tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### $VERSION (standard/Rocky, private ECR)"
            echo
            if [ -n "$MINOR_TAG" ]; then
              echo "Also tagged \`$MINOR_TAG\`."
              echo
            fi
            echo "Digest: \`$DIGEST\`"
            echo
            echo "Tags are mutable; pin by digest for an immutable reference."
          } >> "$GITHUB_STEP_SUMMARY"

      # Hands the pushed digests to the release pipeline as a run artifact, on pushes only like the
      # summary above. Every line is checked against an allow-list before the file is moved into
      # the upload directory, so a registry host, an account id or an unknown repository cannot
      # reach the artifact. The file is not printed to the log: the masker would show the
      # organisation name as ***.
      - name: Write digest file for the release pipeline
        id: digests
        if: github.event.inputs.push == 'true'
        env:
          ARTIFACT: image-digests-publish-ecr-${{ github.event.inputs.version }}
          VERSION: ${{ github.event.inputs.version }}
          JAVA: ${{ steps.url.outputs.java }}
          REFS: ${{ steps.tags.outputs.refs }}
          DIGEST: ${{ steps.build.outputs.digest }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          digest_re='^sha256:[0-9a-f]{64}$'
          artifact_re='^image-digests-(publish-ecr|publish-dockerhub|build-images)-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[a-z0-9][a-z0-9._-]*)?$'
          value_re='^[A-Za-z0-9._-]+$'
          if ! [[ "$DIGEST" =~ $digest_re ]]; then
            echo "::error::the push step produced no valid digest; not writing the digest file." >&2
            exit 1
          fi
          if ! [[ "$ARTIFACT" =~ $artifact_re ]]; then
            echo "::error::artifact name '$ARTIFACT' is outside the image-digests-<workflow>-<version><suffix> pattern." >&2
            exit 1
          fi
          if [ "$ARTIFACT" != "image-digests-publish-ecr-${VERSION}" ]; then
            echo "::error::artifact name '$ARTIFACT' does not match the version being recorded." >&2
            exit 1
          fi
          for v in "$VERSION" "$JAVA" "$HEAD_SHA"; do
            if ! [[ "$v" =~ $value_re ]]; then
              echo "::error::a header value is empty or holds a character outside [A-Za-z0-9._-]; not writing the digest file." >&2
              exit 1
            fi
          done

          F="$RUNNER_TEMP/image-digests.tmp"
          {
            echo "workflow=publish-ecr"
            echo "version=$VERSION"
            echo "tag_suffix="
            echo "java=$JAVA"
            echo "destination=ecr"
            echo "head_sha=$HEAD_SHA"
          } > "$F"
          n=0
          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            echo "digest.${ref}=${DIGEST}" >> "$F"
            n=$((n + 1))
          done <<<"$REFS"
          if [ "$n" -eq 0 ]; then
            echo "::error::no tags to record; not writing the digest file." >&2
            exit 1
          fi

          # Every line is a known header or a digest line for one of the three repositories.
          head_re='^(workflow|version|tag_suffix|java|destination|head_sha)=[A-Za-z0-9._-]*$'
          dig_re='^digest\.innovarhealthcare/bridgelink(-dhi|-dhi-slim)?:[A-Za-z0-9._-]+=sha256:[0-9a-f]{64}$'
          if grep -Evq "(${head_re})|(${dig_re})" "$F"; then
            echo "::error::digest file holds a line outside the allow-list; not uploading." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/image-digests"
          mv "$F" "$RUNNER_TEMP/image-digests/$ARTIFACT.txt"

      - name: Upload digests for the release pipeline
        if: github.event.inputs.push == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: image-digests-publish-ecr-${{ github.event.inputs.version }}
          path: ${{ runner.temp }}/image-digests/
          if-no-files-found: error
