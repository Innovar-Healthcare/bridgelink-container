# eksctl config for the chart's throwaway EKS test cluster. A template: render.sh fills the
# ${...} values from an env file kept outside the repo (see env.example), so no account, network or
# address detail is committed. Not a production cluster design.
#
# Shape, and why:
#   - Existing VPC and two existing subnets in different zones. Nothing here creates a VPC, a
#     subnet or a NAT gateway.
#   - Self-managed node groups with a public IP on each node, because the subnets have no NAT and
#     do not assign public IPs themselves (managed node groups refuse such subnets). No security
#     group in this cluster accepts traffic from outside the VPC; the address is for egress only.
#   - The API endpoint is private plus a public endpoint limited to one /32 while eksctl creates the
#     cluster. eksctl needs the public endpoint during creation; the README switches it off
#     straight afterwards. extraCIDRs lets the network the operator comes from reach the private
#     endpoint on 443.
#   - Two nodes in zone A and one in zone B, so the test can move the pod within a zone and show
#     that an EBS volume cannot follow it to another one.
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: ${CLUSTER_NAME}
  region: ${REGION}
  version: "${K8S_VERSION}"
  tags:
    Owner: ${OWNER}
    Ticket: ${TICKET}
    Project: ${PROJECT}
    Ephemeral: "true"

accessConfig:
  authenticationMode: API

vpc:
  id: ${VPC_ID}
  subnets:
    public:
      ${AZ_A}:
        id: ${SUBNET_A}
      ${AZ_B}:
        id: ${SUBNET_B}
  clusterEndpoints:
    privateAccess: true
    publicAccess: true
  publicAccessCIDRs: ["${OPERATOR_PUBLIC_CIDR}"]
  extraCIDRs: ["${OPERATOR_PRIVATE_CIDR}"]

iam:
  withOIDC: true
  serviceAccounts:
    - metadata:
        name: aws-load-balancer-controller
        namespace: kube-system
      wellKnownPolicies:
        awsLoadBalancerController: true

addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy
  - name: aws-ebs-csi-driver
    wellKnownPolicies:
      ebsCSIController: true

nodeGroups:
  - name: ng-a
    availabilityZones: ["${AZ_A}"]
    desiredCapacity: 2
    minSize: 0
    maxSize: 2
    instanceType: t3.large
    amiFamily: AmazonLinux2023
    privateNetworking: false
    volumeSize: 20
    volumeType: gp3
    volumeEncrypted: true
    disableIMDSv1: true
    propagateASGTags: true
    iam:
      # Replaces eksctl's default list, so the defaults are repeated; SSM is for debugging a node.
      attachPolicyARNs:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
  - name: ng-b
    availabilityZones: ["${AZ_B}"]
    desiredCapacity: 1
    minSize: 0
    maxSize: 1
    instanceType: t3.large
    amiFamily: AmazonLinux2023
    privateNetworking: false
    volumeSize: 20
    volumeType: gp3
    volumeEncrypted: true
    disableIMDSv1: true
    propagateASGTags: true
    iam:
      attachPolicyARNs:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
