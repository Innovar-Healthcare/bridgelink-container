# -- Override the name of the chart
nameOverride: ""
# -- Provide a name to substitute for the full names of resources
fullnameOverride: ""

# -- Image pull secrets for every pod the chart creates (BridgeLink, WebAdmin, PostgreSQL), as a list
# of `{name: <secret>}`, e.g. for a private registry mirror.
imagePullSecrets: []

serviceAccount:
  # -- Create a ServiceAccount for the BridgeLink pod. With `create: false` and no `name`, the pod
  # uses the namespace's default ServiceAccount.
  create: false
  # -- ServiceAccount for the BridgeLink pod: the name to create, or an existing one to use. Empty
  # with `create: true` uses the release's full name.
  name: ""
  # -- Annotations for the created ServiceAccount, e.g. `eks.amazonaws.com/role-arn` to give
  # BridgeLink an IAM role through IRSA.
  annotations: {}

# @section BridgeLink Settings
bridgelink:
  # -- Number of BridgeLink pods: 0 or 1. The schema rejects anything higher, because more than one
  # active node needs the Channel Coordinator plugin and a server ID per pod, which this chart does
  # not set up. Upgrades stop the old pod before starting the new one (`strategy: Recreate`).
  replicaCount: 1

  image:
    # -- BridgeLink container image repository
    repository: innovarhealthcare/bridgelink
    # -- BridgeLink container image tag. Defaults to the Rocky image. For the hardened (DHI) image
    # set `tag: 26.9.0-dhi` and `runAsUser: 65532` / `runAsGroup: 65532` (see below).
    tag: 26.9.0
    # -- Image pull policy
    pullPolicy: IfNotPresent

  # -- Non-root UID the container runs as. Use 1000 for the Rocky image, 65532 for the hardened
  # (DHI) image. Must match the image so mounted appdata/custom-extensions are writable.
  runAsUser: 1000
  # -- Non-root GID the container runs as (see runAsUser). 1000 for Rocky, 65532 for DHI. Also the
  # default `fsGroup`, which makes appdata writable without a root init container.
  runAsGroup: 1000

  # -- Pod security context. `runAsUser`, `runAsGroup` and `fsGroup` default to the two values above
  # and can be overridden here. The defaults meet the Kubernetes "restricted" Pod Security Standard;
  # set one of the keys below to `null` to remove it.
  podSecurityContext:
    runAsNonRoot: true
    # Fix appdata ownership only when its top directory is wrong, rather than on every start.
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault

  # -- Security context for the BridgeLink container and the keystore init container. The defaults
  # meet the "restricted" Pod Security Standard. `readOnlyRootFilesystem` cannot be enabled: the
  # image writes its configuration under /opt/bridgelink at startup.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

  # appdata holds keystore.jks: the data-encryption key and the TLS certificate. If it is lost, every
  # message stored with encryption on can no longer be read. Keep it either on a volume (persistence)
  # or in a Secret you manage (keystore.existingSecret), and back it up with its passwords. See the
  # README's "Keystore and appdata" section.
  persistence:
    # -- Keep appdata on a PersistentVolumeClaim, so the keystore survives pod replacement (node
    # drains, upgrades, Karpenter consolidation). With `false`, appdata is an emptyDir and a replaced
    # pod starts with a new key unless `keystore.existingSecret` is set.
    enabled: true
    # -- Use this existing PersistentVolumeClaim instead of creating one, e.g. one bound to a
    # statically provisioned EFS volume. Used only while `enabled` is true.
    existingClaim: ""
    # -- Storage class for the claim. Empty uses the cluster default (EBS on EKS). For EFS, name an
    # EFS storage class whose `uid` and `gid` match `runAsUser` and `runAsGroup`, since EFS ignores
    # `fsGroup`.
    storageClass: ""
    # -- Access modes for the claim. `ReadWriteOnce` suits EBS; EFS also allows `ReadWriteMany`.
    accessModes:
      - ReadWriteOnce
    # -- Size of the claim. The keystore is small; the embedded Derby database (`MP_DATABASE: derby`)
    # also lives in appdata and needs more.
    size: 1Gi

  keystore:
    # -- Name of a Secret holding a keystore and its passwords, under the keys `keystore.jks`,
    # `keystore.storepass` and `keystore.keypass`. When set, the keystore is copied into appdata at
    # every start (the Secret wins over what is on the volume) and the passwords replace
    # `MP_KEYSTORE_STOREPASS` and `MP_KEYSTORE_KEYPASS`. Works with or without `persistence`. The
    # keystore must come from a BridgeLink server's appdata, so it already holds the data-encryption
    # key: one with only a TLS certificate gets a new key at every start. See the README.
    existingSecret: ""

  # Image for the init container that copies the keystore from `keystore.existingSecret`. Not used
  # otherwise. Point it at a mirror (for example Amazon ECR) if your nodes cannot pull Docker Hub.
  helperImage:
    # -- Helper image repository. Needs `/bin/sh`, `cp` and `mv`.
    repository: busybox
    # -- Helper image tag. Pinned: a moving tag would change what runs without a chart change.
    tag: "1.37.0"
    # -- Helper image pull policy
    pullPolicy: IfNotPresent

  service:
    # -- Service type for BridgeLink (LoadBalancer, ClusterIP, NodePort)
    type: LoadBalancer
    ports:
      # -- HTTP port for web interface
      http: 8080
      # -- HTTPS port for secure web interface
      https: 8443

  resources:
    requests:
      # -- CPU request for BridgeLink pods
      cpu: 500m
      # -- Memory request for BridgeLink pods
      memory: 1Gi
    limits:
      # -- CPU limit for BridgeLink pods
      cpu: 2000m
      # -- Memory limit for BridgeLink pods
      memory: 2Gi

  # Probes. Before this the chart shipped NONE, and could not: deployment.yaml templated
  # liveness and readiness, but no values defined them and values.schema.json forbade extra keys, so
  # the templates were unreachable and `--set bridgelink.readinessProbe...` was schema-rejected.
  # That schema bug is fixed, so all three are now settable.
  #
  # Only livenessProbe is ON by default, deliberately. The startup and readiness probes exec a probe
  # binary at /opt/bridgelink/bootstrap/BridgeLinkHealthcheck, which exists only in images built from
  # this repo at or after the commit that added it. Enabling them against an older
  # published image gives a container that cannot run the probe, a startup probe that exhausts its
  # failureThreshold, and a kubelet restart loop. Since this chart is installed straight from a
  # checkout rather than a published chart repo, a default that assumes an unreleased image would
  # break `scripts/deploy-minikube.sh` for anyone on main. livenessProbe has no such dependency: it
  # is a plain HTTPS GET that works against every image.
  #
  # ENABLE the exec probes once your image carries the probe (the image's own `docker inspect`
  # Healthcheck field is present iff it does). Paste into your values file:
  #
  #   bridgelink:
  #     startupProbe:
  #       exec:
  #         command: ["java", "-XX:TieredStopAtLevel=1", "-XX:+UseSerialGC", "-XX:-UsePerfData", "-Xmx32m", "-cp", "/opt/bridgelink/bootstrap", "BridgeLinkHealthcheck"]
  #       periodSeconds: 10
  #       failureThreshold: 30      # 300s budget: DB migration + startup channel deploy
  #       timeoutSeconds: 5         # NOT optional — see the note below
  #     readinessProbe:
  #       exec:
  #         command: ["java", "-XX:TieredStopAtLevel=1", "-XX:+UseSerialGC", "-XX:-UsePerfData", "-Xmx32m", "-cp", "/opt/bridgelink/bootstrap", "BridgeLinkHealthcheck"]
  #       periodSeconds: 15
  #       timeoutSeconds: 5
  #       failureThreshold: 3
  #
  # BEFORE ENABLING readinessProbe, know this: the probe polls /api/server/status only until the
  # server first reports ready, then switches to /api/server/version, because /status leaks one
  # server thread per request permanently while the database is unreachable. So an
  # enabled readinessProbe gates the initial rollout correctly but will NOT de-register a pod on a
  # later database outage — it reports liveness from then on. Setting BL_HEALTH_ALWAYS_STATUS=true in
  # the container env restores continuous readiness and the leak with it. Readiness that tracks
  # engine state without leaking needs the Core-side fix first.
  #
  # Why those two must be `exec` and not `httpGet`: /api/server/status returns HTTP 200 even when
  # the engine is UNAVAILABLE, so only reading the response body distinguishes ready from starting.
  # Why timeoutSeconds is mandatory: Kubernetes defaults exec probes to 1s and enforces it, which a
  # cold JVM plus a TLS handshake exceeds on a loaded node — the startup probe would never succeed.
  # Why readiness is 15s and not 5s: an exec probe's JVM is charged to this container's cgroup
  # (~50-80MB alongside the server), so leave headroom under resources.limits.memory if you raise
  # -Xmx toward the limit.

  # -- Startup probe. Disabled by default because it needs an image carrying the probe binary — see
  # the block above for the values to paste in once it does.
  startupProbe: null

  # -- Readiness probe. Disabled by default for the same reason as startupProbe; see above. Note
  # that until you enable it, a pod is considered Ready as soon as its container is running, which
  # means Service traffic can reach BridgeLink while the engine is still deploying channels.
  readinessProbe: null

  # -- Liveness probe. Enabled by default: it is a plain HTTPS GET and works against any image.
  # Restarts the pod only when the API stops answering at all.
  #
  # Deliberately /api/server/version, NOT /api/server/status. When the database goes away,
  # getStatus() calls isDatabaseRunning() -> testDatabase(), which blocks on the connection pool, so
  # /status does not return UNAVAILABLE — it HANGS (measured: no response in 10s, while /version
  # answered 200 in 73ms on the same server; tracked as a Core defect). A liveness probe pointed at
  # /status would therefore time out and restart the pod after failureThreshold x periodSeconds of
  # any database outage, which is exactly what liveness must not do: a restart does not fix a
  # database. /version reads an in-memory value and needs no authentication
  # (@DontCheckAuthorized), so it answers iff the JVM and Jetty are actually serving.
  #
  # kubelet does not verify the certificate on an HTTPS probe, so the self-signed keystore needs no
  # configuration. The X-Requested-With header is required (server.api.require-requested-with,
  # default true) — without it the endpoint returns HTTP 400 even though it needs no authentication.
  livenessProbe:
    httpGet:
      path: /api/server/version
      port: https
      scheme: HTTPS
      httpHeaders:
        - name: X-Requested-With
          value: kube-probe
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3

  # -- Extra annotations for the BridgeLink pod
  podAnnotations: {}
  # -- Extra labels for the BridgeLink pod. The chart's selector labels (`app`,
  # `app.kubernetes.io/name`, `app.kubernetes.io/instance`) cannot be changed and are ignored here.
  podLabels: {}

  # -- Extra environment variables for the BridgeLink container, as Kubernetes EnvVar entries, so
  # `valueFrom` works (for example a password from a Secret). An entry here replaces any variable of
  # the same name the chart sets, including `environment` and the database settings.
  extraEnv: []
  # -- Extra volumes for the BridgeLink pod, e.g. an EFS claim for file-based channels
  extraVolumes: []
  # -- Extra volume mounts for the BridgeLink container
  extraVolumeMounts: []

  # -- Node selector for BridgeLink pods
  nodeSelector: {}
  # -- Pod tolerations for BridgeLink
  tolerations: []
  # -- Pod affinity for BridgeLink
  affinity: {}

  # Every key becomes an environment variable on the BridgeLink container, so any setting the image
  # reads works here: an `MP_` variable sets the matching mirth.properties key (`MP_FOO_BAR` sets
  # `foo.bar`), and others such as `CUSTOM_PROPERTIES` or `BL_HEALTH_ALWAYS_STATUS` are read by the
  # image itself. Quote numbers (`"3000000"`): the schema rejects unquoted ones, because Helm would
  # render a large one as `3e+06`. For values from a Secret, use `extraEnv`.
  environment:
    # -- Database type (postgres, mysql, oracle, sqlserver)
    MP_DATABASE: "postgres"
    # -- JDBC URL of the database, passed through unchanged, so any scheme, port and parameters work
    # (for Amazon RDS, e.g. `jdbc:postgresql://<endpoint>:5432/bridgelinkdb?sslmode=require`). A value
    # containing `{{` is rendered as a Helm template, as are the username and password below. Leave
    # empty to use the bundled PostgreSQL. Required when `postgres.enabled` is false. For the embedded
    # Derby database instead, set `MP_DATABASE: derby` and `postgres.enabled: false` and leave this empty.
    MP_DATABASE_URL: ""
    # -- Database username. Leave empty to use `postgres.credentials.username` with the bundled PostgreSQL.
    MP_DATABASE_USERNAME: ""
    # -- Database password. Leave empty to use `postgres.credentials.password` with the bundled PostgreSQL.
    MP_DATABASE_PASSWORD: ""
    # -- Unique server identifier
    SERVER_ID: 7d760af2-680a-4a19-b9a2-c4685df61ebc
    # -- Keystore key password
    MP_KEYSTORE_KEYPASS: bridgelinkKeystore
    # -- Keystore store password
    MP_KEYSTORE_STOREPASS: bridgelinkKeypass
    # -- Configuration map location
    MP_CONFIGURATIONMAP_LOCATION: database

# @section PostgreSQL Settings
postgres:
  # -- Deploy a bundled PostgreSQL for evaluation. It is a single pod on one zone-bound volume with
  # no backups, so it is not suitable for production. For production set this to false and point
  # BridgeLink at an external database such as Amazon RDS. TCP connections require a password.
  enabled: true

  image:
    # -- PostgreSQL image repository
    repository: postgres
    # -- PostgreSQL image tag (kept in sync with docker-compose.yml)
    tag: 16-alpine
    # -- PostgreSQL image pull policy
    pullPolicy: IfNotPresent
  
  service:
    # -- PostgreSQL port number
    port: 5432

  persistence:
    # -- Enable PostgreSQL persistence
    enabled: true
    # -- PostgreSQL storage size
    size: 10Gi
    # -- Storage class for PostgreSQL (empty uses cluster default)
    storageClass: ""

  credentials:
    # -- PostgreSQL username
    username: bridgelinktest
    # -- PostgreSQL password
    password: bridgelinktest
    # -- PostgreSQL database name
    database: bridgelinkdb

  resources:
    requests:
      # -- PostgreSQL CPU request
      cpu: 200m
      # -- PostgreSQL memory request
      memory: 256Mi
    limits:
      # -- PostgreSQL CPU limit
      cpu: 1000m
      # -- PostgreSQL memory limit
      memory: 1Gi

# @section WebAdmin Settings
webadmin:
  # -- Deploy WebAdmin, the browser-based administrator, alongside BridgeLink. It is pointed at this
  # release's BridgeLink Service automatically. Requires `acceptLicense` as well.
  enabled: false

  # -- Accept the WebAdmin license: the Business Source License 1.1 plus the BridgeLink WebAdmin
  # Supplemental Terms. Read them with `docker run --rm --entrypoint cat <image> /app/LICENSE
  # /app/SUPPLEMENTAL-TERMS.md`, using the image set under `image:` below; the install error prints
  # the exact command. The chart never accepts them for you: with `enabled: true` and this left
  # false, `helm install` fails with an explanation instead of starting a container that would exit
  # without running.
  acceptLicense: false

  image:
    # -- WebAdmin container image repository
    repository: innovarhealthcare/bridgelink-webadmin
    # -- WebAdmin container image tag. WebAdmin is released separately from BridgeLink, and 26.9.0 is
    # the newest WebAdmin release for the 26.9 line. Bump it together with `bridgelink.image.tag`.
    tag: "26.9.0"
    # -- Image pull policy
    pullPolicy: IfNotPresent

  # -- Pod security context for WebAdmin. 1000 is the image's `node` user. The defaults meet the
  # "restricted" Pod Security Standard.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  # -- Security context for the WebAdmin container. `readOnlyRootFilesystem` cannot be enabled: the
  # image writes webadmin.conf and a self-signed TLS certificate under /app at startup.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

  # -- Port WebAdmin listens on (HTTPS). 8444 is WebAdmin's documented default. It is passed to the
  # container as `PORT`, because the image's built-in config still says 3000.
  containerPort: 8444

  service:
    # -- Service type for WebAdmin (LoadBalancer, ClusterIP, NodePort)
    type: LoadBalancer
    # -- Service port for WebAdmin
    port: 8444

  # -- Extra environment variables for WebAdmin, e.g. `BRIDGELINK_PUBLIC_HOST` or `COOKIE_SECURE`.
  # `BRIDGELINK_SERVER_URL`, `PORT` and `BL_ACCEPT_LICENSE` are set by the chart and ignored here.
  env: {}

  resources:
    requests:
      # -- CPU request for WebAdmin pods
      cpu: 100m
      # -- Memory request for WebAdmin pods
      memory: 256Mi
    limits:
      # -- CPU limit for WebAdmin pods
      cpu: 500m
      # -- Memory limit for WebAdmin pods
      memory: 512Mi

  # -- Liveness probe for WebAdmin. The image has no health endpoint, so this checks the port.
  livenessProbe:
    tcpSocket:
      port: https
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3

  # -- Readiness probe for WebAdmin. The image has no health endpoint, so this checks the port.
  readinessProbe:
    tcpSocket:
      port: https
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  # -- Node selector for WebAdmin pods
  nodeSelector: {}
  # -- Pod tolerations for WebAdmin
  tolerations: []
  # -- Pod affinity for WebAdmin
  affinity: {}
