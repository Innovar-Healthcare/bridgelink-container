# -- Override the name of the chart
nameOverride: ""
# -- Provide a name to substitute for the full names of resources
fullnameOverride: ""

# @section BridgeLink Settings
bridgelink:
  # -- Number of BridgeLink replicas to deploy
  replicaCount: 1

  image:
    # -- BridgeLink container image repository
    repository: innovarhealthcare/bridgelink
    # -- BridgeLink container image tag. Defaults to the Rocky image. For the hardened (DHI) image
    # set `tag: 26.3.1-dhi` and `runAsUser: 65532` / `runAsGroup: 65532` (see below).
    tag: 26.3.1
    # -- Image pull policy
    pullPolicy: IfNotPresent

  # -- Non-root UID the container runs as. Use 1000 for the Rocky image, 65532 for the hardened
  # (DHI) image. Must match the image so mounted appdata/custom-extensions are writable.
  runAsUser: 1000
  # -- Non-root GID the container runs as (see runAsUser). 1000 for Rocky, 65532 for DHI.
  runAsGroup: 1000

  service:
    # -- Service type for BridgeLink (LoadBalancer, ClusterIP, NodePort)
    type: LoadBalancer
    ports:
      # -- HTTP port for web interface
      http: 8080
      # -- HTTPS port for secure web interface
      https: 8443

  resources:
    requests:
      # -- CPU request for BridgeLink pods
      cpu: 500m
      # -- Memory request for BridgeLink pods
      memory: 1Gi
    limits:
      # -- CPU limit for BridgeLink pods
      cpu: 2000m
      # -- Memory limit for BridgeLink pods
      memory: 2Gi

  # Probes (IRT-2015). Before this the chart shipped NONE: deployment.yaml templated liveness and
  # readiness, but no values defined them and values.schema.json forbade extra keys, so the
  # templates were unreachable and `--set bridgelink.readinessProbe...` was schema-rejected.
  #
  # Startup and readiness `exec` the probe class baked into both images. They parse the body of
  # /api/server/status, because that endpoint returns HTTP 200 even when the engine is UNAVAILABLE
  # — so an httpGet probe cannot tell ready from starting. Liveness deliberately IS the cheap
  # httpGet: it must not restart the pod merely because the engine reports UNAVAILABLE during a
  # transient database outage, since a restart does not fix a database. Readiness handles that by
  # pulling the pod out of the Service without killing it.
  #
  # Set `startupProbe: null` (etc.) to disable any of them.

  # -- Startup probe. Gates the other two until the first boot finishes: database connect-with-retry,
  # schema migration and the startup channel deploy all precede status 0. 5s x 60 = 300s budget,
  # matching the images' HEALTHCHECK start-period; a first boot exceeding it gets the pod killed, so
  # raise failureThreshold for a large migration.
  startupProbe:
    exec:
      command: ["java", "-XX:TieredStopAtLevel=1", "-XX:+UseSerialGC", "-XX:-UsePerfData", "-Xmx32m", "-cp", "/opt/bridgelink/bootstrap", "BridgeLinkHealthcheck"]
    periodSeconds: 5
    failureThreshold: 60
    # timeoutSeconds is NOT optional: Kubernetes defaults exec probes to 1s and enforces it, and a
    # cold JVM plus a TLS handshake against a server mid-migration exceeds that on a loaded node —
    # the probe would then never succeed. Must stay above the probe's own 4s internal timeout.
    timeoutSeconds: 5

  # -- Readiness probe. Gates Service traffic on engine status 0 (database up, engine running,
  # startup deploy done). 15s rather than 5s because an exec probe's JVM is charged to this
  # container's cgroup: ~50-80MB alongside the server. Fine at the default heap, but leave headroom
  # under `resources.limits.memory` if you raise -Xmx toward the limit.
  readinessProbe:
    exec:
      command: ["java", "-XX:TieredStopAtLevel=1", "-XX:+UseSerialGC", "-XX:-UsePerfData", "-Xmx32m", "-cp", "/opt/bridgelink/bootstrap", "BridgeLinkHealthcheck"]
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3

  # -- Liveness probe. Restarts the pod only when the API stops answering at all. kubelet does not
  # verify the certificate on an HTTPS probe, so the self-signed keystore needs no configuration.
  # The X-Requested-With header is required (server.api.require-requested-with, default true) —
  # without it the endpoint returns HTTP 400 even though it needs no authentication.
  livenessProbe:
    httpGet:
      path: /api/server/status
      port: https
      scheme: HTTPS
      httpHeaders:
        - name: X-Requested-With
          value: kube-probe
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3

  # -- Node selector for BridgeLink pods
  nodeSelector: {}
  # -- Pod tolerations for BridgeLink
  tolerations: []
  # -- Pod affinity for BridgeLink
  affinity: {}

  environment:
    # -- Database type (postgres, mysql, oracle, sqlserver)
    MP_DATABASE: "postgres"
    # -- Database connection URL
    MP_DATABASE_URL: "jdbc:postgresql://{{ include \"bridgelink.fullname\" . }}-postgres:5432/{{ .Values.postgres.credentials.database }}"
    # -- Database username
    MP_DATABASE_USERNAME: "{{ .Values.postgres.credentials.username }}"
    # -- Database password
    MP_DATABASE_PASSWORD: "{{ .Values.postgres.credentials.password }}"
    # -- Unique server identifier
    SERVER_ID: 7d760af2-680a-4a19-b9a2-c4685df61ebc
    # -- Keystore key password
    MP_KEYSTORE_KEYPASS: bridgelinkKeystore
    # -- Keystore store password
    MP_KEYSTORE_STOREPASS: bridgelinkKeypass
    # -- Configuration map location
    MP_CONFIGURATIONMAP_LOCATION: database

# @section PostgreSQL Settings
postgres:
  # -- Enable PostgreSQL deployment (set to false to use external database)
  enabled: true

  image:
    # -- PostgreSQL image repository
    repository: postgres
    # -- PostgreSQL image tag (kept in sync with docker-compose.yml)
    tag: 16-alpine
    # -- PostgreSQL image pull policy
    pullPolicy: IfNotPresent
  
  service:
    # -- PostgreSQL port number
    port: 5432

  persistence:
    # -- Enable PostgreSQL persistence
    enabled: true
    # -- PostgreSQL storage size
    size: 10Gi
    # -- Storage class for PostgreSQL (empty uses cluster default)
    storageClass: ""

  credentials:
    # -- PostgreSQL username
    username: bridgelinktest
    # -- PostgreSQL password
    password: bridgelinktest
    # -- PostgreSQL database name
    database: bridgelinkdb

  resources:
    requests:
      # -- PostgreSQL CPU request
      cpu: 200m
      # -- PostgreSQL memory request
      memory: 256Mi
    limits:
      # -- PostgreSQL CPU limit
      cpu: 1000m
      # -- PostgreSQL memory limit
      memory: 1Gi