{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bridgelink.fullname" . }}-postgres
  labels:
    {{- include "bridgelink.postgresLabels" . | nindent 4 }}
spec:
  replicas: 1
  # Recreate: the data volume is ReadWriteOnce, so a rolling update can stall on a Multi-Attach error
  # when the new pod is scheduled on another node while the old one still holds the volume.
  strategy:
    type: Recreate
    # Not redundant. A release created by an older chart has the API server's default
    # rollingUpdate block, which Kubernetes rejects alongside Recreate; the explicit null makes a
    # client-side upgrade remove it. See the README's Upgrading section for server-side apply.
    rollingUpdate: null
  selector:
    matchLabels:
      {{- include "bridgelink.postgresSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bridgelink.postgresSelectorLabels" . | nindent 8 }}
      # Restart Postgres when its config changes. Both files are subPath mounts, which never receive
      # ConfigMap updates in a running container, so without this a pg_hba.conf change would wait for
      # an unrelated restart to take effect. Only `data` is hashed: the labels carry the chart version,
      # and a release that does not touch the config should not restart the database.
      annotations:
        checksum/config: {{ (include (print $.Template.BasePath "/postgres-configmap.yaml") . | fromYaml).data | toYaml | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports:
            - containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.credentials.password | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.credentials.username | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.credentials.database | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
            - name: postgres-config
              mountPath: /etc/postgresql/postgresql.conf
              subPath: postgresql.conf
            - name: postgres-config
              mountPath: /etc/postgresql/pg_hba.conf
              subPath: pg_hba.conf
          args:
            - "-c"
            - "config_file=/etc/postgresql/postgresql.conf"
            - "-c"
            - "hba_file=/etc/postgresql/pg_hba.conf"
      volumes:
        - name: postgres-data
          {{- if .Values.postgres.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "bridgelink.fullname" . }}-postgres
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: postgres-config
          configMap:
            name: {{ include "bridgelink.fullname" . }}-postgres-config
{{- end }}