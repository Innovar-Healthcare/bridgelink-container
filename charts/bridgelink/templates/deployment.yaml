apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bridgelink.fullname" . }}-bl
  labels:
    {{- include "bridgelink.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.bridgelink.replicaCount }}
  # Recreate, not the default RollingUpdate: a rolling update starts the new pod before stopping the
  # old one, and two engines sharing one server ID and one database can process the same polled work
  # (File, Database, SFTP readers) twice.
  strategy:
    type: Recreate
    # Not redundant. A release created by an older chart has the API server's default
    # rollingUpdate block, which Kubernetes rejects alongside Recreate; the explicit null makes a
    # client-side upgrade remove it. See the README's Upgrading section for server-side apply.
    rollingUpdate: null
  selector:
    matchLabels:
      {{- include "bridgelink.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bridgelink.selectorLabels" . | nindent 8 }}
        {{- /* The selector labels are fixed: a Deployment's selector cannot change after creation. */}}
        {{- with omit (.Values.bridgelink.podLabels | default dict) "app" "app.kubernetes.io/name" "app.kubernetes.io/instance" }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.bridgelink.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- /* Only when asked for, so a release that sets neither keeps an unchanged pod template. */}}
      {{- if or .Values.serviceAccount.create .Values.serviceAccount.name }}
      serviceAccountName: {{ include "bridgelink.serviceAccountName" . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Restricted Pod Security Standard by default. fsGroup makes appdata writable by the BridgeLink
      # user on volumes that support it (emptyDir, EBS), which is what used to need a root init
      # container. See bridgelink.podSecurityContext in values.yaml.
      securityContext:
        {{- toYaml (merge (deepCopy (.Values.bridgelink.podSecurityContext | default dict)) (dict "runAsUser" .Values.bridgelink.runAsUser "runAsGroup" .Values.bridgelink.runAsGroup "fsGroup" .Values.bridgelink.runAsGroup)) | nindent 8 }}
      {{- if .Values.bridgelink.keystore.existingSecret }}
      initContainers:
        # Copies the keystore from the Secret into appdata on every start, so the Secret is the source
        # of truth. Copied rather than mounted because the server rewrites keystore.jks at startup,
        # which a read-only Secret mount would make fail.
        - name: keystore
          image: "{{ .Values.bridgelink.helperImage.repository }}:{{ .Values.bridgelink.helperImage.tag }}"
          imagePullPolicy: {{ .Values.bridgelink.helperImage.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              umask 077
              cp /keystore/keystore.jks /appdata/.keystore.jks.tmp
              mv -f /appdata/.keystore.jks.tmp /appdata/keystore.jks
              echo "Copied keystore.jks from Secret {{ .Values.bridgelink.keystore.existingSecret }} into appdata."
          {{- with .Values.bridgelink.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: keystore
              mountPath: /keystore
              readOnly: true
            - name: appdata
              mountPath: /appdata
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.bridgelink.image.repository }}:{{ .Values.bridgelink.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.bridgelink.image.pullPolicy }}
          {{- with .Values.bridgelink.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- range .Values.bridgelink.extraPorts }}
            - name: {{ .name }}
              containerPort: {{ .containerPort }}
              protocol: {{ .protocol | default "TCP" }}
            {{- end }}
          volumeMounts:
            - name: appdata
              mountPath: /opt/bridgelink/appdata
            - name: blserver-vmoptions
              mountPath: /opt/bridgelink/secrets/vmoptions
              subPath: blserver-vmoptions
            {{- with .Values.bridgelink.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- /* An extraEnv entry replaces any variable of the same name the chart would set. */}}
            {{- $extra := list }}
            {{- range .Values.bridgelink.extraEnv }}
            {{- $extra = append $extra .name }}
            {{- end }}
            {{- /* Not even evaluated when overridden: the helper fails when it finds no URL. */}}
            {{- if not (has "MP_DATABASE_URL" $extra) }}
            {{- with include "bridgelink.databaseUrl" . }}
            - name: MP_DATABASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with include "bridgelink.databaseUsername" . }}
            {{- if not (has "MP_DATABASE_USERNAME" $extra) }}
            - name: MP_DATABASE_USERNAME
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with include "bridgelink.databasePassword" . }}
            {{- if not (has "MP_DATABASE_PASSWORD" $extra) }}
            - name: MP_DATABASE_PASSWORD
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- $skip := concat $extra (list "MP_DATABASE_URL" "MP_DATABASE_USERNAME" "MP_DATABASE_PASSWORD" "CUSTOM_VMOPTIONS_PATH") }}
            {{- with .Values.bridgelink.keystore.existingSecret }}
            {{- $skip = concat $skip (list "MP_KEYSTORE_STOREPASS" "MP_KEYSTORE_KEYPASS") }}
            {{- if not (has "MP_KEYSTORE_STOREPASS" $extra) }}
            - name: MP_KEYSTORE_STOREPASS
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: keystore.storepass
            {{- end }}
            {{- if not (has "MP_KEYSTORE_KEYPASS" $extra) }}
            - name: MP_KEYSTORE_KEYPASS
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: keystore.keypass
            {{- end }}
            {{- end }}
            {{- /* SERVER_ID goes back in resolved, so it keeps its sorted position and an upgrade
            that does not set it renders the same pod template as before. Not evaluated when
            extraEnv supplies it: the helper fails a new install that has no ID. */}}
            {{- $env := omit .Values.bridgelink.environment "SERVER_ID" }}
            {{- if not (has "SERVER_ID" $extra) }}
            {{- $_ := set $env "SERVER_ID" (include "bridgelink.serverId" .) }}
            {{- end }}
            {{- /* Keys resolved above are skipped here to avoid duplicates. */}}
            {{- range $key, $value := $env }}
            {{- if not (has $key $skip) }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- if not (has "CUSTOM_VMOPTIONS_PATH" $extra) }}
            - name: CUSTOM_VMOPTIONS_PATH
              value: /opt/bridgelink/secrets/vmoptions
            {{- end }}
            {{- with .Values.bridgelink.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.bridgelink.resources | nindent 12 }}
          {{- if .Values.bridgelink.startupProbe }}
          startupProbe:
            {{- toYaml .Values.bridgelink.startupProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.bridgelink.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.bridgelink.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.bridgelink.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.bridgelink.readinessProbe | nindent 12 }}
          {{- end }}
      volumes:
        # appdata holds keystore.jks, which carries the data-encryption key. On an emptyDir it is lost,
        # and with it every encrypted message, whenever the pod is replaced.
        - name: appdata
          {{- if .Values.bridgelink.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.bridgelink.persistence.existingClaim | default (printf "%s-appdata" (include "bridgelink.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- with .Values.bridgelink.keystore.existingSecret }}
        - name: keystore
          secret:
            secretName: {{ . }}
            items:
              - key: keystore.jks
                path: keystore.jks
        {{- end }}
        - name: blserver-vmoptions
          secret:
            secretName: {{ include "bridgelink.fullname" . }}-vmoptions
        {{- with .Values.bridgelink.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.bridgelink.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.bridgelink.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.bridgelink.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}