{{- /* The passwords not supplied by a Secret of your own. Rendered only when there is at least one. */}}
{{- with (include "bridgelink.credentials" . | fromJson).data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bridgelink.fullname" $ }}-credentials
  labels:
    {{- include "bridgelink.labels" $ | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := . }}
  {{ $key }}: {{ $value | b64enc }}
  {{- end }}
{{- end }}
