# Hardened (Docker Hardened Image / DHI) variant of docker-compose.yml.
# Differences vs the Rocky compose: the -dhi image tag and the non-root UID (65532, not 1000).
# The mounted ./appdata dir must be writable by UID 65532 (e.g. `chown -R 65532:65532 ./appdata`).
# HEALTHCHECK (IRT-2015): images built from this repo at this commit or later declare one, so no
# `healthcheck:` block is needed — it probes GET /api/server/status and reports healthy only once the
# engine is running and the startup channel deploy has finished, not merely once port 8443 answers.
#
# NOTE the tag pinned below predates that change. Until an image carrying the probe is published,
# `condition: service_healthy` against it fails with "has no healthcheck configured" — bump the tag
# to a release built from this commit, or keep your own `healthcheck:` block, before relying on it.
#
# A container that must not start until BridgeLink is genuinely ready then gates on it:
#
#   my-config-loader:
#     depends_on:
#       bl:
#         condition: service_healthy
#         restart: true
#
# To opt out of the image's healthcheck for a service, add `healthcheck: {disable: true}`.
services:
  bl:
    image: innovarhealthcare/bridgelink:26.6.1-dhi
    stdin_open: true
    tty: true
    user: 65532:65532
    ports:
      - "8443:8443"
    volumes:
      - ./appdata:/opt/bridgelink/appdata
    environment:
      MP_DATABASE: postgres
      MP_DATABASE_URL: jdbc:postgresql://postgres:5432/bridgelinkdb
      MP_DATABASE_USERNAME: bridgelinktest
      MP_DATABASE_PASSWORD: bridgelinktest
      SERVER_ID: 7d760af2-680a-4a19-b9a2-c4685df61ebc
      MP_KEYSTORE_KEYPASS: bridgelinkKeystore
      MP_KEYSTORE_STOREPASS: bridgelinkKeypass
      MP_CONFIGURATIONMAP_LOCATION: database
    security_opt:
      - no-new-privileges:true
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: bridgelinktest
      POSTGRES_USER: bridgelinktest
      POSTGRES_DB: bridgelinkdb
