# Both images declare a HEALTHCHECK (IRT-2015), so no `healthcheck:` block is needed here — it
# probes GET /api/server/status and reports healthy only once the engine is running and the startup
# channel deploy has finished, not merely once port 8443 answers.
#
# A container that must not start until BridgeLink is genuinely ready can therefore gate on it:
#
#   my-config-loader:
#     depends_on:
#       bl:
#         condition: service_healthy
#         restart: true
#
# To opt out of the image's healthcheck for a service, add `healthcheck: {disable: true}`.
services:
  bl:
    image: innovarhealthcare/bridgelink:26.3.1
    stdin_open: true
    tty: true
    user: 1000:1000
    ports:
      - "8443:8443"
    volumes:
      - ./appdata:/opt/bridgelink/appdata
    environment:
      MP_DATABASE: postgres
      MP_DATABASE_URL: jdbc:postgresql://postgres:5432/bridgelinkdb
      MP_DATABASE_USERNAME: bridgelinktest
      MP_DATABASE_PASSWORD: bridgelinktest
      SERVER_ID: 7d760af2-680a-4a19-b9a2-c4685df61ebc
      MP_KEYSTORE_KEYPASS: bridgelinkKeystore
      MP_KEYSTORE_STOREPASS: bridgelinkKeypass
      MP_CONFIGURATIONMAP_LOCATION: database
    security_opt:
      - no-new-privileges:true
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: bridgelinktest
      POSTGRES_USER: bridgelinktest
      POSTGRES_DB: bridgelinkdb

