# HEALTHCHECK (IRT-2015): images built from this repo at this commit or later declare one, so no
# `healthcheck:` block is needed — it probes GET /api/server/status and reports healthy only once the
# engine is running and the startup channel deploy has finished, not merely once port 8443 answers.
#
# A container that must not start until BridgeLink is genuinely ready then gates on it:
#
#   my-config-loader:
#     depends_on:
#       bl:
#         condition: service_healthy
#         restart: true
#
# To opt out of the image's healthcheck for a service, add `healthcheck: {disable: true}`.
#
# WebAdmin (the browser-based administrator) is optional and off by default. To run it alongside:
#
#   BL_ACCEPT_LICENSE=1 docker compose --profile webadmin up
#
# then open https://localhost:8444. A plain `docker compose up` does not start it. If WebAdmin is
# your only admin client, a `-slim` image drops the bundled Swing Administrator. For this Rocky image
# there is no published slim tag; build one with INCLUDE_ADMIN_CLIENT=false (see the README), or use
# docker-compose.dhi.yml, whose image has a published `-dhi-slim` tag.
services:
  bl:
    image: innovarhealthcare/bridgelink:26.6.1
    stdin_open: true
    tty: true
    user: 1000:1000
    ports:
      - "8443:8443"
    volumes:
      - ./appdata:/opt/bridgelink/appdata
    environment:
      MP_DATABASE: postgres
      MP_DATABASE_URL: jdbc:postgresql://postgres:5432/bridgelinkdb
      MP_DATABASE_USERNAME: bridgelinktest
      MP_DATABASE_PASSWORD: bridgelinktest
      SERVER_ID: 7d760af2-680a-4a19-b9a2-c4685df61ebc
      MP_KEYSTORE_KEYPASS: bridgelinkKeystore
      MP_KEYSTORE_STOREPASS: bridgelinkKeypass
      MP_CONFIGURATIONMAP_LOCATION: database
    security_opt:
      - no-new-privileges:true
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: bridgelinktest
      POSTGRES_USER: bridgelinktest
      POSTGRES_DB: bridgelinkdb

  # Started only with `--profile webadmin`. It waits for BridgeLink to report healthy, not merely for
  # port 8443 to open, so the first login does not race the startup channel deploy.
  webadmin:
    # WebAdmin is released separately from BridgeLink; 26.6.0 is the newest WebAdmin release for the
    # 26.6 line. Bump this together with the `bl` tag above.
    image: innovarhealthcare/bridgelink-webadmin:26.6.0
    profiles: [webadmin]
    ports:
      - "8444:8444"
    environment:
      BRIDGELINK_SERVER_URL: https://bl:8443
      # 8444 is WebAdmin's documented default port. The image's built-in config still says 3000, so
      # set it here.
      PORT: "8444"
      # WebAdmin is licensed under the Business Source License 1.1 and the BridgeLink WebAdmin
      # Supplemental Terms. Read them without starting WebAdmin:
      #   docker run --rm --entrypoint cat innovarhealthcare/bridgelink-webadmin:26.6.0 \
      #     /app/LICENSE /app/SUPPLEMENTAL-TERMS.md
      # Accepting them is your decision, so this file does not do it for you: with this unset the
      # container prints a notice and exits. Set BL_ACCEPT_LICENSE=1 in your shell or in a .env file.
      BL_ACCEPT_LICENSE: ${BL_ACCEPT_LICENSE:-}
    security_opt:
      - no-new-privileges:true
    depends_on:
      bl:
        condition: service_healthy
