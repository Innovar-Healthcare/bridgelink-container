# scripts/deploy-minikube.sh passes bridgelink.environment.SERVER_ID itself. With this file and helm
# directly, add --set bridgelink.environment.SERVER_ID=<a new UUID>: the chart requires one on install.
bridgelink:
  service:
    type: LoadBalancer
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

postgres:
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
